title: "DOMPurify: Permanent `ALLOWED_ATTR` pollution via `setConfig()` bypassing
  the hook clone-guard (incomplete fix of the 3.4.7 hook-pollution patch)"
description: "DOMPurify 3.4.7 shipped a security fix (\"permanent hook pollution\")
  that makes a registered `uponSanitizeAttribute` hook's mutation of `data.allowedAttributes`
  **non-persistent** — so allowing an attribute for one element does not leak into
  later `sanitize()` calls. The fix clones `ALLOWED_ATTR` inside `_parseConfig`.\n\nThat
  guard is **silently bypassed whenever the application uses the persistent-config
  API `DOMPurify.setConfig()`.** `setConfig()` sets the module flag `SET_CONFIG =
  true`, which causes `sanitize()` to **skip `_parseConfig` entirely** — and the clone-guard
  lives inside `_parseConfig`. The hook is then handed the **live, shared `ALLOWED_ATTR`
  object**; any `data.allowedAttributes[name] = true` it writes mutates that shared
  object **permanently**, for the lifetime of the DOMPurify instance, across every
  subsequent call, and across **all** elements.\n\nIf an application uses `setConfig()`
  together with an `uponSanitizeAttribute` hook that conditionally allows a dangerous
  attribute (`onerror`, `onclick`, `onmouseover`, `srcdoc`, `formaction`, …) for \"trusted\"
  elements, then **one trusted render permanently allows that attribute on untrusted,
  attacker-controlled content** — yielding stored XSS in viewers' browsers. DOMPurify
  applies no separate `/^on/` event-handler blocklist: attribute stripping is governed
  entirely by the allowlist, so a polluted allowlist is the only gate, and survival
  in the output is final.\n\n---"
