title: "DOMPurify: IN_PLACE: node-removing afterSanitize hook leaves detached subtree
  event handlers armed, causing DOM XSS"
description: "In `IN_PLACE` mode DOMPurify sanitizes the caller's live DOM subtree
  directly. To close a known hazard (GHSA-55q2-fjhq-7xh7), the library neutralizes
  any node a hook detaches during sanitization by stripping its subtree's non-allow-listed
  attributes, but this neutralization is wired only into the `beforeSanitizeElements`
  and `uponSanitizeElement` hook sites. An `afterSanitizeElements` or `afterSanitizeAttributes`
  hook that removes a non-root element (a documented, supported pattern) detaches
  that element's subtree with no neutralization, so descendant `on*` handlers remain
  armed on the caller's live tree after `sanitize()` returns, yielding DOM XSS. No
  special privilege is required beyond supplying markup to an application that uses
  `IN_PLACE` together with a node-removing afterSanitize hook."
