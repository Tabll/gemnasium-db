title: "DOMPurify IN_PLACE: hook that removes a parent or sibling leaves the detached
  subtree's event handlers armed (incomplete fix for GHSA-p98j-92pf-mc4p)"
description: "The 3.4.16 fix for GHSA-p98j-92pf-mc4p only covers a hook that removes
  the node it was called for. If an `IN_PLACE` hook removes a different node, like
  the current node's parent or a sibling that has not been visited yet, that subtree
  is never walked or neutralized. Event handlers in it stay on the elements, and an
  `<img onerror>` that was already loading fires after `sanitize()` returns.\n\nThe
  README says: \"Nodes that a hook detaches from the tree ... are treated as removed.
  In IN_PLACE mode their subtree is neutralized inline, so an `<img onload>` that
  was already loading when you built the live tree cannot fire after `sanitize()`
  returns.\" That does not hold when the detached node is not the hook's own node."
