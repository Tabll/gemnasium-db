package_slug: "npm/dompurify"
title: "DOMPurify: Trusted Types policy survives `clearConfig()` and can poison later
  `RETURN_TRUSTED_TYPE` output"
description: "A DOMPurify instance that is reused across trust boundaries can stay
  bound to a previously supplied `TRUSTED_TYPES_POLICY` even after `clearConfig()`
  is called. A later caller that requests `RETURN_TRUSTED_TYPE` receives a `TrustedHTML`
  object created by the old policy, not by a clean default configuration."
