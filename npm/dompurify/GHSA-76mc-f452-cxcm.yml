title: "DOMPurify: Hook mutation of `data.allowedTags` / `data.allowedAttributes`
  permanently pollutes `DEFAULT_ALLOWED_TAGS` / `DEFAULT_ALLOWED_ATTR`"
description: "The `data.allowedTags` and `data.allowedAttributes` fields passed to
  `uponSanitizeElement` and `uponSanitizeAttribute` hooks are **direct references**
  to the library's live `ALLOWED_TAGS` / `ALLOWED_ATTR` sets. For sanitize calls that
  don't supply an explicit `cfg.ALLOWED_TAGS` / `cfg.ALLOWED_ATTR` array, those live
  sets are themselves direct references to the module-level `DEFAULT_ALLOWED_TAGS`
  / `DEFAULT_ALLOWED_ATTR` constants. A hook that mutates these fields — a natural-looking
  pattern for \"allow `X` for this iteration\" — permanently writes new entries into
  the default constants for the DOMPurify instance's lifetime. Every subsequent sanitize
  call that doesn't override the config inherits the widened defaults, so an attacker
  payload that uses the poisoned tag/attribute name survives sanitization. `removeAllHooks()`,
  `clearConfig()`, and even passing a fresh `cfg: {}` do not recover; only constructing
  a new DOMPurify instance does.\n\nThe maintainer's existing defense at `src/purify.ts:696-700`
  explicitly clones `DEFAULT_ALLOWED_TAGS` before mutating it via `cfg.ADD_TAGS` (array
  form), demonstrating awareness of this exact class. The hook path remained uncovered."
