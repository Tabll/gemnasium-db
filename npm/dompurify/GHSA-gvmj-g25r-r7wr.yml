package_slug: "npm/dompurify"
title: "DOMPurify: SAFE_FOR_TEMPLATES bypass - template expressions survive sanitization
  inside <template> content when using DOM output modes"
description: "When DOMPurify is configured with both `SAFE_FOR_TEMPLATES: true` and
  `RETURN_DOM: true` (or `IN_PLACE: true`), an attacker can inject template expressions,
  such as `${evil}`, `{{evil}}`, or `<%evil%>`, that survive the sanitization pass
  inside `<template>` element content. This bypasses the explicit purpose of `SAFE_FOR_TEMPLATES`,
  which is to prevent template engine evaluation of user-supplied content.\n\n> **Note:**
  The string output path is **not** affected. Only the DOM return paths (`RETURN_DOM:
  true`, `RETURN_DOM_FRAGMENT: true`, `IN_PLACE: true`) are vulnerable.\n\n---"
