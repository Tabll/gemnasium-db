title: "DOMPurify: IN_PLACE hook removal leaves a detached subtree executable, causing
  XSS"
description: "During `IN_PLACE` sanitization, a hook that removes an element can leave
  that element's detached descendants executable. A descendant image can retain its
  attacker-provided `onload` handler and fire after `sanitize()` returns, even though
  the returned root is clean and the image remains disconnected from the document."
