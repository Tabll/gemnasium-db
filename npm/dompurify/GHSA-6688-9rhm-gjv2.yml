title: "DOMPurify: IN_PLACE returns a force-removed rawtext root whose text carries
  attacker markup — pure HTML reparse executes"
description: "The 3.4.9 fix for the IN_PLACE detached-root class added two protections
  on the IN_PLACE return path: a fail-closed `TypeError` in `_forceRemove` when a
  node selected for removal cannot be detached, and a `_neutralizeSubtree` pass (`dist/purify.js`
  line 1336) that strips non-allowlisted **attributes** from removed subtrees.\n\nBoth
  miss the rawtext **text-content** form. When the force-removed root is a rawtext
  element (`<style>`), the payload lives in the node's *text*: the node detaches fine
  (the `TypeError` guard is not reached), `_neutralizeSubtree` strips nothing (there
  are no attributes), and the IN_PLACE exit returns the detached, never-sanitized
  `<style>` whose text still carries live markup. Serializing that node and re-parsing
  it in **plain HTML context** materializes the payload — no foreign-content context
  required.\n\nThe same Node input sanitized **without** `IN_PLACE` returns an empty
  result: the only difference is the IN_PLACE return path handing the killed node
  back."
