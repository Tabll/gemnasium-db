package_slug: "npm/dompurify"
title: "DOMPurify: `IN_PLACE` mode trusts attacker-controlled `nodeName` on live non-form
  nodes, allowing script retention and XSS via attacker-supplied DOM objects"
description: "When `DOMPurify.sanitize(root, { IN_PLACE: true })` is called on an
  attacker-supplied live DOM node, `DOMPurify` still trusts `currentNode.nodeName`
  for non-`form` nodes in the main `_sanitizeElements` pipeline. A real `<script>`
  child node whose observable `nodeName` is attacker-controlled can therefore be misclassified
  as an allowed element and retained. When the sanitized tree is inserted into a live
  document, the script executes.\n\nThis affects current `3.4.6`. The recent `IN_PLACE`
  hardening work covers clobbered `form` handling and foreign-realm shadow/template
  traversal, but does not harden the main per-node element decision for hostile non-`form`
  live nodes."
