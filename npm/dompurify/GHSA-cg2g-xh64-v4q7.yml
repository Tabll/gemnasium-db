package_slug: "npm/dompurify"
title: "DOMPurify SAFE_FOR_TEMPLATES bypass: split template expressions survive in
  attached shadow root content on DOM output modes"
description: "When DOMPurify is configured with `SAFE_FOR_TEMPLATES: true` together
  with a DOM-returning mode (`RETURN_DOM: true`, `RETURN_DOM_FRAGMENT: true`, or `IN_PLACE:
  true`), template expressions such as `{{...}}`, `${...}`, and `<%...%>` survive
  sanitization inside the text content of an attached shadow root. The post-walk safety
  net `_scrubTemplateExpressions` (`src/purify.ts:1717`) was extended to recurse into
  `<template>.content`, but it never recurses into attached shadow roots. An attacker
  who can supply a DOM node carrying a shadow root (the `IN_PLACE` and shadow-aware
  `RETURN_DOM` surfaces) can split an expression across text nodes separated by disallowed
  elements; after those elements are removed the fragments become adjacent and serialize
  into a complete expression that a downstream template engine will evaluate."
