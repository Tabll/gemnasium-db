package_slug: "npm/@backstage/plugin-auth-backend"
title: "@backstage/plugin-auth-backend: Unauthenticated OAuth account takeover via
  `redirect_uri` allowlist bypass"
description: "The allowlist matching used by the experimental dynamic client registration
  and client ID metadata document (CIMD) features in `@backstage/plugin-auth-backend`
  matched glob patterns against the full URL string. A * wildcard could therefore
  match across URL component boundaries: a pattern such as `https://*.example.com/callback`,
  intended to allow subdomains of a trusted host, would also match an attacker-controlled
  URL such as `https://attacker.example/x.example.com/callback`. This applies to `auth.experimentalDynamicClientRegistration.allowedRedirectUriPatterns`
  as well as the `allowedClientIdPatterns` and `allowedRedirectUriPatterns` options
  of `auth.experimentalClientIdMetadataDocuments`.\n\nAn attacker could use this to
  register an OAuth client whose redirect URI points to a host they control while
  still passing the allowlist, causing authorization codes to be delivered to the
  attacker when a victim completes an authorization flow. In addition, allowlist patterns
  without an explicit protocol could match URLs with any protocol, and redirect URIs
  containing embedded credentials (user:pass@host) were accepted after the credentials
  were stripped for matching.\n\nThe practical impact is limited. Both features are
  experimental and disabled by default, and the default allowlist patterns only reference
  fixed or loopback hosts and are not affected. Deployments are only impacted if they
  enable one of these features and configure custom allowlist patterns that contain
  a wildcard in the hostname, or patterns without an explicit protocol."
