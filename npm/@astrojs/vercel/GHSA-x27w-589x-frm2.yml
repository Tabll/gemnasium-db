package_slug: "npm/@astrojs/vercel"
title: "Astro: Unauthenticated path override in the @astrojs/vercel ISR function"
description: "When ISR is enabled, the serverless entrypoint lets an unauthenticated
  request\ndecide which route the origin renders. The internal `_isr` function reads
  the\n`x_astro_path` query parameter and rewrites the request path to it without
  any\nauthentication. Edge level access controls only ever see the `/_isr` path,
  so\nthey do not apply to the route that actually gets rendered. This is the same\nconfused
  deputy problem as CVE-2026-33768, reachable again through the ISR path."
