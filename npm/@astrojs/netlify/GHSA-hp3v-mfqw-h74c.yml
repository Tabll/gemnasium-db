package_slug: "npm/@astrojs/netlify"
title: "@astrojs/netlify generates an overly-broad Netlify Image CDN allowlist because
  remotePatterns.pathname metacharacters are not escaped"
description: "The `@astrojs/netlify` adapter converts each `image.remotePatterns`
  entry into a regular expression that is written to `.netlify/v1/config.json` under
  `images.remote_images`. Netlify's Image CDN uses these regexes as the allowlist
  that decides which remote image URLs it will optimize. `remotePatternToRegex()`
  escapes `.` in the hostname but interpolates the literal `pathname` into the regex
  **without escaping regex metacharacters**. As a result, the generated allowlist
  is broader than the pattern the developer declared, and broader than Astro's canonical
  `matchPattern()` helper (which compares non-wildcard pathnames by exact string equality).\n\nThis
  is a residual of the same bug class addressed in CVE-2026-54300 (PR #17018, commit
  `1310277d`). That fix corrected wildcard semantics and added a `$` anchor but did
  not add metacharacter escaping for literal pathnames."
