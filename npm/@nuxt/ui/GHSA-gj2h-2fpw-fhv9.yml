package_slug: "npm/@nuxt/ui"
title: "@nuxt/ui: UAuthForm / UForm SSR markup omits `method`, leaking credentials
  via GET if submitted before hydration"
description: "`UForm` and `UAuthForm` render a server-side `<form>` element with no
  `method` and no `action` attribute, relying on a hydrated `@submit.prevent` handler
  to intercept submission. If a user submits the form before Vue hydration has attached
  the handler (autofill plus Enter on a slow network, JS bundle blocked by CSP or
  CDN failure, etc.), the browser performs the native default: a `GET` to the current
  URL with every named field, including `<input type=\"password\">`, serialised into
  the query string."
