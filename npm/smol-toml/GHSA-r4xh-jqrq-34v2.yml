title: "smol-toml: Quadratic-time parse() from parseKey rescanning to end of document
  on each key line"
description: "`parse()` has a quadratic-time path in `parseKey`, reachable on default
  options with ordinary valid input. For every key line and table-header line, `parseKey`
  (dist/struct.js, lines 58 and 86) finds the dotted-key separator with `ctx.s.indexOf('.',
  ctx.p)`, where `ctx.s` is the whole document. When a key has no `.` ahead of it,
  that search runs all the way to the end of the input, and the result is then clamped
  back to the line terminator `endPtr` - so everything scanned past the current line
  is wasted. `parseKey` runs once per line, so a document of N dot-free keys costs
  O(n^2).\n\nThe most ordinary TOML shape triggers it: a flat list of `key = value`
  lines, or a repeated `[[a]]` table. No dotted keys, no special options, valid input
  throughout."
