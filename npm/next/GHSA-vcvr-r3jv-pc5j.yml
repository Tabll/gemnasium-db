title: "Next.js: Remote Code Execution in next/og ImageResponse"
description: "The Node.js `ImageResponse` implementation from `next/og` is affected
  by an upstream vulnerability. This can lead to remote code execution.\n\nAffected
  applications pass attacker-controlled values into SVG content, attributes, or styles
  during image generation:\n\n```tsx\nimport { ImageResponse } from 'next/og'\n\nexport
  async function GET(request: Request) {\nconst value = new URL(request.url).searchParams.get('value')
  ?? ''\n\nreturn new ImageResponse(\n<svg width=\"1200\" height=\"630\">\n<title>{value}</title>\n</svg>\n)\n}\n```\n\nApplications
  using the Edge `ImageResponse` implementation, or applications that do not pass
  attacker-controlled values into SVG content, attributes, or styles, are not affected."
