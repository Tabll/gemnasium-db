title: "Muhammara has a NULL pointer dereference in LZWDecode filter when DecodeParms
  omits EarlyChange key"
description: "A NULL pointer dereference vulnerability exists in `PDFParser::CreateFilterForStream()`
  when processing a PDF stream with `/Filter /LZWDecode` and a `/DecodeParms` dictionary
  that does not contain the `EarlyChange` key. This causes an access violation (0xC0000005)
  and crashes the process."
