package_slug: "npm/safeinstall-cli"
title: "SafeInstall agent guard shell parsing can miss raw package execution"
description: "SafeInstall CLI through 0.10.1 can fail to recognize some package-manager
  and registry-runner commands in its agent guard. Case-variant launcher names, leading
  file-descriptor redirections, and supported shell wrappers with options can cause
  a raw install command to receive no guard decision. Remote project scaffolding through
  package-manager create/init commands can also avoid the approval decision used for
  other registry runners."
