title: "n8n: SSRF Protection Bypass via MCP Client Node"
description: "On an n8n instance with SSRF protection enabled, the MCP Client node
  sent requests to a user-supplied endpoint without routing them through that protection
  and without pinning the resolved address. An authenticated user who could create
  or edit a workflow could therefore cause the server to connect to internal or otherwise
  blocked hosts and read the responses back through the workflow, exposing internal
  services the SSRF protection was meant to protect."
