title: "n8n: Snowflake Node executeQuery Operation Allows SQL Injection via Unparameterized
  Expression Interpolation"
description: "The n8n Snowflake node's Execute Query operation interpolated expression
  values directly into the SQL string, making queries built with untrusted data susceptible
  to SQL injection.\n\nExploitation requires that a workflow author has already embedded
  untrusted expression data directly in a raw SQL query."
