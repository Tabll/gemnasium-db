title: "n8n: Prototype Pollution via VM Expression Engine Sandbox Escape Leads to
  Denial of Service"
description: "An authenticated user able to create or edit a workflow expression could
  abuse the expression engine's array-element access to obtain a reference to a host
  built-in and pollute its prototype in the main n8n process, leading to a denial
  of service.\n\nBoth self-hosted and cloud instances running the VM expression engine
  are affected."
