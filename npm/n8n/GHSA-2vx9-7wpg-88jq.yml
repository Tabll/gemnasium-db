title: "n8n: Legacy ExecuteWorkflow Node Bypassed File Path Restrictions"
description: "The `ExecuteWorkflow` node's `localFile` source option read workflow
  files from disk without applying checks enforced by other file-reading nodes. An
  authenticated user with permission to create or modify workflows could supply an
  arbitrary file path via the REST API, bypassing the `N8N_RESTRICT_FILE_ACCESS_TO`
  restriction. This allowed the attacker to determine whether arbitrary files exist
  on the server host. Where the targeted path contained a valid workflow JSON file,
  the file could additionally be loaded and executed, potentially triggering actions
  on downstream systems connected to that workflow.\n\nThe `localFile` source option
  is hidden from the n8n UI since v1.2 but remains accessible via the REST API."
