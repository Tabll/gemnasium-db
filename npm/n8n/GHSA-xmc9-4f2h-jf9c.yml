title: "n8n: Edit Image Node Format Injection Allows Arbitrary File Write"
description: "The n8n Edit Image node passed its output format to the underlying image
  library without validation, so a crafted value could write bytes to a location outside
  the node's working directory. An authenticated user able to run workflows could
  use this to write arbitrary files in the n8n instance."
