title: "n8n: Public API Execution Retry Authorization Bypass"
description: "The Public API endpoint for retrying executions authorized access using
  `workflow:read` rather than `workflow:execute`. An authenticated user with read-only
  access to a shared workflow could use the Public API to retry executions of that
  workflow, bypassing the intended permission boundary between read and execute access.\n\nThis
  issue affects instances where workflows are shared with other users or across projects."
