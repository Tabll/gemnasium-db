title: "n8n: PostgresTrigger Node SQL Injection Allows Authenticated Users to Execute
  Arbitrary SQL on Connected PostgreSQL Instances"
description: "The Postgres Trigger node interpolated user-supplied identifier parameters
  (channel, function, and trigger names) into SQL statements without proper escaping,
  so an authenticated user could inject arbitrary SQL executed against the connected
  PostgreSQL database with the configured credential's privileges.\n\nSuccessful exploitation
  allows full read and write access to the connected PostgreSQL database."
