package_slug: "npm/n8n"
title: "n8n: Credential Authorization Bypass via Expression in HTTP Request Node `genericAuthType`"
description: "An authenticated member with edit access to a shared workflow could
  reference another user's credential in an HTTP Request node while specifying the
  credential type through an expression. Because the pre-execution permission check
  compared the unresolved expression instead of the real credential type, the ownership
  check was skipped and the credential was loaded at execution time, letting the member
  use or exfiltrate a credential they were never granted. Exploitation required knowing
  the target credential's identifier."
