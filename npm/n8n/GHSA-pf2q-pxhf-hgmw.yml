title: "n8n: Path-Confinement Bypass in computer-use search_files Allows Reading Files
  Outside the Base Directory"
description: "The component `@n8n/computer-use` file-search tool confined searches
  to a configured base directory. A crafted search pattern could bypass the confinement
  check and expand to locations outside that directory, causing the tool to return
  the names and contents of files anywhere the daemon's OS user could read. Any deployment
  where an actor could influence the tool's search input was affected; the result
  was disclosure of arbitrary local files outside the intended sandbox."
