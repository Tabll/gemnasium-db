title: "n8n: Authenticated code execution in the n8n Git node"
description: "Authenticated n8n users with rights to create and execute workflows
  could achieve code execution on the n8n host. Using the Git node, under the default
  `git` security settings, by staging a crafted local repository, an attacker could
  cause `git` to run hooks, executing arbitrary commands as the n8n process user.\n\nBoth
  self-hosted and cloud instances are affected where authenticated users can create
  and execute workflows using the Git node."
