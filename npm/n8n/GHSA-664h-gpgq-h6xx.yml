title: "n8n: Wrong OAuth Scope on Evaluation Test Runs Endpoints"
description: "Three mutating endpoints in the evaluation test runs controller authorized
  state-changing actions using `workflow:read` instead of the action-appropriate `workflow:execute`
  scope. An authenticated user with `project:viewer` role on a project could start
  new evaluation test runs, cancel in-flight runs, and delete run records for workflows
  they only had read access to.\n\nThis issue only affects instances with Advanced
  Permissions (Enterprise/Cloud) where projects and viewer roles are in use."
