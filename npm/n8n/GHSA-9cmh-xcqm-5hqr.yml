title: "n8n: Cross-Tenant Module-Cache Poisoning in the JS Task Runner"
description: "n8n's JavaScript task runner shared one module cache across all users'
  Code-node executions, so a user able to run a Code node could poison a cached module
  and alter other users' Code-node executions on the same runner, affecting their
  confidentiality, integrity, or availability.\n\nThis is a cross-user isolation break
  within a single n8n instance. It does not constitute a sandbox escape or remote
  code execution. All multi-user n8n instances running the JS task runner with built-in
  or external modules enabled are affected."
