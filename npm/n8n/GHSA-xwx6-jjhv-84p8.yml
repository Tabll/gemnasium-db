title: "n8n: Prototype Pollution via Dot-Notation Field Names Leads To Instance-Wide
  Denial of Service"
description: "The Edit Fields (Set) node assigned output fields through a dot-notation
  path setter without restricting the field name, so an authenticated user could name
  a field after an inherited built-in method path and corrupt a shared global in the
  main Node.js process. Because that global was used on the request-authentication
  path, the instance then failed every authenticated request, causing a instance-wide
  denial of service for all users until the process was restarted."
