title: "n8n-mcp affected by path traversal, redirect-following SSRF, and telemetry
  payload exposure"
description: "`n8n-mcp` versions before 2.50.1 contained three independently-reported
  issues affecting deployments that run the n8n API integration:\n\n1. **Caller-supplied
  identifiers were not validated before being used as URL path segments** by the n8n
  API client. An authenticated MCP caller passing a crafted workflow id could cause
  outbound requests carrying the configured n8n API key to land on other same-origin
  endpoints, bypassing handler-level access controls (including `DISABLED_TOOLS`).\n\n2.
  **Validated webhook, form, and chat trigger URLs followed redirects.** A URL that
  passed initial validation could redirect the outbound request to a host that would
  otherwise have been rejected, with the response body returned to the caller. Reachable
  as non-blind SSRF over authenticated MCP calls.\n\n3. **Mutation telemetry stored
  unredacted operation payloads.** On instances running with the default opt-in telemetry,
  partial-update operation diffs were uploaded without redaction. Operation values
  can carry the same node-parameter values the workflow contains, including bearer
  tokens, API keys, and webhook secrets."
