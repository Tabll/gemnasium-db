title: "OpenClaw: Exec approval display truncation could hide the command being approved"
description: "OpenClaw exec approvals could show a shortened command in the approval
  UI while keeping the full original command for execution. For very long commands,
  an approver could see and approve a benign-looking prefix while a hidden suffix
  remained part of the command that would run after approval.\n\nThis issue affects
  the approval display and binding for oversized exec commands. It does not make exec
  available to unauthenticated users, and it does not change OpenClaw's local-first
  trust model."
