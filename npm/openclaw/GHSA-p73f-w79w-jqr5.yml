title: "OpenClaw: Native command authorization could skip owner-command enforcement"
description: "Native command authorization could skip owner-command enforcement. In
  affected versions, a sender able to trigger native command handling could authorize
  a native command without enforcing the configured owner-only command policy.\n\nThis
  advisory is scoped to the named feature and configuration. It does not change OpenClaw's
  trusted-operator model: authenticated Gateway operators, installed plugins, and
  intentional local execution surfaces remain trusted unless a separate policy, approval,
  allowlist, sandbox, or auth boundary is crossed."
