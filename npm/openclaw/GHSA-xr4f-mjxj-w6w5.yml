title: "OpenClaw: Non-owner chat senders could issue device-pairing bootstrap codes"
description: "The bundled device-pair plugin exposed `/pair` on normal chat command
  surfaces. In affected releases, authorized non-owner chat senders could issue device-pairing
  bootstrap codes without having owner, admin, or pairing scope.\n\nThis issue does
  not affect unauthenticated users. The caller must already be allowed to send commands
  to the agent through a configured chat channel."
