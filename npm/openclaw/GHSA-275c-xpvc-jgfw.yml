title: "OpenClaw: Slack and Zalo webhook secrets could remain active after secrets.reload"
description: "Slack and Zalo webhook secrets could remain active after secrets.reload.
  In affected versions, a caller with an old webhook secret during the stale-secret
  window could keep accepting the previous secret after `secrets.reload`.\n\nThis
  advisory is scoped to the named feature and configuration. It does not change OpenClaw's
  trusted-operator model: authenticated Gateway operators, installed plugins, and
  intentional local execution surfaces remain trusted unless a separate policy, approval,
  allowlist, sandbox, or auth boundary is crossed."
