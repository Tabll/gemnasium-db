description: "### Duplicate Advisory\nThis advisory has been withdrawn because it
  is a duplicate of GHSA-5h2w-qmfp-ggp6. This link is maintained to preserve external
  references.\n\n### Original Description\nOpenClaw before 2026.3.28 contains a privilege
  escalation vulnerability in the chat.send endpoint that allows write-scoped gateway
  callers to persist admin-only verboseLevel session overrides. Attackers can exploit
  the /verbose parameter to bypass access controls and expose sensitive reasoning
  or tool output intended to be restricted to administrators."
