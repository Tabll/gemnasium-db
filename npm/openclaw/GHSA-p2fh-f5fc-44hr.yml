title: "OpenClaw: memory-wiki ingest could read local files with operator.write scope"
description: "memory-wiki ingest could read local files with operator.write scope.
  In affected versions, a Gateway caller with `operator.write` access to the plugin
  tool could read arbitrary local file paths instead of staying within the intended
  ingest sources.\n\nThis advisory is scoped to the named feature and configuration.
  It does not change OpenClaw's trusted-operator model: authenticated Gateway operators,
  installed plugins, and intentional local execution surfaces remain trusted unless
  a separate policy, approval, allowlist, sandbox, or auth boundary is crossed."
