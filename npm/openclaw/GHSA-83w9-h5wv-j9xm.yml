title: "OpenClaw: Node pairing reconnection could confuse approval scope state"
description: "Node pairing reconnection could confuse approval scope state. In affected
  versions, a paired or reconnecting node session could mutate pairing state in a
  way that changed the approval scope decision.\n\nThis advisory is scoped to the
  named feature and configuration. It does not change OpenClaw's trusted-operator
  model: authenticated Gateway operators, installed plugins, and intentional local
  execution surfaces remain trusted unless a separate policy, approval, allowlist,
  sandbox, or auth boundary is crossed."
