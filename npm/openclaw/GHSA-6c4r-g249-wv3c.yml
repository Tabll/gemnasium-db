title: "OpenClaw: Sandboxed session spawn could expose the real workspace path to
  child prompts"
description: "Sandboxed session spawn could expose the real workspace path to child
  prompts. In affected versions, a child session spawned from a sandboxed parent could
  forward the host workspace path into the child session prompt.\n\nThis advisory
  is scoped to the named feature and configuration. It does not change OpenClaw's
  trusted-operator model: authenticated Gateway operators, installed plugins, and
  intentional local execution surfaces remain trusted unless a separate policy, approval,
  allowlist, sandbox, or auth boundary is crossed."
