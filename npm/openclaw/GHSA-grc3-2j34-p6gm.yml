title: "OpenClaw: message.action forwarding could send Gateway credentials to model-supplied
  loopback URLs"
description: "message.action forwarding could send Gateway credentials to model-supplied
  loopback URLs. In affected versions, model-controlled action metadata that selects
  a loopback Gateway URL could forward the action payload with Gateway credentials
  to the supplied loopback URL.\n\nThis advisory is scoped to the named feature and
  configuration. It does not change OpenClaw's trusted-operator model: authenticated
  Gateway operators, installed plugins, and intentional local execution surfaces remain
  trusted unless a separate policy, approval, allowlist, sandbox, or auth boundary
  is crossed."
