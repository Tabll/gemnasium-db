title: "OpenClaw: Browser debug/export routes could reuse already-open blocked tabs"
description: "Browser debug/export routes could reuse already-open blocked tabs. In
  affected versions, a caller that can reference an already-open browser tab could
  reuse blocked private-network tabs without reapplying the expected SSRF policy.\n\nThis
  advisory is scoped to the named feature and configuration. It does not change OpenClaw's
  trusted-operator model: authenticated Gateway operators, installed plugins, and
  intentional local execution surfaces remain trusted unless a separate policy, approval,
  allowlist, sandbox, or auth boundary is crossed."
