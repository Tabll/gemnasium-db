title: "OpenClaw: QQBot admin commands could skip DM-only and allowFrom policy"
description: "QQBot admin commands could skip DM-only and allowFrom policy. In affected
  versions, a QQBot sender able to trigger the exported command could route admin
  commands without the QQBot-specific DM-only and allowFrom checks.\n\nThis advisory
  is scoped to the named feature and configuration. It does not change OpenClaw's
  trusted-operator model: authenticated Gateway operators, installed plugins, and
  intentional local execution surfaces remain trusted unless a separate policy, approval,
  allowlist, sandbox, or auth boundary is crossed."
