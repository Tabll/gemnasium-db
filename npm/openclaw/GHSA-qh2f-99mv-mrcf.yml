title: "OpenClaw: Bundle MCP loopback could miss its exec denylist on session spawn"
description: "Bundle MCP loopback could miss its exec denylist on session spawn. In
  affected versions, a caller that can reach the affected bundled MCP session-spawn
  path could bypass the denylist that was intended for that loopback MCP entry point.\n\nThis
  advisory is scoped to the named feature and configuration. It does not change OpenClaw's
  trusted-operator model: authenticated Gateway operators, installed plugins, and
  intentional local execution surfaces remain trusted unless a separate policy, approval,
  allowlist, sandbox, or auth boundary is crossed."
