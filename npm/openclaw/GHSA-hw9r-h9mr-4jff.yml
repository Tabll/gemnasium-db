title: "OpenClaw: Scoped chat.send route inheritance could bypass admin command scope
  gates"
description: "Some internal command handlers require `operator.approvals` or `operator.admin`
  scopes. In affected releases, a scoped Gateway `chat.send` request delivered through
  an inherited external route could be evaluated as an external-channel command while
  still carrying the lower Gateway client scopes.\n\nThis issue affects scoped Gateway
  clients. It does not apply to shared-secret bearer HTTP compatibility endpoints,
  which are documented as full operator surfaces under OpenClaw's trust model."
