description: "### Duplicate Advisory\nThis advisory has been withdrawn because it
  is a duplicate of GHSA-vfp4-8x56-j7c5. This link is maintained to preserve external
  references.\n\n### Original Description\nOpenClaw before 2026.4.10 contains an insufficient
  environment variable denylist vulnerability in its exec environment policy that
  allows operator-supplied overrides of high-risk interpreter startup variables including
  VIMINIT, EXINIT, LUA_INIT, and HOSTALIASES. Attackers can exploit this by manipulating
  these environment variables to influence downstream execution behavior or network
  connectivity."
