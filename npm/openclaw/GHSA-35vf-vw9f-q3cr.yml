description: "### Duplicate Advisory\nThis advisory has been withdrawn because it
  is a duplicate of GHSA-r6xh-pqhr-v4xh. This link is maintained to preserve external
  references.\n\n### Original Description\nOpenClaw before 2026.4.22 derives loopback
  MCP owner context from spoofable server-issued bearer tokens in request headers.
  Non-owner loopback clients can present themselves as owner to bypass owner-gated
  operations by manipulating the sender-owner header metadata."
