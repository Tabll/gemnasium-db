title: "OpenClaw: PowerShell encoded-command aliases could miss exec allowlist checks"
description: "PowerShell encoded-command aliases could miss exec allowlist checks.
  In affected versions, a command request using abbreviated encoded-command flags
  could use an alias form not recognized by the allowlist parser.\n\nThis advisory
  is scoped to the named feature and configuration. It does not change OpenClaw's
  trusted-operator model: authenticated Gateway operators, installed plugins, and
  intentional local execution surfaces remain trusted unless a separate policy, approval,
  allowlist, sandbox, or auth boundary is crossed."
