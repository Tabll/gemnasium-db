title: "OpenClaw's Slack plugin approvals used the exec approver gate for plugin actions"
description: "Slack plugin approvals used the exec approver gate for plugin actions.
  In affected versions, a Slack user authorized only for exec approvals could resolve
  a plugin approval through the exec approver gate.\n\nThis advisory is scoped to
  the named feature and configuration. It does not change OpenClaw's trusted-operator
  model: authenticated Gateway operators, installed plugins, and intentional local
  execution surfaces remain trusted unless a separate policy, approval, allowlist,
  sandbox, or auth boundary is crossed."
