description: "### Duplicate Advisory\nThis advisory has been withdrawn because it
  is a duplicate of GHSA-2hh7-c75g-qj2r. This link is maintained to preserve external
  references.\n\n### Original Description\nOpenClaw before 2026.4.22 contains a server-side
  request forgery vulnerability in the Zalo plugin's sendPhoto function that fails
  to validate outbound photo URLs through the SSRF guard. Attackers can bypass SSRF
  protection by providing malicious photo URLs to the Zalo Bot API, enabling unauthorized
  access to internal resources."
