title: "OpenClaw: Trusted-proxy Control UI WebSocket accepted client-declared scopes
  before pairing"
description: "In trusted-proxy Control UI mode, OpenClaw accepted a WebSocket client's
  declared operator scopes before those scopes were bound to a server-approved pairing
  or trusted-proxy authorization baseline.\n\nThis issue affects trusted-proxy Control
  UI deployments. It does not apply to shared-secret Control UI sessions, which are
  treated as trusted operator sessions by design."
