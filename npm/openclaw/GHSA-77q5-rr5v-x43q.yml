title: "OpenClaw: Trusted retry endpoint checks could match hostname prefixes"
description: "Trusted retry endpoint checks could match hostname prefixes. In affected
  versions, a retry endpoint URL chosen by lower-trust input could pass validation
  by using a hostname prefix that resembled a trusted host.\n\nThis advisory is scoped
  to the named feature and configuration. It does not change OpenClaw's trusted-operator
  model: authenticated Gateway operators, installed plugins, and intentional local
  execution surfaces remain trusted unless a separate policy, approval, allowlist,
  sandbox, or auth boundary is crossed."
