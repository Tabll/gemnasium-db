title: "OpenClaw: Same-host trusted-proxy deployments could accept local forged identity
  headers"
description: "Same-host trusted-proxy deployments could accept local forged identity
  headers. In affected versions, a local same-host caller that can reach the proxy-facing
  Gateway port could supply identity headers normally reserved for the trusted proxy.\n\nThis
  advisory is scoped to the named feature and configuration. It does not change OpenClaw's
  trusted-operator model: authenticated Gateway operators, installed plugins, and
  intentional local execution surfaces remain trusted unless a separate policy, approval,
  allowlist, sandbox, or auth boundary is crossed."
