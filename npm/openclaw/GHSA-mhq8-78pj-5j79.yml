package_slug: "npm/openclaw"
title: "OpenClaw's POSIX node system.run safe-bin allowlist could be widened by shell
  expansion"
description: "On POSIX nodes, OpenClaw's `system.run` safe-bin checks could approve
  a command before shell expansion changed how the command was interpreted. A value
  that appeared to be a safe-bin argument could expand into additional shell words
  and become a file operand.\n\nThis issue is limited to paired POSIX node execution
  through `system.run` with safe-bin or allowlist-style auto-approval. It is not an
  unauthenticated node takeover."
