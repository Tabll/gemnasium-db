description: "### Duplicate Advisory\nThis advisory has been withdrawn because it
  is a duplicate of GHSA-f7fh-qg34-x2xh. This link is maintained to preserve external
  references.\n\n### Original Description\nOpenClaw before 2026.4.5 contains a server-side
  request forgery vulnerability in the CDP /json/version WebSocket endpoint that allows
  attackers to pivot to untrusted second-hop targets. The webSocketDebuggerUrl response
  field is not properly validated, enabling attackers to redirect connections to arbitrary
  hosts and perform SSRF-style attacks."
