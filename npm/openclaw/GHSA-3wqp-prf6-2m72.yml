title: "OpenClaw: Feishu dynamic-agent bindings could miss configWrites enforcement"
description: "Feishu dynamic-agent bindings could miss configWrites enforcement. In
  affected versions, a Feishu sender using dynamic-agent binding behavior could create
  or update bindings without honoring the configured config-write control.\n\nThis
  advisory is scoped to the named feature and configuration. It does not change OpenClaw's
  trusted-operator model: authenticated Gateway operators, installed plugins, and
  intentional local execution surfaces remain trusted unless a separate policy, approval,
  allowlist, sandbox, or auth boundary is crossed."
