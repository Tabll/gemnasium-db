description: "### Duplicate Advisory\nThis advisory has been withdrawn because it
  is a duplicate of GHSA-xmxx-7p24-h892. This link is maintained to preserve external
  references.\n\n### Original Description\nOpenClaw before 2026.4.15 captures resolved
  bearer-auth configuration at startup, allowing revoked tokens to remain valid after
  SecretRef rotation. Gateway HTTP and WebSocket handlers fail to re-resolve authentication
  per-request, enabling attackers to use rotated-out bearer tokens for unauthorized
  gateway access."
