description: "### Duplicate Advisory\nThis advisory has been withdrawn because it
  is a duplicate of GHSA-wppj-c6mr-83jj. This link is maintained to preserve external
  references.\n\n### Original Description\nOpenClaw before 2026.4.22 contains a time-of-check/time-of-use
  race condition in OpenShell sandbox filesystem writes that allows attackers to redirect
  writes outside the intended mount root. Attackers can exploit symlink swaps during
  filesystem operations to bypass sandbox restrictions and write files outside the
  local mount root."
