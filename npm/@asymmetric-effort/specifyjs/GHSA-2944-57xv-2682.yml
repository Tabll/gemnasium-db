title: "@asymmetric-effort/specifyjs: `data:` URI allowed without size restriction"
description: "## Finding\n\n**Location**: `core/src/shared/secure-fetch.ts:33-35`\n\n`data:`
  URIs were allowed without any restriction. While `data:` URIs don't make network
  requests, they can be used for memory exhaustion via very large data URIs.\n\n##
  Status\n\n**Fixed in v0.2.136** — `data:` URIs are now limited to 1MB. URIs exceeding
  this limit throw an error."
