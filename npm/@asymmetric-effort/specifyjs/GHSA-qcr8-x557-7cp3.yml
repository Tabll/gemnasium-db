title: "@asymmetric-effort/specifyjs: Production console warnings may leak internal
  framework state"
description: "## Finding\n\n**Location**: `core/src/core/scheduler.ts:23`, `core/src/hooks/dispatcher.ts:100`,
  `core/src/client/graphql.ts:71`\n\nSeveral `console.warn` calls are not gated behind
  `__DEV__` and will fire in production builds, potentially exposing internal framework
  state such as queue sizes, component names, and query fragments to users viewing
  the browser console.\n\n## Status\n\n**Open** — These warnings serve as development-time
  diagnostics. They do not expose credentials or PII, but may reveal internal architecture
  details.\n\n## Recommendation\n\nGate all development-time `console.warn` and `console.error`
  calls behind `process.env.NODE_ENV !== 'production'` or a `__DEV__` constant that
  build tools can tree-shake."
