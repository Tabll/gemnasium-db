title: "@asymmetric-effort/specifyjs: No redirect target validation in secureFetch"
description: "## Finding\n\n**Location**: `core/src/shared/secure-fetch.ts`\n\n`assertSecureUrl`
  validated only the initial request URL. The `fetch()` API follows redirects by default
  (up to 20 hops). A request to a valid `https://` URL could redirect to `http://internal-service/`
  or other unvalidated destinations.\n\n## Status\n\n**Fixed in v0.2.136** — `secureFetch`
  now defaults to `redirect: 'error'` which rejects any redirect. Callers can override
  with `{ redirect: 'follow' }` if they trust the target."
