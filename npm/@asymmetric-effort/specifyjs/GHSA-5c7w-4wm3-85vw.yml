title: "@asymmetric-effort/specifyjs: GraphQL gql tag allows metacharacter injection"
description: "## Finding\n\n**Location**: `core/src/client/graphql.ts:66-80`\n\nThe
  `gql` template tag function warned about interpolated values containing GraphQL
  metacharacters (`{}():`) but still concatenated them into the query string, enabling
  potential GraphQL injection.\n\n## Status\n\n**Fixed in v0.2.136** — The `gql` function
  now throws an error when metacharacters are detected in interpolated values, forcing
  developers to use the `variables` parameter."
