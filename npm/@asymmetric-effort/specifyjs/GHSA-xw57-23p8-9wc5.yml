description: "## Finding\n\n**Location**: `core/src/shared/secure-fetch.ts:52-54`\n\nThe
  localhost exception allowed `localhost` and `127.0.0.1` but did not cover `0.0.0.0`,
  `[::1]` (IPv6 localhost), or the full `127.0.0.0/8` loopback range.\n\n## Status\n\n**Fixed
  in v0.2.136** — Localhost detection now covers `localhost`, `127.0.0.1`, `[::1]`,
  `0.0.0.0`, and the full `127.x.x.x` range."
