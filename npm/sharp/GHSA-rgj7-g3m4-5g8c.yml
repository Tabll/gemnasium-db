description: "A number of vulnerabilities, two rated as \"Critical\" severity using
  CVSSv3, have been discovered and fixed in the upstream libheif dependency. These
  can lead to possible remote code execution (RCE) on glibc-based Linux when run under
  certain conditions.\n\nThe attack vector for these claims to be \"network\" however
  sharp does not provide any networking features so this vulnerability is down-rated
  to a \"High\" severity using CVSSv4 but please note its Subsequent System Impact.\n\nThose
  processing untrusted input with versions of sharp prior to 0.35.4 are affected."
