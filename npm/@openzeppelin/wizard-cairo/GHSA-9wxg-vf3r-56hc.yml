title: "OpenZeppelin Contracts Wizard: Line terminators in info.securityContact /
  info.license can inject lines into generated source"
description: "The Contracts Wizard generators printed `info.securityContact` and `info.license`
  verbatim into a single-line comment of the generated Solidity, Cairo, Stellar/Soroban,
  and Stylus source without rejecting line terminators. A newline (`\\n` or `\\r\\n`)
  in either field ends the comment, so the text after it is emitted as source rather
  than remaining inside the comment — allowing arbitrary declarations to be injected
  into the generated contract."
