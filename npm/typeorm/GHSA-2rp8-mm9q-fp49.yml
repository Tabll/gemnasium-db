title: " TypeORM: migration:generate template-literal code injection"
description: "`typeorm migration:generate` embeds database schema metadata into JS/TS
  template literals, escaping backticks but not `${...}`. An attacker who can write
  schema metadata (column comments, defaults, view definitions) achieves arbitrary
  code execution on the host that loads the generated migration."
