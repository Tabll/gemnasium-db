description: "Mistral npm `@mistralai/mistralai`, `@mistralai/mistralai-azure`, `@mistralai/mistralai-gcp`
  were compromised by a supply chain attack related to the [TanStack security incident](https://github.com/TanStack/router/security/advisories/GHSA-g7cv-rxg3-hmpx).
  An automated worm associated with the attack led to **compromised npm package versions
  being published**.\n\nCurrent investigation indicates that an affected developer
  device was involved. We have no indication that Mistral infrastructure was compromised.
  The compromised versions were removed from npm. They were available only between
