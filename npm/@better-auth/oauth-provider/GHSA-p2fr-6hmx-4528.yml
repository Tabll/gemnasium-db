package_slug: "npm/@better-auth/oauth-provider"
title: "@better-auth/oauth-provider may provide access tokens for unauthorized audiences
  via unbound resource indicators"
description: "`@better-auth/oauth-provider` lets an OAuth client choose the access-token
  audience through the RFC 8707 `resource` parameter at the token endpoint. It does
  not bind that choice to the authorization grant. A client that completes a normal
  authorization flow can request a JWT access token whose audience targets a resource
  server the authorization never covered. The only constraint is that the resource
  appears in the server's `validAudiences` allowlist. The same gap applies to the
  refresh grant: a refresh token issued in a flow targeting one resource can be redeemed
  for an access token bound to a different allow-listed resource."
