title: "@better-auth/drizzle-adapter: Concurrent requests can exceed rate limits on
  PostgreSQL"
description: "Database-backed rate limiting on PostgreSQL can let a burst of concurrent
  requests go over the configured maximum. When many requests arrive at the same time,
  several of them can pass the limit check together. This weakens the rate limit on
  password sign-in, two-factor verification, one-time codes, password resets, and
  other rate-limited endpoints."
