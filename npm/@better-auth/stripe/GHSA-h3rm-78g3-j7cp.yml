package_slug: "npm/@better-auth/stripe"
title: "@better-auth/stripe: cross-organization billing tampering in organization
  subscription actions"
description: "An org subscription action can run against the wrong org. The actions
  are cancel, change plan, restore, and open the billing portal. The plugin checks
  permission against the org id in the request query string. It then runs the action
  against the caller's active org from their session. When these two ids differ, a
  member can act on billing for an org they may not manage. The target is always an
  org the caller belongs to."
