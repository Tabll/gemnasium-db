package_slug: "npm/@better-auth/scim"
title: "@better-auth/scim: account takeover and stale access via SCIM provider-id
  collision"
description: "`@better-auth/scim` used the same logical provider ID for SCIM provider
  configuration and account ownership. SCIM token issuance did not reject all account-provider
  namespaces. An authenticated user could therefore mint a SCIM token whose provider
  ID matched an existing SSO, SAML, OIDC, generic OAuth, or social provider. SCIM
  user routes then selected account rows by that provider ID and treated those users
  as SCIM-managed, even when the SCIM token had never provisioned them.\n\nThe same
  write path had 2 additional validation issues. First, SCIM `active: false` was not
  modeled, so identity providers could receive a successful response while the user
  stayed active. Second, SCIM PUT and PATCH updates changed global email addresses
  without the same uniqueness check used by create, and `emailVerified` stayed unchanged
  after an email reassignment."
