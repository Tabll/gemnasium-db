package_slug: "npm/@better-auth/scim"
title: "@better-auth/scim: Account/provider takeover via missing owner binding on
  non-org SCIM providers"
description: "`@better-auth/scim` does not bind non-organization SCIM providers to
  their creator in the default configuration. Any authenticated user can manage another
  user's non-org provider, including reading its metadata, listing connections, regenerating
  its SCIM bearer token, and deleting the connection. Regenerating the token rotates
  it: the legitimate token stops working and the attacker holds a valid one."
