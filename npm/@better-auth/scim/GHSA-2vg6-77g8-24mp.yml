package_slug: "npm/@better-auth/scim"
title: "Better Auth: Stale sessions persist after user deletion across admin, anonymous,
  and SCIM flows"
description: "When `secondaryStorage` is configured and `storeSessionInDatabase` is
  `false`, three user-deletion endpoints in `better-auth` plus one in `@better-auth/scim`
  call `internalAdapter.deleteUser(userId)` without first calling `internalAdapter.deleteSessions(userId)`.
  The deleted user's session payload (which carries a cached user object) remains
  in secondary storage, and `internalAdapter.findSession(token)` keeps returning it
  as a valid session until the session TTL elapses (default 7 days)."
