package_slug: "npm/mcp-sanitizer"
title: "mcp-sanitizer: URL sanitizer allows localhost/IPv6 loopback SSRF bypass via
  explicit port or bracketed IPv6"
description: "`mcp-sanitizer` v1.3.3 fails to block Server-Side Request Forgery (SSRF)
  targets when a `localhost` URL includes an explicit port (e.g., `http://localhost:8080/`)
  or when an IPv6 loopback/link-local address is expressed in bracketed notation (e.g.,
  `http://[::1]:8080/`, `http://[fe80::1]:8080/`). Because the library is explicitly
  designed to gate MCP tool parameters such as `web_fetch` and `web_scraper` before
  outbound HTTP requests are made, a bypass here directly enables an attacker-controlled
  URL to reach internal services, leaking their responses."
