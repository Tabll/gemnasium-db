title: "mcp-sanitizer: File Path Sanitizer Permits Arbitrary User-Home Absolute Paths"
description: "`mcp-sanitizer` v1.3.3 explicitly whitelists `/home/` and `/Users/`
  as allowed absolute path prefixes in its file path validation logic (`src/utils/validation-utils.js:188-196`).
  As a result, paths such as `/home/alice/.ssh/id_rsa` and `/home/alice/.aws/credentials`
  pass through `sanitizer.sanitize()` with `blocked=false`, even though they point
  to highly sensitive files outside any configured safe root. Any consumer application
  that trusts the sanitized path and passes it to a filesystem read/write operation
  (e.g., `fs.readFile`) will expose arbitrary user-home directory files to an unauthenticated
  network attacker. Dynamic reproduction confirmed exfiltration of a simulated SSH
  private key and AWS credentials via a single HTTP POST request."
