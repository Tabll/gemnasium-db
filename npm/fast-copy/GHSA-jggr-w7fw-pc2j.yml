title: "fast-copy: Stack exhaustion in fast-copy when copying deeply-nested values"
description: "`fast-copy` traverses values recursively with no bound on depth. Copying
  a sufficiently deeply-nested value exhausts the JavaScript call stack and throws
  a native `RangeError: Maximum call stack size exceeded` from inside the library."
