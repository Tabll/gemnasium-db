title: "Trigger.dev: V1 coordinator default-secret unauth Socket.IO"
description: "## TL;DR\n\nThe /coordinator Socket.IO namespace mounts on every webapp
  boot and authenticates with a default secret (\"coordinator-secret\") baked into
  source. The override variable isn't documented in the self-host docs, .env.example,
  or helm values, so any operator who didn't read source ships with the default. Once
  connected, READY_FOR_EXECUTION returns the run's decrypted env vars. Anyone who
  can reach a default-config self-hosted webapp can pull production secrets out of
  any run whose internal id they can find.\n\n## Vulnerabilities\n\nThis attack is
  made possible by 3 vulnerabilities in Trigger.dev:"
