package_slug: "npm/trigger.dev"
title: "Trigger.dev: Server-side request forgery via unvalidated webhook alert-channel
  URL"
description: "A project member can create a webhook alert channel whose delivery URL
  points at an internal address, and trigger.dev's control plane will send the alert
  there with no SSRF protection. The webhook URL is stored as an unvalidated string
  and is fetched directly from the webapp server, so a low-privilege authenticated
  user can make the server issue POST requests to internal-only services and cloud
  metadata endpoints (for example http://169.254.169.254/). No private-IP, scheme,
  or redirect filtering exists anywhere in the webapp."
