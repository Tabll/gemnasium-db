package_slug: "npm/trigger.dev"
title: "Trigger.dev: Blind SSRF via alert-channel webhook"
description: "A WEBHOOK alert channel stores a user-supplied `url`. When an alert
  fires (deployment/run failure, error groups), the webapp server (`alertsWorker`
  -> `DeliverAlertService`) POSTs the HMAC-signed alert payload to that URL via `fetch(webhook.url,
  ...)`. The URL is never validated against a host allowlist or private-IP/metadata
  blocklist (a repo-wide search for `169.254`, `isPrivate`, `isLoopback`, `net.isIP`,
  `ssrf` returns ZERO hits), and the API route's URL field is just `z.string().optional()`
  (no syntax check at all). So an authenticated tenant can point the webhook at internal
  infrastructure or `169.254.169.254` and the multi-tenant server fetches it."
