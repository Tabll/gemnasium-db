package_slug: "npm/trigger.dev"
title: "Trigger.dev: Cross-tenant SQL injection in the TSQL query compiler (POST /api/v1/query)
  via unsanitized window-function name"
description: "A cross-tenant SQL injection in the TSQL query compiler lets **any authenticated
  trigger.dev customer read every other tenant's analytics data**. The customer-facing
  query endpoint `POST /api/v1/query` accepts a TSQL/TRQL query that is compiled to
  ClickHouse SQL by `internal-packages/tsql`. The compiler parameterizes or escapes
  all user input and injects a per-tenant `WHERE` guard — **except the window-function
  name**, which is concatenated into the SQL string with no allowlist and no escaping.
  By smuggling a backtick-quoted identifier into that position, an attacker injects
  a raw subquery (e.g. `(SELECT ... FROM task_runs_v2 WHERE organization_id = 'org_VICTIM')`)
  that sits **outside** the tenant guard, exfiltrating another organization's rows.
  Verified end-to-end against the real compiler and a live ClickHouse."
