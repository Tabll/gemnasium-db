title: "Trigger.dev: Trigger CLI debug deployment logs expose resolved environment
  secret values"
description: "Affected version: trigger.dev 4.5.3 (4.5.6 was advertised by the CLI
  but was not tested).\n\nA staging dry-run executed with `trigger.dev deploy --env
  staging --dry-run --log-level debug`. The debug output logged the complete build-worker
  options object. Its `envVars` property contained unredacted values for every resolved
  staging variable, including database connection strings and service credentials.
  The non-debug environment listing correctly hides values, so users can reasonably
  expect deployment logs not to print secrets.\n\nImpact: anyone with access to a
  developer terminal transcript, CI debug log, captured agent/tool output, or support
  bundle can recover deployment secrets even though no deployment occurs.\n\nReproduction:\n1.
  Configure a Trigger.dev project with a secret environment variable.\n2. Run the
  command above with an authenticated profile.\n3. Inspect the `Starting buildWorker`
  debug record.\n4. `options.envVars` contains the plaintext value.\n\nNo real credential
  is included in this report. The observed customer credentials are being rotated
  separately.\n\nSuggested remediation: never serialize `envVars` values in debug
  output; log names only or replace every value with a fixed marker. Add regression
  coverage for deploy, dry-run, and debug logging, and review adjacent debug records
  for resolved secrets."
