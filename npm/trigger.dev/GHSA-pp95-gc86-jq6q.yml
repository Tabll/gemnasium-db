package_slug: "npm/trigger.dev"
title: "Trigger.dev: Missing Authentication in Run Replay Action Allows Cross-Organization
  Task Execution (IDOR)"
description: "The run replay `action` function at `apps/webapp/app/routes/resources.taskruns.$runParam.replay.ts`
  has no authentication or authorization check. While the `loader` (GET) in the same
  file properly calls `requireUser(request)` and scopes queries to the user's organizations,
  the `action` (POST) at line 166 does neither — allowing any authenticated user to
  replay task runs from any organization by knowing the run's `friendlyId`."
