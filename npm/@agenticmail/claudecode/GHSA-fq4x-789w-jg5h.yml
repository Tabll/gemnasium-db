package_slug: "npm/@agenticmail/claudecode"
title: "AgenticMail: Unauthenticated inbound mail triggers bypassPermissions resume
  of the operator's Claude Code session (bridge-wake)"
description: "Two inbound-mail handlers act on a privileged effect without verifying
  that the sender is the operator, while a sibling handler in the same repo does.
  The higher-impact one: any external email routed to the bridge inbox causes the
  dispatcher to resume the operator's Claude Code session with `permissionMode: 'bypassPermissions'`,
  embedding the attacker-controlled `from`/`subject`/`preview` verbatim into the prompt
  the resumed agent reads — an indirect prompt injection into a fully-privileged agent
  (Bash/Write/Edit/WebFetch + the agenticmail MCP toolbelt) running as the operator's
  OAuth identity. The sibling operator-query email-reply hook gates the same untrusted-From
  provenance with `isOperatorReplySender(replyFrom, config.operatorEmail)` (fail-closed);
  the bridge-wake path — a strictly higher-privilege effect — has no equivalent."
