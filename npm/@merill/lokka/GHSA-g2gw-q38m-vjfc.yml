title: "Lokka: Azure Resource Manager URL path validation issue"
description: "Lokka versions prior to 2.1.2 constructed Azure Resource Manager request
  URLs using direct string concatenation with user-controlled path input. Specially
  crafted path values could alter URL authority parsing and cause Azure Resource Manager
  bearer tokens to be sent to an unintended host. Version 2.1.2 fixes the issue by
  validating Azure paths before token acquisition and constructing Azure Resource
  Manager URLs with the standard URL API while preserving the expected management.azure.com
  host.\n\nReported by 정해창 <haechang__@naver.com>"
