title: "OpenClaw: Channel read actions could skip target allowlists"
description: "Channel read actions could skip target allowlists. In affected versions,
  explicit read targets in Microsoft Teams, Feishu, Matrix, and Google Chat could
  reach channels or rooms outside the configured read policy.\n\nThis advisory is
  scoped to caller-supplied targets for message, reaction, pin, member, and related
  metadata reads in the named plugins. It does not change OpenClaw's trusted-operator
  model or create per-user isolation within one Gateway."
