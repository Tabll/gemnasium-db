title: "esbuild allows arbitrary file read when running the development server on
  Windows"
description: "The development server contains a path traversal vulnerability on Windows
  when serving files from `servedir`.\n\nDue to the use of `path.Clean()` (which only
  normalizes forward-slash `/` separators) instead of a Windows-aware path normalization
  function, it is possible to craft requests using backslashes (`\\`) that bypass
  the intended directory containment logic. An attacker can escape the configured
  `servedir` root and access arbitrary files on the filesystem.\nThis issue affects
  Windows environments only."
