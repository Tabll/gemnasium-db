package_slug: "npm/appium-mcp"
title: "appium-mcp: Unescaped Locator Data XSS in MCP-UI Resource (createLocatorGeneratorUI)"
description: "`appium-mcp`'s `createLocatorGeneratorUI` function interpolates attacker-controlled
  element attributes — `text`, `content-desc`, `resource-id`, and locator selector
  values — directly into an HTML template literal without any HTML or JavaScript context
  escaping. An attacker who controls the UI of the app under test can inject arbitrary
  HTML and JavaScript into the MCP UI resource returned by the `generate_locators`
  tool. When a victim's MCP client renders this resource, the injected script executes
  and can invoke arbitrary MCP tools via `window.parent.postMessage`, leading to unauthorized
  MCP tool execution such as taking screenshots, reading page source, or any other
  registered capability."
