title: "Nodemailer: Quoted local-part can produce malformed envelope recipient through
  RFC 5322 comment parsing"
description: "Nodemailer's address parser can produce an unexpected recipient address
  when an RFC 5322 comment follows the domain of an address whose local-part is a
  quoted string.\n\nFor example:\n\n```text\n\"user\"@example.com(x)evil.com\n```\n\nis
  parsed as:\n\n```text\n{\naddress: \"user@example.com evil.com\",\nname: \"\"\n}\n```\n\nThe
  resulting address therefore contains additional attacker-controlled domain text
  separated by a literal space.\n\nThe parsed `.address` value is subsequently propagated
  into the SMTP envelope:\n\n```text\nsrc/addressparser/index.ts\n↓\nrecipient.address\n↓\nsrc/mime-node/index.ts\n↓\nenvelope.to\n```\n\nThe
  envelope construction uses the parsed address without another strict address validation
  step.\n\nThis appears to be a variant of the RFC 5322 comment parsing issue addressed
  by GHSA-cc9r-2j5m-2m83, but it follows a different parser path when the local-part
  is quoted."
