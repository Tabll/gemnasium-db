title: "Nodemailer: Quadratic backtracking in the addressparser free-text fallback
  allows remote denial of service"
description: "When `addressparser` finds no address by its strict reading, it falls
  back to pulling one out of the free text with `/\\s*\\b[^@\\s]+@[^\\s]+\\b\\s*/`.
  That pattern backtracks quadratically: `[^@\\s]+` is retried from every offset and
  rescans the run to the next `@` each time. A single header value holding a long
  whitespace-free run with no usable `@` blocks the Node.js event loop for tens of
  seconds.\n\nIt is cheaper to exploit than GHSA-prgh-xp8r-p3m5: 273KB is enough for
  ~43s, where the comment-joined shape needed ~1.5MB for ~10s."
