package_slug: "npm/nodemailer"
title: "Nodemailer: A \">\" inside a quoted local part ends an angle-addr early in
  addressparser, delivering to a domain the header does not name"
description: "addressparser ends an angle-addr at the first `>` it sees, including
  one inside a quoted local part, a comment or a domain literal. The domain is then
  read off the text in front of that `>`. `<\"a@evil.com>\"@good.com>` is the mailbox
  `\"a@evil.com>\"@good.com` under RFC 5322, and Nodemailer read it as an address
  at `evil.com`. The unbracketed spelling of the same value was already read correctly.
  Affected: 3.0.0 through 10.1.3."
