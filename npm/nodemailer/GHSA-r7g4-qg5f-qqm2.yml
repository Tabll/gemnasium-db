package_slug: "npm/nodemailer"
title: "Nodemailer: Improper TLS Certificate Validation in OAuth2 Token Fetch Enables
  Credential Interception"
description: "Nodemailer disables TLS certificate verification in its internal HTTPS
  fetch client through the use of rejectUnauthorized: false inside lib/fetch/index.js.\n\nAs
  a result, OAuth2 token requests trust invalid or self-signed HTTPS certificates
  and transmit sensitive OAuth credentials over connections that should fail TLS validation.\n\nAn
  attacker in a machine-in-the-middle position can intercept OAuth2 credential exchanges
  and capture:\n\n- OAuth client_secret\n- refresh_token\n- access tokens\n\nThe issue
  was verified through runtime testing using a self-signed HTTPS OAuth endpoint."
