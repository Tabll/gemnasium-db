package_slug: "npm/nodemailer"
title: "Nodemailer: CRLF injection in Nodemailer List-* header comments allows arbitrary
  message header injection"
description: "Nodemailer constructs `List-*` headers from the caller-provided `list`
  message option using internally prepared header values. The `list.*.comment` field
  is inserted into those prepared values without removing CR (`\\r`) or LF (`\\n`)
  characters. Because prepared headers bypass the normal header-value sanitizer and
  are passed to `mimeFuncs.foldLines()`, a CRLF sequence in a list comment is emitted
  as an actual header boundary in the generated RFC822 message.\n\nAn application
  that lets a lower-privileged or unauthenticated user influence `list.help.comment`,
  `list.unsubscribe.comment`, `list.subscribe.comment`, `list.post.comment`, `list.owner.comment`,
  `list.archive.comment`, or `list.id.comment` can therefore be made to generate messages
  containing attacker-chosen additional headers."
