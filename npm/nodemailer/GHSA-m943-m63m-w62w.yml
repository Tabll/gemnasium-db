package_slug: "npm/nodemailer"
title: "Nodemailer: A \";\" inside a quoted string or comment ends an address group
  early in addressparser, turning display text into a recipient"
description: "addressparser ends an RFC 5322 group at the first `;`, including one
  inside a quoted display name or a comment. The text after it is parsed again as
  top level recipients with the quoting flipped, so text that every conformant parser
  reads as a display name or comment becomes a live address. `G: (a; <evil@evil.com>)
  <v@victim.com>;` names only `v@victim.com`, and Nodemailer read it as the single
  recipient `evil@evil.com`. Affected: 3.0.0 through 10.1.3."
