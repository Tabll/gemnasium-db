package_slug: "npm/nodemailer"
title: "Nodemailer: Quadratic (O(n^2)) SMTP client reply parsing lets a malicious
  server or MITM cause a pre-auth remote denial of service"
description: "The SMTP client response parser reassembles multiline server replies
  by appending each continuation line onto a single response-queue entry and re-testing
  whether that entry is still a partial (continuation) reply on every line. The partial-response
  test runs `str.slice(str.lastIndexOf('\\n') + 1)` on the growing entry, which forces
  a full flatten of the entire accumulated string on each line. A malicious or compromised
  SMTP server (or an on-path attacker on a plaintext or pre-STARTTLS hop) that streams
  continuation lines and never sends a completion line drives O(n^2) CPU on the single-threaded
  Node.js event loop before any authentication, freezing the whole process for an
  attacker-controlled duration."
