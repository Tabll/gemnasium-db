title: "Nodemailer addressparser: O(n^2) on comment-joined addresses enables a remote
  DoS (reachable via mailparser)"
description: "`nodemailer/lib/addressparser` parses one shape of address in O(n^2)
  time. A single ~640 KB address value blocks the Node.js event loop for roughly 7
  seconds. And it is reachable without auth: mailparser feeds inbound email headers
  straight into this parser, so one crafted email is enough to stall a service that
  parses mail."
