package_slug: "npm/nodemailer"
title: "Nodemailer: A nested comment ends early in addressparser, releasing the rest
  of the comment as a recipient"
description: "RFC 5322 comments nest. addressparser ended a comment at the first `)`,
  including the one that closes a nested comment, and parsed the rest of the outer
  comment as header text. `Victim (x(y) <evil@evil.com>) <v@victim.com>` names `v@victim.com`
  with `x(y) <evil@evil.com>` as a comment, and Nodemailer read it as the address
  `evil@evil.com`. This is the same shape as the escaped parenthesis fixed in 10.1.2,
  reached through nesting instead of a quoted-pair. Affected: 3.0.0 through 10.1.3."
