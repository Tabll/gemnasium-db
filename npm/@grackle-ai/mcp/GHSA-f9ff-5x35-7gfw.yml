package_slug: "npm/@grackle-ai/mcp"
title: "Grackle: Fail-open authorization in the MCP tool layer lets scoped agents
  perform cross-task and cross-session mutations (IDOR)"
description: "Authorization for scoped (agent) MCP callers is enforced **inline, per
  tool**, and is applied inconsistently — several mutating tools silently omit the
  ancestry/workspace check that their siblings perform. Because the MCP server authenticates
  all outbound gRPC with the full server API key and the backend gRPC handlers perform
  **no caller-based authorization**, the MCP tool layer is the *sole* authorization
  boundary. A malicious or prompt-injected scoped agent can therefore perform cross-task
  and cross-session operations it should not be allowed to (an IDOR / privilege-boundary
  bypass).\n\nThis advisory bundles the audit's **Systemic Pattern A** findings: **F2,
  F6, F7, F12** (and the duplicate F19)."
