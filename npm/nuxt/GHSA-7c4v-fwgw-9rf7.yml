package_slug: "npm/nuxt"
title: "Nuxt dev server discloses project root and workspace UUID via the Chrome DevTools
  workspace endpoint"
description: "When a Nuxt dev server is bound to a network-reachable interface (for
  example `nuxt dev --host` for on-device testing), the default-enabled Chrome DevTools
  workspace endpoint `GET /.well-known/appspecific/com.chrome.devtools.json` returns
  the absolute project root (`workspace.root`, i.e. `rootDir`) and a persistent per-project
  workspace UUID.\n\n`GHSA-rq7w-g337-39qq` added a gate (`isLocalDevRequest`) intended
  to restrict this endpoint to local requests, but that gate is header-based: it trusts
  request metadata rather than the connected peer address. A request with no `Sec-Fetch-Site`,
  `Origin`, and `Referer` headers (normal for a non-browser client such as `curl`)
  is treated as local, and the `Host` allow-list is compared against the attacker-supplied
  `Host` header. As a result, any unauthenticated host that can reach the dev server
  on the LAN can retrieve the project's absolute filesystem path and workspace UUID,
  for example with `curl -H 'Host: localhost' http://<dev-host-lan-ip>:3000/.well-known/appspecific/com.chrome.devtools.json`.\n\nThis
  is information disclosure only: there is no file read, file write, or code execution
  reachable from the endpoint. It requires the dev server to be reachable beyond loopback
  and `experimental.chromeDevtoolsProjectSettings` to be enabled (it defaults to `true`).
  Production builds are unaffected, because the endpoint is registered only as a development
  handler."
