title: "Nuxt: URL-handling weaknesses in `navigateTo` and `reloadNuxtApp`: SSR open
  redirect, client-side script execution via the `open` option, and protocol-relative
  bypass in `reloadNuxtApp`"
description: "Three weaknesses in Nuxt's client-navigation URL handling, all reachable\nfrom
  documented public APIs (`navigateTo` and `reloadNuxtApp`):\n\n1. **SSR open redirect
  in `navigateTo` via path-normalisation bypass.**\n`navigateTo` decided whether a
  target was external by inspecting the raw\ninput with `hasProtocol(..., { acceptRelative:
  true })`. Inputs such as\n`/..//evil.com`, `/.//evil.com`, `/%2e%2e//evil.com`,
  or\n`/app/..//evil.com` slipped past that check because they start with\n`/`, but
  WHATWG URL parsing then normalised them to the\nprotocol-relative pathname `//evil.com`.
  The normalised value was\nwritten to the `Location` response header and into the\n`<meta
  http-equiv=\"refresh\">` body of the SSR redirect page, so a\nvictim's browser would
  resolve the redirect cross-origin to the\nattacker's host.\n\n2. **Client-side script
  execution via `navigateTo({ open: ... })`.** The\nclient-side early-open handler
  called `window.open(toPath, ...)` without\napplying the `isScriptProtocol` check
  that gates the normal `navigateTo`\npath. A target of `javascript:...` (or another
  script-capable scheme)\npassed to `navigateTo(url, { open: { ... } })` therefore
  executed in the\napplication's origin instead of being rejected.\n\n3. **Open redirect
  in `reloadNuxtApp` via protocol-relative bypass.**\n`reloadNuxtApp({ path })` rejects
  script-capable protocols by parsing\nthe path with `new URL(path, window.location.href)`
  and checking the\nresolved `protocol` against `isScriptProtocol`. Protocol-relative
  paths\nsuch as `//evil.com` resolve to the current page's protocol (`https:`),\nwhich
  passes that check; the value is then assigned to\n`window.location.href`, which
  the browser treats as a cross-origin\nredirect. This is the same protocol-relative
  bypass family as (1), in\na different sink."
