package_slug: "npm/nuxt"
title: "Nuxt: Dev server discloses project absolute path and persistent workspace
  UUID via `/.well-known/appspecific/com.chrome.devtools.json`"
description: "When running `nuxt dev`, Nuxt registers an unauthenticated route at
  `/.well-known/appspecific/com.chrome.devtools.json` that returns the absolute filesystem
  path of the project root and a per-project UUID persisted to `node_modules/.cache/nuxt/chrome-workspace.json`.
  The route is enabled by default via `experimental.chromeDevtoolsProjectSettings:
  true`.\n\nThe endpoint exists to let Chrome DevTools' Workspace integration map
  sources to the developer's local checkout. The handler is registered directly on
  `nitro.options.devHandlers` and does not pass through the CORS / origin wrapper
  that the rest of the dev pipeline uses, so it has no host / origin / `Sec-Fetch-Site`
  check of its own."
