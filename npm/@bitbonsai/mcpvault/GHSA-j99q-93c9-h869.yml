package_slug: "npm/@bitbonsai/mcpvault"
title: "MCPVault: PathFilter restricted-directory deny-list bypass via case and trailing
  dot/space equivalence"
description: "On case-insensitive filesystems (macOS, Windows), PathFilter compiled
  its deny-list patterns case-sensitively and matched the path verbatim, so names
  like `.Git/config`, `.GIT/config`, or `.oBsIdIaN/secrets.md` slipped past the `.git`/`.obsidian`/`node_modules`
  restriction while the OS opened the real file. On Windows, trailing dots/spaces
  (`.git./config`, `.git /config`) bypassed it the same way. Affects both `isAllowed`
  (read/write/move/search) and `isAllowedForListing`. Vault-root `..` containment
  is NOT affected. Fixed in 0.11.4 by case-insensitive matching plus per-segment canonicalization
  before the deny-list check. Reported privately by novice-22."
