title: "budibase: Database Connector SQL Injections in PostgreSQL, MS SQL, and MySQL"
description: "This advisory covers three distinct SQL Injection vulnerabilities within
  Budibase's database connectors (PostgreSQL, Microsoft SQL Server, and MySQL). Because
  user-controlled schema and table configurations are interpolated directly into raw
  SQL queries without proper escaping or parameterization during database introspection,
  an authenticated administrator can break out of string delimiters. This allows for
  arbitrary DDL/DML execution, database compromise, and potential underlying OS command
  execution (e.g., via MS SQL `xp_cmdshell`)."
