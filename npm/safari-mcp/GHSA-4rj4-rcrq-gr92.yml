title: "Safari MCP: JavaScript injection through single-quoted tool arguments (backslash
  not escaped)"
description: "Sixteen places in `safari.js` placed a tool argument inside a single-quoted
  JavaScript string literal and escaped the single quote without first escaping backslashes.
  An argument containing a backslash followed by a quote therefore closed the literal,
  and the rest of the argument ran as JavaScript in the page.\n\nSeven of the affected
  arguments belong to read-only tools that are exempt from the tab-ownership check:
  `filter` in `safari_network_details` and `safari_extract_links`, `level` in `safari_console_filter`,
  `selector` in `safari_snapshot`, `safari_accessibility_snapshot` and `safari_extract_tables`,
  and `dbName` / `storeName` in `safari_get_indexed_db`. An MCP client limited to
  read-only tools (with `safari_evaluate` and `safari_run_script` excluded from its
  allowlist) could still run arbitrary page JavaScript through them, including in
  a tab the session does not own. The other affected arguments are `ref` in `safari_select_option`,
  `safari_react_select_set` and `safari_react_select_list_options`, the key in `safari_press_key`,
  the file name in `safari_upload_file` and `safari_paste_image`, and the first line
  of the text in `safari_replace_editor`."
