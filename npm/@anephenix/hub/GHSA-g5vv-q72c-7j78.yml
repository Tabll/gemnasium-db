title: "@anephenix/hub: Unauthenticated WebSocket RPC Waiter Resource Exhaustion"
description: "`@anephenix/hub` starts a `setInterval` polling loop for every incoming
  WebSocket connection to request a client ID via RPC. If the remote client never
  replies — which requires no authentication or special configuration — the interval
  and the pending request object are never cleaned up, even after the socket is closed.
  An unauthenticated attacker who opens many WebSocket connections and ignores all
  server RPC messages will therefore cause the server to accumulate unbounded timers
  and heap entries, leading to CPU and memory exhaustion (DoS)."
