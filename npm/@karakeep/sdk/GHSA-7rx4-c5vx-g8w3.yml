title: "Karakeep SDK has SSRF via metascraper-logo-favicon that bypasses validateUrl
  protections"
description: "The `metascraper-logo-favicon` plugin makes HTTP requests to URLs extracted
  from attacker-controlled HTML without going through the application's `validateUrl()`
  SSRF protections. This allows any authenticated user to make the server fetch arbitrary
  internal URLs by bookmarking a page containing a crafted `<link rel=\"icon\">` tag."
