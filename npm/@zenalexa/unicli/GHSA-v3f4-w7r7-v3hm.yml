package_slug: "npm/@zenalexa/unicli"
title: "Uni-CLI: Legacy HTTP MCP transport accepted browser-originated localhost requests"
description: "Uni-CLI versions before 0.225.2 exposed the legacy JSON-RPC-over-HTTP
  MCP transport on loopback without validating browser Origin headers before routing
  requests. A malicious web page could send a CORS simple POST request, such as text/plain,
  to the local /mcp endpoint and deliver a JSON-RPC body to the dispatcher. If the
  user had started the local MCP HTTP transport, that page could drive tools/call
  requests against the user's local Uni-CLI server.\n\nThe Streamable HTTP transport
  already enforced this browser-to-localhost boundary. The legacy stateless HTTP path
  did not, so the two HTTP transports had drifted. This issue is about the browser-to-localhost
  boundary; it does not change Uni-CLI's local-code-execution trust model."
