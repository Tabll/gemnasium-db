package_slug: "npm/@vue/server-renderer"
title: "@vue/server-renderer: XSS via missing CR in attribute-name blacklist"
description: "`@vue/server-renderer` was investigated specifically because it's the
  one place in Vue where template rendering output becomes a real HTTP response body
  -- a genuine server-side trust boundary, unlike client-side rendering which only
  ever affects the same browser session that's already running the app's own JS.\n\n`ssrRenderAttrs()`
  (in `packages/server-renderer/src/helpers/ssrRenderAttrs.ts`) is what compiled SSR
  output calls for something like `<div v-bind=\"userObject\">`. It loops over the
  object's own keys and, for each one, renders it as an HTML attribute:\n\n```ts\nexport
  function ssrRenderDynamicAttr(\nkey: string,\nvalue: unknown,\ntag?: string,\n):
  string {\nif (!isRenderableAttrValue(value)) {\nreturn ``\n}\nconst attrKey = ...\nif
  (isBooleanAttr(attrKey) || ...) {\nreturn includeBooleanAttr(value) ? ` ${attrKey}`
  : ``\n} else if (isSSRSafeAttrName(attrKey)) {\nreturn value === '' ? ` ${attrKey}`
  : ` ${attrKey}=\"${escapeHtml(value)}\"`\n} else {\nconsole.warn(`[@vue/server-renderer]
  Skipped rendering unsafe attribute name: ${attrKey}`)\nreturn ``\n}\n}\n```\n\nThe
  value always goes through `escapeHtml()` -- that part is correctly and consistently
  applied everywhere in this file. But the attribute name (`attrKey`) is only checked
  against a character blacklist, then spliced directly into the output with no escaping
  of its own:\n\n```ts\n// packages/shared/src/domAttrConfig.ts\nconst unsafeAttrCharRE
  = /[>/=\"'\\u0009\\u000a\\u000c\\u0020]/\n\nexport function isSSRSafeAttrName(name:
  string): boolean {\nif (attrValidationCache.hasOwnProperty(name)) {\nreturn attrValidationCache[name]\n}\nconst
  isUnsafe = unsafeAttrCharRE.test(name)\nif (isUnsafe) {\nconsole.error(`unsafe attribute
  name: ${name}`)\n}\nreturn (attrValidationCache[name] = !isUnsafe)\n}\n```\n\nThat
  blacklist covers: `>`, `/`, `=`, `\"`, apostrophe, tab (U+0009), line feed (U+000A),
  form feed (U+000C), and space (U+0020). It does not cover U+000D -- carriage return
  (CR, written as `\\r` in JS).\n\nThat matters because of how browsers actually parse
  HTML. Per the WHATWG HTML parsing spec, the very first step (\"preprocessing the
  input stream\") converts every `\\r` not followed by `\\n` into a `\\n` before the
  tokenizer even starts. So a raw `\\r` sitting inside what Vue intends as a single
  attribute name gets turned into a real line feed by the browser -- and a line feed
  is one of the characters that terminates an attribute name and starts a new one.
  The blacklist checks the string as Vue sees it before the browser gets to reinterpret
  it, and that's exactly the gap.\n\nBelow is a fresh clone of this repo, confirming
  the exact commit, the exact vulnerable line, and zero modification to the source:\n\n<img
  width=\"781\" height=\"336\" alt=\"poc1\" src=\"https://github.com/user-attachments/assets/f4b92955-9a8f-4700-8c51-38ee46912de8\"
  />"
