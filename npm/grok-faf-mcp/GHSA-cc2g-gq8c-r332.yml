package_slug: "npm/grok-faf-mcp"
title: "grok-faf-mcp has an arbitrary local file read via unconfined `path` argument
  in FAF tools"
description: "Several `grok-faf-mcp` MCP tools accept a caller-controlled `path` argument
  and resolve it (`~` expansion + `path.resolve()`) straight into a filesystem read
  **without confining it to a trusted project directory**. An absolute path or `../`
  traversal is resolved and used as-is, so the server process can be made to read
  files outside the intended `.faf` project context. The only remaining limit is OS
  file permissions."
