description: "An Insecure Direct Object Reference (IDOR) vulnerability exists at the
  **GET /api/v1/organization/customer-default-source** endpoint. This flaw allows
  an authenticated attacker to bypass authorization checks and retrieve sensitive
  payment and profile information of other customers by manipulating the customerId
  parameter. The exposed data includes email addresses, account balances, currency
  types, and internal billing configurations."
