package_slug: "npm/flowise"
title: "Flowise: Incomplete Credential Redaction Exposes Secrets via API"
description: "The `GET /api/v1/credentials/:id` endpoint decrypts stored credential
  data and returns it in the `plainDataObj` field of the API response. While a `redactCredentialWithPasswordType()`
  function masks fields defined with `type: 'password'` in their component schema,
  many credential types store highly sensitive data (database connection URLs with
  embedded passwords, Google service account JSON with RSA private keys, AWS access
  keys) in fields defined as `type: 'string'`. These string-type fields are returned
  in **full plaintext** without any redaction.\n\nAny authenticated user with `credentials:view`
  permission can retrieve the raw secrets of any credential in their workspace by
  calling this endpoint."
