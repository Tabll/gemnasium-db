package_slug: "npm/flowise"
title: "Flowise: Cross-Workspace Chatflow Disclosure via chatflows/apikey Endpoint
  Returns All Unprotected Chatflows"
description: "The `/api/v1/chatflows/apikey/:apikey` endpoint (whitelisted, accessible
  with API key auth only) returns all chatflows bound to the provided API key AND
  all chatflows across the entire system that have no API key assigned. This crosses
  workspace boundaries, allowing a user in Workspace A who has a valid API key to
  read the full configuration (including flowData, chatbotConfig, system prompts,
  and node configurations) of chatflows from Workspace B, Workspace C, and all other
  workspaces, as long as those chatflows have no API key assigned."
