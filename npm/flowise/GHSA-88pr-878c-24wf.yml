title: "Flowise: Authenticated arbitrary file write in the `S3 Directory` document
  loader via unsanitized S3 object keys                                                                                                  "
description: "Flowise on current `main` allows an authenticated user with\n`documentStores:preview-process`
  permission to trigger the `S3 Directory`\ndocument loader with attacker-controlled
  S3 object keys. The loader joins\neach returned S3 key with a temporary directory
  using `path.join(tempDir, key)`\nand writes the object bytes to disk **without validating
  traversal sequences\nsuch as `../`**. Cleanup later removes only the original temporary
  directory,\nso files written outside that directory persist on the host filesystem.\n\nThis
  yields **arbitrary file write** with the privileges of the Flowise\nserver process.\n\nA
  related variant exists in the `S3File` loader when\n`fileProcessingMethod = unstructured`
  (same root cause; its cleanup behavior\nturns it into a mixed arbitrary write/delete/DoS
  primitive)."
