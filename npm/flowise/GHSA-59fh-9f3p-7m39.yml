package_slug: "npm/flowise"
title: "Flowise: Mass Assignment in PUT /api/v1/user Allows Authenticated Users to
  Override Password Hash and Bypass Password Change Verification"
description: "A Mass Assignment vulnerability in the PUT /api/v1/user endpoint allows
  authenticated users to directly modify restricted user fields, including the credential
  (password hash), bypassing the intended password change workflow.\n\nBecause the
  endpoint forwards the entire request body to the service layer without filtering,
  an attacker can override the credential field without providing the current password.\n\nThis
  bypasses several security protections including:\n\n- old password verification\n-
  password hashing enforcement\n- password policy validation\n- session invalidation
  on password change\n\nWhile the vulnerability cannot be used to modify other users
  due to an ID check in the controller, it allows attackers who obtain a temporary
  session (e.g., via token theft or XSS) to establish persistent account access."
