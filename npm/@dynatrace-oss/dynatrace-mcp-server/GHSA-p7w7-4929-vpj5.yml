title: "`@dynatrace-oss/dynatrace-mcp-server` has Unauthenticated HTTP MCP Tool Invocation"
description: "`@dynatrace-oss/dynatrace-mcp-server` v1.8.5 exposes an HTTP transport
  mode (`--http` flag) that performs no authentication, session validation, or origin/host
  verification before dispatching MCP tool calls. Any network-reachable attacker can
  send a raw JSON-RPC `tools/call` request without an `Authorization` header and have
  it executed directly under the victim server's Dynatrace credentials. Confirmed
  high-impact tools reachable without authentication include `execute_dql` (reads
  arbitrary Grail data, including logs, security events, and user sessions) and `create_dynatrace_notebook`
  (writes notebooks to the tenant)."
