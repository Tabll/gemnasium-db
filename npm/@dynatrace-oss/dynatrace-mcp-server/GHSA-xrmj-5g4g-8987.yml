title: "@dynatrace-oss/dynatrace-mcp-server has a workflow template injection via
  create_workflow_for_notification"
description: "A template injection vulnerability in the `create_workflow_for_notification`
  tool lets a caller embed Jinja2 expressions that the Dynatrace workflow engine evaluates
  at runtime, exfiltrating event data to attacker-controlled destinations through
  a workflow that persists in the tenant after the MCP session ends."
