title: "Velocity.js: Remote Code Execution via property-read to Function constructor
  (bypass of GHSA-j658-c2gf-x6pq fix)"
description: "Remote Code Execution (RCE) in velocityjs v2.1.6 via property-read to
  the Function constructor. This bypasses the fix for GHSA-j658-c2gf-x6pq (\"Prototype
  Pollution in #set path assignment\") — that advisory blocked constructor/__proto__/prototype
  only in the #set assignment handler (set.cjs), but property read expressions are
  unfiltered. Any application rendering attacker-controlled Velocity templates is
  vulnerable to arbitrary code execution on the server."
