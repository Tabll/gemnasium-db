package_slug: "npm/better-auth"
title: "Better Auth: Account takeover via pre-account hijacking on magic-link and
  email-OTP sign-in"
description: "An attacker can keep password access to a victim's account after the
  victim starts using it. The attack runs in three steps. First, with open registration,
  the attacker signs up using the victim's email and a password the attacker picks.
  The account stays unverified, so the attacker cannot use it yet. Later the real
  owner signs in with a magic link or an email OTP. That step marks the account verified,
  and the attacker's password now works on it."
