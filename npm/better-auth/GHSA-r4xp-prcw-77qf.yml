package_slug: "npm/better-auth"
title: "better-auth: OAuth Proxy lets an attacker sign in as another user"
description: "The OAuth Proxy plugin trusts any user profile it can decrypt. In the
  affected setup, Better Auth encrypts sign-in state, including data the caller chose,
  with the same secret and hands it to anyone who starts a social sign-in. An attacker
  can use this to get a fake profile for another user's email address that the proxy
  accepts as real."
