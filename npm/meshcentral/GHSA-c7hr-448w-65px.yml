title: "MeshCentral has unsanitized data fields"
description: "A rogue or compromised MeshAgent can inject arbitrary HTML/JavaScript
  via the osdesc (OS description) field in its coreinfo message. The server stores
  this value with zero HTML sanitization (meshagent.js:1903 only checks typeof ==
  'string'). When an admin views the\ndevice details panel, the value is rendered
  via addDeviceAttribute() → QH() which sets innerHTML, executing the payload in the
  admin's browser session. The main management UI CSP includes 'unsafe-inline' (webserver.js:7072),
  so inline event handlers and script execution are unrestricted."
