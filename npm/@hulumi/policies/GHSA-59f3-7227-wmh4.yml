title: "@hulumi/policies: Stack-wide evidence bypassed Cloudflare and deployment-governance
  guardrails"
description: "Impact: @hulumi/policies versions before 1.3.2 used stack-wide evidence
  shortcuts in several Cloudflare and deployment-governance validators. Unrelated
  compliant-looking evidence could suppress violations for different zones, hostnames,
  origins, or repositories in the same stack.\n\nPatched in 1.3.2: validators now
  correlate evidence to the specific protected resource and include regression coverage
  for unrelated-evidence bypasses.\n\nRemediation: upgrade @hulumi/policies to 1.3.2
  or later."
