title: "npm PraisonAI SandboxExecutor allowedCommands bypass via shell chaining"
description: "The published npm package `praisonai` exports `SandboxExecutor`, `CommandValidator`,
  and `sandboxExec` as \"safe command execution with restrictions.\" When `allowedCommands`
  is configured, `CommandValidator` checks only the first whitespace-delimited token
  of the command string. `SandboxExecutor` then passes the entire original string
  to `spawn(\"sh\", [\"-c\", command])`.\n\nWith a policy that allows only `echo`,
  this direct command is correctly rejected:\n\n```sh\ncat /tmp/marker\n```\n\nbut
  this chained command is accepted and executed:\n\n```sh\necho allowed; cat /tmp/marker\n```\n\nThe
  shell executes `cat` even though `cat` is not allowlisted. This bypasses the command
  allowlist and can execute arbitrary shell commands with the PraisonAI process privileges
  when an application, CLI workflow, or agent pipeline exposes sandbox command execution
  to lower-trust users, prompts, or model output.\n\nThe PoV is deterministic and
  local-only. It creates and reads only a temporary marker file."
