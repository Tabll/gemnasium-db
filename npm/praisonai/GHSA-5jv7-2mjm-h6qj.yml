title: "npm PraisonAI utility shell safe-command wrapper allowlist bypass via shell
  chaining"
description: "The published npm package `praisonai` ships `dist/tools/utility-tools.js`,
  which exports a `shell(command)` helper described in source as:\n\n```text\nExecute
  shell command (safe version - read-only commands)\n```\n\nThe helper attempts to
  enforce a safe read-only command allowlist by checking only the first whitespace-delimited
  token:\n\n```ts\nconst safeCommands = ['ls', 'cat', 'head', 'tail', 'wc', 'grep',
  'find', 'echo', 'date', 'pwd', 'which'];\nconst firstWord = command.split(/\\s+/)[0];\n\nif
  (!safeCommands.includes(firstWord)) {\nreturn { success: false, error: `Command
  not allowed: ${firstWord}` };\n}\n```\n\nIt then passes the entire original string
  to Node `child_process.exec()`:\n\n```ts\nconst { stdout, stderr } = await execAsync(command,
  { timeout: 5000 });\n```\n\nBecause `exec()` runs the command through a shell, a
  command string that starts with an allowed command can append a second non-allowlisted
  command with shell metacharacters. For example, direct `printf <marker>` is rejected,
  but `echo ok; printf <marker>` is accepted and executes `printf`.\n\nThis bypasses
  the helper's safe-command policy and allows arbitrary shell commands to run with
  the PraisonAI process privileges when an application, agent, or integration exposes
  this helper to lower-trust users, prompts, model output, or plugin/tool input.\n\nThe
  PoV is deterministic and local-only. It installs only the npm package, runs harmless
  marker commands, and does not contact any live service after installation."
