title: "npm PraisonAI MCPSecurity Basic/OAuth authentication policies accept invalid
  credentials without validation"
description: "The published npm package `praisonai` exports an `MCPSecurity` helper
  described in source as:\n\n```text\nMCP Security - Authentication, authorization,
  and rate limiting\nProvides security policies for MCP servers.\n```\n\nIts `AuthMethod`
  type advertises five authentication methods:\n\n```ts\nexport type AuthMethod =
  'none' | 'api-key' | 'bearer' | 'basic' | 'oauth';\n```\n\nThe authentication-policy
  evaluator, however, only validates credentials for `api-key` and `bearer`:\n\n```ts\nif
  (policy.auth.method === 'api-key' || policy.auth.method === 'bearer') {\nconst valid
  = policy.auth.validate\n? await policy.auth.validate(token)\n: this.validateApiKey(token);\n\nif
  (!valid) {\nreturn { allowed: false, reason: 'Invalid credentials' };\n}\n}\n\nreturn
  { allowed: true, context: { authenticated: true } };\n```\n\nFor `basic` and `oauth`,
  any non-empty `Authorization` header skips the supplied `validate` callback and
  returns allowed. A local PoV configures `auth.validate` to always return `false`;
  invalid `api-key` and `bearer` credentials are rejected, while invalid `basic` and
  `oauth` credentials are accepted without calling the validator.\n\nThis is a protection-mechanism
  failure in the exported npm MCP security helper. It is distinct from the separate
  issue that the npm `MCPServer` HTTP transport does not enforce authentication by
  default."
