title: "npm PraisonAI SandboxExecutor network-isolated mode does not block non-proxy-aware
  network clients"
description: "The published npm package `praisonai` exports a TypeScript `SandboxExecutor`
  with a `network-isolated` mode. The CLI lists that mode as:\n\n```text\nnetwork-isolated
  \ No network access (proxy blocked)\n```\n\nThe implementation does not create a
  network namespace, firewall rule, socket filter, or proxy-enforced execution boundary.
  It only injects proxy environment variables into the child process:\n\n```ts\nhttp_proxy:
  'http://localhost:0',\nhttps_proxy: 'http://localhost:0',\nHTTP_PROXY: 'http://localhost:0',\nHTTPS_PROXY:
  'http://localhost:0',\nno_proxy: '',\nNO_PROXY: ''\n```\n\nClients that do not explicitly
  honor those proxy variables continue to use the host network stack. A local-only
  PoV shows that, inside `mode: \"network-isolated\"`, a proxy-aware Node invocation
  is stopped, while a plain Node HTTP client reaches a loopback HTTP server from the
  same sandboxed command environment.\n\nThis is a network-isolation protection failure
  in an exported npm API and CLI mode. It is not a generic claim that every PraisonAI
  sandbox backend is affected."
