title: "npm PraisonAI MCPServer exposes unauthenticated HTTP tools/call"
description: "The published npm package `praisonai` exports a TypeScript `MCPServer`
  that can expose tools, resources, and prompts over an HTTP JSON-RPC transport with:\n\n```ts\nawait
  server.start({ port: 3000 });\n```\n\nThe HTTP transport has no authentication or
  authorization path. `MCPServerConfig` does not expose an auth/security setting,
  `startHttp()` ignores the `Authorization` header, and every POST request is parsed
  and forwarded directly to `handleRequest()`. That request handler dispatches sensitive
  MCP methods such as `tools/call`, `resources/read`, and `prompts/get`.\n\nThe implementation
  also calls `this.httpServer.listen(port)` without a host argument. In Node.js this
  binds to the unspecified address; the local PoV observed `{ address: \"::\", family:
  \"IPv6\" }`, making the service reachable on all interfaces on systems where the
  port is exposed.\n\nThis lets any network client that can reach the HTTP port list
  tools and invoke registered server-side tools without credentials. Supplying `Authorization:
  Bearer invalid` makes no difference."
