title: "Network-AI: AgentRuntime sandbox path-prefix checks allow file access outside
  the configured base directory"
description: "`AgentRuntime` promises scoped file access under a configured sandbox
  `basePath`, but its path containment checks use raw string prefix tests. A sandbox
  base such as `/tmp/network-ai-sandbox` also matches a sibling path such as `/tmp/network-ai-sandbox_evil/secret.txt`.\n\nAn
  agent/user that can call `AgentRuntime.readFile()` or `AgentRuntime.listDir()` can
  read or list files outside the intended sandbox when the target path is in a sibling
  directory sharing the base path prefix. This breaks the documented sandbox boundary.
  Confirmed in Network-AI 5.12.1. Severity: Medium, CVSS 3.1 vector `CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:C/C:H/I:N/A:N`."
