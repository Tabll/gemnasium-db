package_slug: "npm/network-ai"
title: "Network-AI: EnvironmentManager.restore() backup ID path traversal copies arbitrary
  directories into environment data"
description: "`EnvironmentManager.restore(env, backupId)` computes the backup path
  with `join(envDir, '.backups', backupId)` and only checks that this path exists.
  It does not resolve the result or verify that it remains under `data/<env>/.backups`.\n\nA
  caller can pass a traversal backup ID such as `../../../outside/source-dir` to restore
  files from an arbitrary directory into the target environment data directory. Confirmed
  in Network-AI 5.12.1."
