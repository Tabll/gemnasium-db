package_slug: "npm/network-ai"
title: "Network-AI: EnvironmentManager.backup() follows symlinked directories and
  copies files outside the environment root into backups"
description: "`EnvironmentManager.backup()` recursively collects files using `_collectBackupFiles()`.
  `_collectBackupFiles()` uses `statSync(full)`, which follows symlinks. If `data/<env>`
  contains a symlink to a directory outside the environment root, backup recursion
  follows the symlink and copies external files into `data/<env>/.backups/<backupId>/`.\n\nAn
  attacker who can place a symlink under the environment data directory can cause
  backup operations to disclose files outside the environment root into backup artifacts.
  Confirmed in Network-AI 5.12.1."
