package_slug: "npm/adm-zip"
title: "adm-zip: Duplicate ZIP entry names: getEntry() and extractAllTo() resolve
  to different content"
description: "A ZIP file can contain two entries with the identical name. adm-zip
  keeps both in its internal entry list, but its name-lookup table only retains the
  last one written. `getEntry(name)` and `extractAllTo()` walk these two different
  internal structures, so they can each resolve a duplicate name to a *different*
  entry. An application that validates a named entry's contents via `getEntry()` before
  trusting an archive, then extracts the whole archive, can end up approving one file's
  content while a different file's bytes are what actually land on disk under that
  name."
