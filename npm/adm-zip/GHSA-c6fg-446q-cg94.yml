package_slug: "npm/adm-zip"
title: "adm-zip: getDataAsync() bypasses the maxOutputLength size guard enforced by
  the synchronous getData() path"
description: "adm-zip enforces a `maxOutputLength` guard against decompression bombs
  on its synchronous `getData()` path, but the equivalent asynchronous `getDataAsync()`
  path does not enforce it — it accumulates and returns the entire decompressed output
  regardless of the entry's declared size. An application that checks an entry's declared
  size before deciding to process it, then reads the entry via `getDataAsync()` (a
  completely ordinary, often-recommended choice for I/O in Node.js), gets none of
  the protection it believes it has."
