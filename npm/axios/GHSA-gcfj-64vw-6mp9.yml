title: "Axios Node HTTP adapter can use an inherited proxy after interceptor config
  cloning"
description: "Axios’ Node.js HTTP adapter can route requests through an attacker-controlled
  proxy when `Object.prototype.proxy` is polluted and request configuration is materialized
  as a regular object before dispatch.\n\nRecent axios releases harden merged request
  config by creating a null-prototype object. However, request interceptors run after
  that merge and may return a replacement config. A common immutable interceptor pattern
  such as `{...config}` or `Object.assign({}, config)` converts the hardened config
  back into a normal object. Axios then dispatches that object without re-hardening
  it, and the Node HTTP adapter reads `config.proxy` through the prototype chain.\n\n\nAxios
  hardens merged request config by creating a null-prototype object, preventing polluted
  Object.prototype properties from influencing request behavior. Request interceptors
  run after that hardening, and a normal immutable\ninterceptor pattern such as {...config}
  or Object.assign({}, config) re-materializes the config as a regular object. Axios
  then dispatches that interceptor-returned object without re-hardening it. In the
  Node HTTP adapter, config.proxy\nis read through the prototype chain, allowing a
  polluted Object.prototype.proxy to route authenticated HTTP requests through an
  attacker-controlled proxy."
