package_slug: "npm/axios"
title: "Axios: Nested axios option objects can consume polluted prototype values"
description: "Axios can consume inherited properties from nested request option objects
  when the JavaScript process already has a polluted `Object.prototype`.\n\nThe top-level
  merged config is protected with a null prototype, but nested plain objects such
  as `auth` and `paramsSerializer` are cloned into ordinary objects. If application
  code passes placeholders such as `auth: {}` or `paramsSerializer: {}`, inherited
  `username`, `password`, `encode`, or `serialize` properties can influence outbound
  requests.\n\naxios 1.16.1 mitigates prototype-pollution gadgets on the top-level
  request config but not on nested option objects. When a caller passes a partial
  nested option object such as auth: {} or paramsSerializer: {}, axios reads inner
  fields (username, password, encode, serialize) through the prototype chain. If Object.prototype
  has been polluted by another component in the same Node.js process, those inherited
  values are silently injected into the outbound request, including the Authorization
  header and the serialized query string."
