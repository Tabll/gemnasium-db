title: "Axios: NO_PROXY bypass for 0.0.0.0 local addresses in axios"
description: "Axios versions containing `lib/helpers/shouldBypassProxy.js` do not
  treat `0.0.0.0` as a local address when evaluating `NO_PROXY` rules. In Node.js
  applications that use `HTTP_PROXY` or `HTTPS_PROXY` together with `NO_PROXY=localhost,127.0.0.1,::1`
  or similar, a request to `http://0.0.0.0:<port>/` can be routed through the configured
  proxy instead of bypassing it.\n\nThe issue is exploitable when an attacker can
  influence the axios request URL or a followed redirect target, and when the proxy
  can reach or relay `0.0.0.0` to local services. This is a Node.js runtime proxy-routing
  issue, not a browser, install-time, or development-tooling issue.\n\n`axios` versions
  1.15.0–1.16.1 contain an incomplete loopback-address check in `lib/helpers/shouldBypassProxy.js`.
  The `isLoopback()` function correctly identifies `127.0.0.0/8` and `::1` as loopback
  addresses but does not recognise `0.0.0.0` — the IPv4 unspecified address, which
  routes to the local machine on Linux and macOS.\n\nAn attacker who controls a URL
  passed to axios can use `http://0.0.0.0/<path>` to bypass proxy-based SSRF filtering
  that the application relies upon."
