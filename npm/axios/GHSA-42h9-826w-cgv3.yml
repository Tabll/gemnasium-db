title: "Axios: Excessive recursion in formDataToJSON can cause denial of service"
description: "Axios versions `0.28.0` and later contain uncontrolled recursion in
  `formDataToJSON`, the helper behind the public `axios.formToJSON()` / named `formToJSON`
  API and the default request transform used when FormData is sent with an `application/json`
  content type.\n\nApplications are affected when they pass attacker-controlled `FormData`
  field names into this functionality. A field name with thousands of nested bracket
  segments can exhaust the JavaScript call stack and throw `RangeError: Maximum call
  stack size exceeded`, causing request failure and, in applications that do not handle
  the exception or rejected promise, possible process termination.\n\nThe `shouldBypassProxy()`
  function in Axios fails to recognise `0.0.0.0`, `::`, and `::ffff:0.0.0.0` as loopback
  addresses. When `NO_PROXY=localhost` is configured, requests to these addresses
  are incorrectly forwarded through the proxy instead of being sent directly, enabling
  an SSRF attack against internal services reachable via the proxy's loopback interface."
