title: "Axios: Prototype pollution auth subfields can inject Basic auth"
description: "Axios versions after the `GHSA-q8qp-cvcw-x6jj` fix still contain prototype-pollution
  read-side gadgets in Basic auth subfield handling. If a host application is already
  affected by prototype pollution and then makes an axios request with an own `auth`
  object that omits `username` or `password`, axios reads inherited `Object.prototype.username`
  and `Object.prototype.password` values and uses them to construct an outbound `Authorization:
  Basic ...` header.\n\nThis does not mean axios itself pollutes prototypes. Exploitation
  requires a separate prototype-pollution primitive in the host process, plus an axios
  call pattern such as `auth: opts.auth || {}`.\n\n\nAfter [GHSA-q8qp-cvcw-x6jj](https://github.com/axios/axios/security/advisories/GHSA-q8qp-cvcw-x6jj)
  / [PR #10779](https://github.com/axios/axios/pull/10779) (shipped in `v1.15.2`)
  and the further proxy-side hardening in\n[PR #10833](https://github.com/axios/axios/pull/10833)
  (merged 2026-05-02), the **top-level** `config.auth` and the **proxy auth**sub-fields
  are correctly read via `utils.hasOwnProp`. The **regular request auth sub-fields**
  (`config.auth.username` and `config.auth.password`) and the **`config.params` /
  `config.paramsSerializer`** reads inside `resolveConfig.js` are still unguarded
  against a polluted `Object.prototype`.\n\nWhen a polluted host process makes an
  axios call with the common \"optional override\" pattern (`auth: opts.auth || {}`
  — an empty own `{}`), the sub-field reads `configAuth.username` and `configAuth.password`
  walk the prototype chain and return the attacker-controlled values. Same for `params`
  and `paramsSerializer`. The outbound HTTP request then carries an attacker-chosen
  `Authorization: Basic <base64>` header and an attacker-chosen querystring, leaking
  credentials and exfiltrating data to whichever host the request goes to (often attacker-influenced
  too — i.e. the amplifier is wired into many credential-stuffing chains).\n\nReproduces
  against `axios` `main` HEAD (`34723be`, dated 2026-05-24)\nas well as the released
  `v1.16.1`."
