title: "Axios: Deep formToJSON Key Recursion Can Cause Denial of Service"
description: "Axios versions starting with `0.28.0` contain uncontrolled recursion
  in `formDataToJSON`, which is exposed as `axios.formToJSON()` and used internally
  when axios serialises `FormData` with `Content-Type: application/json`.\n\nIf an
  application passes attacker-controlled `FormData` field names to this functionality,
  a field name with thousands of nested bracket segments can exhaust the JavaScript
  call stack and cause denial of service for that request or, in applications without
  appropriate error handling, process termination.\n\nAn uncontrolled recursion vulnerability
  in `formDataToJSON` allows any user who controls FormData input to crash a Node.js
  process with a single request. The function recurses once per bracket-delimited
  segment in a FormData key name with no depth limit, so a key like `a[x][x][x]...`
  with 15,000+ segments exhausts the call stack. This is a denial-of-service that
  kills the process via an unrecoverable `RangeError`. The inverse function `toFormData`
  already enforces a `maxDepth` limit (default 100) for exactly this reason — `formDataToJSON`
  lacks the equivalent guard."
