title: "Axios: Prototype pollution gadgets can alter axios request construction"
description: "axios is vulnerable to read-side prototype-pollution gadgets when `Object.prototype`
  has already been polluted by another vulnerability or dependency. The most broadly
  reachable issue is in the bodyless method aliases: `axios.get()`, `axios.delete()`,
  `axios.head()`, and `axios.options()` read inherited `data` before config normalization,
  causing attacker-controlled body data to be sent on requests that did not explicitly
  set a body.\n\nAdditional low-level paths affect consumers that call exported adapters/helpers
  directly with plain config objects. In those cases, inherited `proxy` or `paramsSerializer`
  values can influence request routing or URL serialization. These low-level paths
  are not reproduced through normal `axios.get()` usage on `1.15.2+`.\n\n\nThree prototype
  pollution read-side gadgets in axios bypass the `own()` hasOwnProp guard pattern,
  allowing a polluted `Object.prototype` to hijack outbound requests."
