title: " SearXNG MCP Server: DNS-resolved Private Hostname SSRF in `web_url_read`"
description: "The `web_url_read` MCP tool in `mcp-searxng` is vulnerable to Server-Side
  Request Forgery (SSRF) via DNS rebinding bypass. The `assertUrlAllowed()` function
  at `src/url-reader.ts:85-93` validates only the syntactic hostname string against
  a private IP/hostname blocklist without performing DNS resolution. An attacker who
  controls a domain that resolves to a private or loopback IP address (e.g., via a
  wildcard DNS service like `nip.io`, or a custom DNS entry) can bypass the security
  check and cause the MCP server to read arbitrary internal HTTP services reachable
  from the server host. This allows exfiltration of sensitive data from internal services
  with no authentication required in the default HTTP configuration."
