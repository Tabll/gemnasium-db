package_slug: "npm/mcp-searxng"
title: " SearXNG MCP Server: Unbounded Response Body Read Bypasses URL Size Limit
  in `web_url_read`"
description: "The `web_url_read` MCP tool in mcp-searxng enforces its 5 MiB response-size
  limit exclusively by inspecting the `Content-Length` header of a preliminary HEAD
  request. When a server omits `Content-Length` — a standard HTTP practice — `checkContentLength()`
  returns `null`, the guard condition short-circuits to `false`, and `response.text()`
  loads the entire response body into memory without any byte cap. An unauthenticated
  attacker who controls or can redirect to an HTTP endpoint can force the server process
  to consume unbounded memory and CPU, leading to a Denial of Service."
