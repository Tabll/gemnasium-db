title: "SearXNG Basic Authentication Credentials Exposed Through MCP Logs and JSON-RPC
  Error Responses"
description: "mcp-searxng version 1.11.0 exposes SearXNG Basic Authentication credentials
  embedded in the `SEARXNG_URL` environment variable.\n\nWhen the server starts in
  STDIO mode and an MCP client connects, the complete `SEARXNG_URL`, including its
  username and password, is sent to the client through an MCP `notifications/message`
  logging notification.\n\nAdditionally, when URL validation fails, the complete credential-bearing
  URL is included in the configuration error. This error is logged through MCP and
  returned to the client as a JSON-RPC error response.\n\nFor example, a value such
  as:\n\n```text\nhttp://username:password@searxng.example.com\n```\n\nis exposed
  without redaction.\n\nA connected MCP client or anyone with access to captured server
  logs may recover the SearXNG credentials and use them to access the configured SearXNG
  instance.\n\nThe issue was confirmed in:\n\n```text\nmcp-searxng 1.11.0\n```\n\nSuggested
  severity: **Medium**"
