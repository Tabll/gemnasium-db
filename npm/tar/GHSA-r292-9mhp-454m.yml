title: "node-tar: Uncontrolled recursion in mapHas/filesFilter allows uncatchable
  stack-overflow DoS via crafted long-path tar with member selection"
description: "`node-tar` (npm `tar`) contains an uncontrolled-recursion stack-exhaustion
  DoS in the internal `mapHas` helper used by `filesFilter`. When a consumer calls
  `tar.t(...)` or `tar.x(...)` with a non-empty member-selection list, node-tar installs
  a filter that closes over the recursive `mapHas` (`src/list.ts:33-44`). `mapHas`
  walks an entry path upward one `path.dirname()` call per recursion **with no segment
  cap**. A single crafted tar with a GNU-`L` (or PAX-`x`) long-path header can deliver
  a path of tens of thousands of `/`-separated segments (up to `maxMetaEntrySize`
  = 1 MiB). The recursion overflows the call stack, throwing an uncatchable `RangeError`
  that terminates the Node process on async/streaming consumers."
