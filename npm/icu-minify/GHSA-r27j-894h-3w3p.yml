package_slug: "npm/icu-minify"
title: "mcp-data-vis vulnerable to denial of service via unsanitized `select` key
  lookup on `Object.prototype` with `precompile: true`"
description: "`icu-minify`'s runtime formatter resolves `select` branches by looking
  up the runtime value as a plain property on a prototype-bearing object. When the
  value coerces to a key that exists on `Object.prototype` (e.g. `toString`, `__proto__`,
  `constructor`, `hasOwnProperty`, `valueOf`), the lookup returns a truthy value that
  short-circuits the `?? options.other` fallback, and the downstream iterator crashes
  with `TypeError: nodes is not iterable`. Any consumer that forwards user input into
  a `{arg, select, …}` placeholder — a common idiom for `role`, `status`, `type`,
  `gender` — can be crashed per-request by supplying one of those keys. In Next.js
  SSR (via `next-intl` with `experimental.messages.precompile`) this yields a 500
  for the affected render."
