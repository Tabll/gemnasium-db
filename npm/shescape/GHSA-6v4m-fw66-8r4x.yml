title: "Shescape: Path disclosure on Unix with Zsh"
description: "This impacts users of Shescape on Unix systems that explicitly configure
  `shell` to Zsh, or `true` when the default shell is Zsh, using the `escape` and
  `escapeAll`. The Zsh options `EXTENDED_GLOB` and `MAGIC_EQUAL_SUBST` exacerbate
  the problem.\n\nIn certain case, an attacker can leverage home directory expansion
  and extended glob syntax to obtain lists of files and directories on the system.
  Depending on what the command does, this may be used to leak more information."
