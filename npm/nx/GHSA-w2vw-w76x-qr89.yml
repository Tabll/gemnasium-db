package_slug: "npm/nx"
title: "Nx: OS command injection via git revisions and remote refs"
description: "Nx core builds several `git` invocations as shell command strings with
  untrusted values interpolated into them, so a value that should be a git revision
  or ref is parsed by `/bin/sh` instead. Two entry points are reachable by an attacker:
  `affected` commands, where `defaultBase` / `affected.defaultBase` from `nx.json`
  (and the `NX_BASE` / `NX_HEAD` environment variables) reach `git merge-base` and
  `git diff`; and `nx import`, where a branch name advertised by a remote repository
  reaches `git fetch`, `git checkout`, and `git config`. In both cases an attacker
  who controls a repository — or who opens a pull request against one — gets arbitrary
  command execution on the machine of anyone who runs an ordinary Nx command against
  it, including CI runners.\n\nThe `affected` path is the more serious of the two.
  `nx affected` and `nx show projects --affected` run constantly in CI, so a pull
  request that changes nothing but `nx.json` is enough to execute code on the runner
  with whatever credentials that job holds."
