package_slug: "npm/parse-server"
title: "parse-server: Denial of service via exponential-time processing of deeply
  nested query operators"
description: "Parse Server is vulnerable to denial of service. A remote attacker can
  send a single, small query (~1 KB) containing deeply nested query condition operators.
  Parse Server processes the nested structure with exponential time complexity, which
  blocks the Node.js event loop and makes the server unresponsive to all clients for
  the duration of processing. A single request can occupy the event loop for many
  seconds, and the request is repeatable. The issue affects the REST API and LiveQuery
  query handling and is reachable in the default configuration. Exploitation requires
  only the public application identifier; no user authentication is needed."
