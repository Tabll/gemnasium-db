description: "Disclosure of the contents of arbitrary `.map` files reachable via path
  traversal (or absolute path when `from` is unset) from the process's filesystem.
  Affects any application processing CSS it does not fully trust without explicitly
  passing `map: false`. No authentication or user interaction beyond submitting CSS
  text is required."
