package_slug: "npm/@cyclonedx/cdxgen"
title: "@cyclonedx/cdxgen: Maven project scanning may allow shell command injection
  through repository-controlled module paths"
description: "A command injection vulnerability existed in the Maven scanning flow
  of cdxgen before version 12.4.3.\n\nWhen cdxgen scanned an attacker-controlled Maven
  project, repository-controlled paths could be used in the Maven command construction.
  In affected versions, some Maven invocations were executed with `shell: true`. A
  directory name containing shell metacharacters could therefore be interpreted by
  the shell instead of being treated only as a filesystem path.\n\nThis could allow
  an attacker who controls a scanned repository to execute commands in the cdxgen
  process context.\n\nThe issue affected both the CLI and server mode. The issue is
  patched in `12.4.3`."
