title: "@cyclonedx/cdxgen: Docker registry auth substring match forwards credentials
  to a different registry"
description: "When cdxgen scans or pulls container images through the Docker daemon
  API, it builds an `X-Registry-Auth` header from Docker credentials in `DOCKER_CONFIG/config.json`.
  The credential selection logic matches configured registry keys with substring checks:\n\n```js\nif
  (forRegistry && !serverAddress.includes(forRegistry)) {\ncontinue;\n}\n```\n\nThis
  is not an origin-safe registry comparison. For example, credentials configured for
  `private-registry.example.com` are selected for a requested image under `registry.example.com`,
  because:\n\n```js\n\"private-registry.example.com\".includes(\"registry.example.com\")
  === true\n```\n\nThe selected credentials are then serialized into `X-Registry-Auth`
  for the Docker API pull request targeting the requested registry."
