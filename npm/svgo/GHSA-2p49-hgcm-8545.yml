title: "SVGO removeScripts plugin leaves some executable scripts intact"
description: "SVGO's removeScripts plugin (disabled by default) removes scripts from
  the SVG, however executable scripts were left intact in some cases. If a consumer
  relied on this plugin for sanitization and served them to users, these SVGs could
  open up doors to XSS."
