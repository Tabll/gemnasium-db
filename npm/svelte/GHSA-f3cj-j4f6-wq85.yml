title: "Svelte: SSR XSS via Insecure Promise Serialization in hydratable"
description: "Contents of `hydratable` promises were not properly stringified, potentially
  leading to an XSS exploit. You are vulnerable if all of the following is true:\n-
  you are using `hydratable` (an experimental feature at the time of this report)\n-
  you are passing attacker-controlled input such that a synchronous value is hydrated,
  then a promise value, e.g. `hydratable('someKey', () => [synchronousValue, promiseValue])`"
