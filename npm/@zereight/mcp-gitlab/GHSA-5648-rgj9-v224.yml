title: "@zereight/mcp-gitlab has multiple safety-control bypasses: execute_graphql
  read-only + allow-list bypass, unauthenticated transports, session-exhaustion DoS"
description: "@zereight/mcp-gitlab exposes GitLab to an LLM agent while relying on
  read-only mode, a project allow-list, and transport auth as its safety controls.
  Five defects defeat those controls. Under the MCP threat model, tool-call arguments/content
  can be shaped by untrusted input (prompt injection) or a malicious client.\n\nReviewed
  commit: 60adcc0de5b0e96c4c2029f7a25d2775946421d8 (package version 2.1.28). Source
  review only; PoCs are local/offline.\n\n- F1 (HIGH) execute_graphql defeats BOTH
  read-only mode and GITLAB_ALLOWED_PROJECT_IDS.\n- F2 (HIGH, deployment-conditional)
  Streamable HTTP /mcp unauthenticated under cookie-jar / device-flow credentials.\n-
  F3 (MEDIUM) SSE unauthenticated by default, no Origin/Host validation (DNS rebinding).\n-
  F4 (HIGH) unauthenticated session/transport-exhaustion DoS (token check is syntactic
  only).\n- F5 (LOW) CI job trace returned verbatim (prompt-injection surface)."
