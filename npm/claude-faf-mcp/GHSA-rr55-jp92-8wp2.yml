package_slug: "npm/claude-faf-mcp"
title: "claude-faf-mcp has an arbitrary local file read/write via unconfined `path`
  argument in FAF tools"
description: "`claude-faf-mcp` MCP tools accept a caller-controlled `path` argument
  and resolve it (`~` expansion + `path.resolve()`) straight into a filesystem read/write
  **without confining it to a trusted project directory**. An absolute path or `../`
  traversal is resolved and used as-is, so the server process can be made to read
  — and, via the file tools, write — files outside the intended `.faf` project context.
  The only remaining limit is OS file permissions."
