title: "vm2 setup-sandbox.js violates Defense Invariant #11 in stack-trace formatter"
description: "`defaultSandboxPrepareStackTrace` in `lib/setup-sandbox.js` (lines 605,
  607) appends to a fresh sandbox-realm `lines = []` via `lines[lines.length] = value`.
  This is the exact invariant-violating pattern that GHSA-9qj6-qjgg-37qq (commit ca195f0,
  2026-05-01) just patched in `neutralizeArraySpeciesBatch` and codified as Defense
  Invariant #11 (\"Bridge-internal containers must not invoke sandbox code\"). A sandbox-installed
  `Array.prototype[N]` setter fires during the bridge's safe-default stack-trace formatting
  and observes / intercepts each appended line."
