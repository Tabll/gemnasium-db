package_slug: "npm/@modelcontextprotocol/sdk"
title: "MCP TypeScript SDK: HTTP server transports and handlers did not limit request
  body size or JSON-RPC batch length"
description: "In affected versions, MCP servers reachable over HTTP put no limit on
  the size of a POST body or on the number of messages in a JSON-RPC batch. Large
  requests could exhaust the server's memory, and one long batch could block it from
  serving anyone else. No credentials were needed, unless your application authenticates
  requests before they reach the SDK."
