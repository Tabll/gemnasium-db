package_slug: "npm/neotoma"
title: "neotoma has tenant isolation gap in relationship query endpoints"
description: "The `/list_relationships` and `/retrieve_graph_neighborhood` endpoints
  call `getAuthenticatedUserId` (confirming a valid session exists) but do not pass
  the resolved user ID into the Supabase query as an `.eq(\"user_id\", userId)` filter.
  As a result, queries return rows from all users rather than scoping to the authenticated
  caller's data."
