package_slug: "npm/next-auth"
title: "Auth.js: OAuth state, nonce, and PKCE check cookies are not bound to the provider
  that created them"
description: "Auth.js stores the OAuth/OIDC anti-CSRF checks (`state`, `nonce`, and
  the PKCE verifier) in global cookies that are not bound to the provider that created
  them. On callback, a check value minted during a sign-in started with one provider
  can satisfy the callback for a different provider, because the stored cookie is
  not verified against the callback provider's identity (provider id, issuer, client
  id, or redirect URI). In a multi-provider app that allows account linking while
  logged in, this provider-confusion / mix-up condition can let an attacker link their
  account at a second provider to a victim's user."
