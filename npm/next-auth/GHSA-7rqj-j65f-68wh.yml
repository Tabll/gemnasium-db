package_slug: "npm/next-auth"
title: "Auth.js: Email normalizer validates the address before Unicode normalization,
  allowing a homoglyph @ bypass"
description: "The default email-address normalizer used by the email/magic-link sign-in
  flow validates the address **before** applying Unicode normalization. An address
  can contain a Unicode character that is not an ASCII `@` (U+0040) but canonicalizes
  to one under NFKC/NFKD normalization (the normalization commonly applied by mail
  libraries and services for internationalized email). Such an address passes the
  normalizer's single-`@` check, but a downstream mail library that normalizes the
  string then sees two `@` separators and may deliver the passwordless sign-in link
  to a different recipient than intended. This is an instance of validating before
  canonicalizing."
