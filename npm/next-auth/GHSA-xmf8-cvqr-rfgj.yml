title: "Auth.js: getToken() throws an uncaught exception on malformed Bearer authorization
  headers"
description: "The exported `getToken()` helper (`next-auth/jwt` and `@auth/core/jwt`)
  can throw an uncaught exception when it reads a malformed `Authorization: Bearer
  …` header. When no session cookie is present, `getToken()` URL-decodes the bearer
  value before validating it, and malformed percent-encoding causes the decode step
  to throw rather than being treated as an invalid token. Because `getToken()` is
  commonly called in API routes, middleware, and other request handlers, a single
  unauthenticated request can trigger an unhandled exception in code paths that authenticate
  requests."
