package_slug: "npm/odf-kit"
title: "odf-kit has HTML injection leading to XSS in odsToHtml() via unescaped style
  attribute values"
description: "ODF style values are interpolated into `style=\"...\"` attributes without
  HTML-escaping in odf-kit's ODS to-HTML renderer (`odsToHtml()`). A double-quote
  character inside an attacker-controlled style value breaks out of the attribute,
  allowing arbitrary HTML/attribute injection — and therefore script execution (XSS)
  — from a crafted `.ods` file wherever the rendered output is inserted as HTML, which
  is the documented purpose of the function."
