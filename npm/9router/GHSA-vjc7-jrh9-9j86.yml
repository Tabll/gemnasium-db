title: "9router has unauthenticated CRUD on /api/providers and Full API Key Leak via
  /api/usage/stats"
description: "Multiple critical API security vulnerabilities were discovered in 9Router's
  Next.js dashboard. The `/api/providers` endpoints lack authentication entirely,
  allowing anyone to create, read, update, and delete provider connections. Additionally,
  `/api/usage/stats` exposes full plaintext API keys, and `/api/usage/request-logs`
  + `/api/usage/request-details` expose all users' request history and full conversation
  contents (including system prompts, user messages, assistant responses) without
  authentication."
