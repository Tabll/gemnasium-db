package_slug: "npm/9router"
title: "9router: Missing Authorization and OS Command Injection"
description: "`POST /api/tunnel/tailscale-install` accepts a JSON body with a `sudoPassword`
  field and pipes it, followed by the body of `https://tailscale.com/install.sh`,
  into a child process spawned as `sudo -S sh`. The route is not present in the dashboard
  middleware matcher in `src/proxy.js`, so the request reaches the handler without
  invoking `dashboardGuard.proxy()`. In deployments where the Node process runs as
  root (Docker images derived from `node:*` without a `USER` directive, `npm i -g
  9router` invoked as root, or `systemd` units without `User=`), the spawned `sh`
  runs as root and executes the attacker-supplied bytes."
