package_slug: "npm/@budibase/server"
title: " Budibase: Unauthenticated REST Datasource Credential Theft via Cross-Origin
  Auth Leak "
description: "Budibase attaches a REST datasource's stored credentials (Bearer/Basic
  tokens and static headers) to an outgoing request before it decides which host the
  request goes to, and never checks that the destination host matches the datasource.
  A query's request path can be pointed at any host (via an absolute URL or a user-supplied
  `{{ parameter }}`), so the stored credentials are delivered to an attacker-chosen
  server. Because a query can be published with the PUBLIC role, this is reachable
  by a fully unauthenticated attacker with one HTTP request. The credentials are masked
  (`--secret-value--`) everywhere in the API, yet this recovers them in cleartext.
  This is a bypass of GHSA-3gp5 (which fixed the base-URL rewrite vector but added
  no same-origin check; the query-path vector remains, now unauthenticated)."
