title: " Budibase: NoSQL injection in MongoDB integration: collection dump, $where
  JS exec, cross-collection pivot, arbitrary update/delete"
description: "An end-user injection in Budibase's MongoDB datasource lets any BASIC
  app user bypass the builder's query-level access controls. Builders scope MongoDB
  reads per-user with bindings like `{\"email\": \"{{ currentUser.email }}\"}` so
  each app user only sees their own rows. Because the binding is handlebars-enriched
  into the query JSON with `noEscaping: true` and then `JSON.parse`d, Bob (a BASIC
  user) overrides the builder's filter with a MongoDB operator and reads every document
  the connection can touch. SQL datasources are parameterized through `interpolateSQL()`;
  the MongoDB path has no equivalent, so the scoping pattern Budibase's own docs show
  is unsafe."
