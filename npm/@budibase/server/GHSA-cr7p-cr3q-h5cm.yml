package_slug: "npm/@budibase/server"
title: " Budibase: Account Enumeration via Login Lockout Response Differential"
description: "The login lockout mechanism in Budibase creates an observable response
  discrepancy that allows unauthenticated attackers to enumerate valid email addresses.
  When an existing user's account is locked after 5 failed login attempts, the server
  returns a distinct `403` response with `X-Account-Locked: 1` and `Retry-After: 900`
  headers plus the message \"Account temporarily locked.\" For non-existing users,
  the response is always a generic `403 \"Unauthorized\"` regardless of attempt count,
  because the lockout counter is never incremented."
