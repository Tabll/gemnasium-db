package_slug: "npm/@budibase/server"
title: " Budibase: Server Filesystem Existence/Read Oracle via Builder-Controlled
  MongoDB tlsCertificateKeyFile"
description: "When creating a MongoDB datasource, Budibase passes the `tlsCertificateKeyFile`
  and `tlsCAFile` fields straight to the MongoDB driver as server-side file paths.
  On Budibase Cloud a customer cannot place files on the server, so these fields only
  let a builder reference arbitrary absolute paths on the underlying multi-tenant
  server. When the datasource is verified, the driver performs a real filesystem read
  of that path, and the error differs by file state, turning `/api/datasources/verify`
  into an arbitrary-path existence/read oracle over the whole server filesystem."
