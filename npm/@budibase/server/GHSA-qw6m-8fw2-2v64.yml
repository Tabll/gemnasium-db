package_slug: "npm/@budibase/server"
title: " Budibase: NoSQL Injection via JSON Parameter Interpolation in MongoDB Query
  Execution"
description: "Budibase's MongoDB query execution endpoint (`POST /api/v2/queries/:queryId`)
  is vulnerable to NoSQL injection through user-supplied query parameters. The `enrichContext()`
  function interpolates parameter values into JSON query templates using Handlebars
  with `noEscaping: true`, then parses the result with `JSON.parse()`. An attacker
  can inject JSON metacharacters (`\"`, `{`, `}`) into parameter values to alter the
  structure of MongoDB queries, bypassing intended filters to read, modify, or delete
  arbitrary documents."
