package_slug: "npm/@budibase/server"
title: " Budibase: S3 presigned URL endpoint authorization regression in v3.39.4 allows
  BASIC users to obtain S3 PutObject presigned URLs"
description: "In Budibase v3.39.4, a regression in the authorization level for the
  S3 attachment upload endpoint allows any BASIC app user to obtain S3 PutObject presigned
  URLs. The endpoint uses TABLE/WRITE permission level instead of the intended BUILDER
  level defined in v3.39.3. Additionally, the controller does not pin the target bucket
  to the datasource's configured bucket, allowing writes to any S3 bucket the stored
  IAM credentials can access."
