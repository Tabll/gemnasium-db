title: "Budibase: MySQL DESCRIBE Backtick Injection via multipleStatements in Database
  Connector"
description: "**This is a related but independently fixable vulnerability to GHSA-qqf5-x7mj-v43p\n(PostgreSQL
  SQL injection), reported in the same original disclosure and\nsplit per GitHub CNA
  guidance (rule 4.2.11) since it affects a separate\nintegration, has a distinct
  attack precondition, and requires a separate\npatch.**\n\nThe MySQL integration
  enables `multipleStatements: true` on the connection,\npermitting semicolon-separated
  multi-statement execution. During table\nintrospection, table names retrieved from
  `INFORMATION_SCHEMA.TABLES` are\ninterpolated into a `DESCRIBE` query wrapped in
  backticks, but embedded\nbackticks in the table name are never escaped — allowing
  a malicious table\nname to break out and inject a second, attacker-controlled statement."
