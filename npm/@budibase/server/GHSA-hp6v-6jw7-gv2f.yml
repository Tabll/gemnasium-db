package_slug: "npm/@budibase/server"
title: " Budibase: OIDC SSO account takeover: incoming identity linked by email without
  checking email_verified"
description: "Budibase's OIDC SSO login links an incoming SSO identity to an existing
  Budibase account **by email address alone**, without ever checking the `email_verified`
  claim of the OIDC ID token. Budibase first tries to match the IdP `sub`; when that
  misses (any fresh attacker IdP account) it silently falls back to matching by the
  `email` claim and **merges into the existing account by email**, preserving that
  account's `_id` and roles. Because the `email_verified` flag is never read, an attacker
  who can make a **configured/trusted** IdP emit a token carrying `email = <victim>`
  with `email_verified = false` is logged into Budibase **as the victim**, inheriting
  the victim's roles (including global admin/builder). Per OIDC Core §5.7 the `email`
  claim MUST NOT be used as an identity key unless `email_verified` is `true`; Budibase
  effectively delegates all account-linking trust to every configured IdP's email-verification
  policy while checking nothing itself. Full account takeover of any existing Budibase
  user, including the instance owner."
