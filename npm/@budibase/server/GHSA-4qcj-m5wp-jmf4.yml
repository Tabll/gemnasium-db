title: " Budibase: Missing RBAC on GET /api/global/groups allows BASIC users to enumerate
  all tenant groups and role mappings"
description: "The `GET /api/global/groups` endpoint on the worker service has no role-based
  authorization middleware. Any authenticated user (including BASIC role) can enumerate
  all user groups in the tenant, including their role mappings, user memberships,
  builder permissions, and the isDefault flag."
