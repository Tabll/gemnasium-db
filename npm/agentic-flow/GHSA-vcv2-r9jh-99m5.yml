package_slug: "npm/agentic-flow"
title: "Agentic-Flow: OS Command Injection in agentic-flow MCP server tools via unsanitized
  tool-parameter interpolation into execSync"
description: "`agentic-flow` versions `<= 2.0.13` MCP server tools interpolated attacker-influenceable
  tool parameters (e.g. `agent`, `task`, `name`, `language`, `agentdb` arguments)
  directly into shell command strings passed to `execSync()`. A malicious value reaching
  any of the affected MCP tools could break out of the surrounding double-quoted argument
  and execute arbitrary OS commands with the privileges of the user running the MCP
  server.\n\nThis was a partial-fix gap: prior commit `6a06854` (#158) fixed CWE-78
  elsewhere in the project but missed the MCP server files entirely."
