title: "Astro: Remote code execution through AVIF image optimization"
description: "A vulnerability in `libheif`, used by the default Sharp image service
  in Astro, can lead to remote code execution when a malicious AVIF image is optimized.\n\nProjects
  are affected when an attacker can cause Astro to process an untrusted AVIF image.\n\nThe
  fix was released in Astro 7.2.8, which requires Sharp 0.35.4."
