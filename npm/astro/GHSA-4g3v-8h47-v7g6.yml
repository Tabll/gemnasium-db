title: "Astro: Reflected XSS via unescaped View Transition animation properties"
description: "Astro's server-side View Transition CSS generator interpolates animation
  properties into an inline `<style>` element without escaping them for the CSS and
  HTML contexts.\n\nAn attacker-controlled value passed to an animation property such
  as `duration` can contain a `</style>` sequence, terminate the generated style element,
  and inject arbitrary HTML or JavaScript.\n\nThis is similar to GHSA-8hv8-536x-4wqp,
  but exploits a different injection point: unescaped View Transition animation values
  in a server-generated `<style>` element rather than an unescaped slot name in a
  hydration template.\n\nLike GHSA-8hv8-536x-4wqp, exploitation requires an application
  to pass attacker-controlled data to an Astro API. However, the value is subsequently
  inserted into the HTML response without context-appropriate escaping by Astro."
