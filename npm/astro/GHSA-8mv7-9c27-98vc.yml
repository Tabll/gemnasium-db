package_slug: "npm/astro"
title: "Astro: composable `astro/hono` pipeline bypasses `security.checkOrigin` when
  `middleware()` is absent or misordered"
description: "In the composable `astro/hono` pipeline, the `security.checkOrigin`
  protection is only installed by the `middleware()` primitive. The `actions()` and
  `pages()` primitives each dispatch to user code independently, so a pipeline that
  mounts either primitive before (or without) `middleware()` will bypass the origin
  check for those requests."
