title: "pnpm: `patch-remove` could delete project-selected files outside the patches
  directory"
description: "The `patch-remove` deletion-scope issue tracked as GHSA-72r4-9c5j-mj57
  / CAND-PNPM-030 has been addressed in pnpm.\n\nA crafted patch entry could resolve
  outside the configured patches directory and cause `pnpm patch-remove` to delete
  an arbitrary reachable file. This patch validates the configured directory and every
  resolved target before unlinking anything, then deletes the final directory entry
  without following it."
