package_slug: "npm/pnpm"
title: "pnpm: Path traversal in configDependencies env lockfile allows symlink creation
  outside node_modules/.pnpm-config"
description: "`pnpm` accepts package names from the env lockfile `configDependencies`
  section and uses those names directly when creating config dependency symlinks under
  `node_modules/.pnpm-config`.\n\nA malicious repository can commit a crafted `pnpm-lock.yaml`
  whose env-lockfile document contains a traversal-shaped config dependency name such
  as `../../PWNED_CFGDEP`. During `pnpm install`, pnpm installs the config dependency
  and creates a symlink at a path derived from that name.\n\nIn local testing against
  pnpm `v11.5.1`, this caused pnpm to create a symlink outside the intended config
  dependency directory:\n\n```text\nexpected root: /tmp/pnpm-cfgdep-poc-sznwgunx/victim/node_modules/.pnpm-config\nactual
  path:   /tmp/pnpm-cfgdep-poc-sznwgunx/victim/PWNED_CFGDEP\n```\n\nThis works with
  `--ignore-scripts`, so it does not rely on lifecycle script execution."
