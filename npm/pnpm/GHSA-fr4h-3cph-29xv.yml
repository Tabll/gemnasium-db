title: "pnpm: Hoisted install imports lockfile alias outside node_modules"
description: "The hoisted dependency alias issue tracked as GHSA-fr4h-3cph-29xv /
  CAND-PNPM-059 has been addressed in both pnpm and pacquet.\n\nA crafted lockfile
  alias could be joined directly under a hoisted `node_modules` directory. Traversal
  aliases could escape that directory, while reserved aliases such as `.bin` or `.pnpm`
  could overwrite pnpm-owned layout. This patch validates package-name semantics and
  path containment before graph insertion or filesystem work."
