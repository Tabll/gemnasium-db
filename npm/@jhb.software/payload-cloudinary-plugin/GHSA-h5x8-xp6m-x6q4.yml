package_slug: "npm/@jhb.software/payload-cloudinary-plugin"
title: "@jhb.software/payload-cloudinary-plugin: Arbitrary Cloudinary API Parameter
  Signing"
description: "`@jhb.software/payload-cloudinary-plugin` v0.3.4 exposes a server-side
  signing endpoint (`POST /api/cloudinary-generate-signature`) that passes attacker-supplied
  `paramsToSign` directly to `cloudinary.utils.api_sign_request()` without any allowlist,
  key filtering, or policy enforcement. Any authenticated Payload user can obtain
  a cryptographically valid Cloudinary HMAC-SHA1 signature for arbitrary upload parameters
  — including `overwrite=true`, `type=private`, `notification_url`, and path-traversal
  folder values — enabling unauthorized asset replacement, access-control bypass,
  and potential SSRF within the configured Cloudinary account."
