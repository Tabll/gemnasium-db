title: "Nest: Unbounded memory growth in the NestJS TCP microservice transport"
description: "A peer that can open a TCP connection to a NestJS microservice using
  the built-in TCP\ntransport can make the server process allocate memory without
  limit, on either side of the\nconnection, until the process is killed by the OS
  or by its container memory limit. No\nauthentication, no credentials, and no valid
  message are required.\n\nApplications are affected only if they start a microservice
  with `Transport.TCP` and the\ntransport's port is reachable by an untrusted peer."
