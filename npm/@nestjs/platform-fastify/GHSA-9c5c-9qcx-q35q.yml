package_slug: "npm/@nestjs/platform-fastify"
title: "@nestjs/platform-fastify: Path-scoped middleware bypass via absolute-form
  request targets"
description: "On the Fastify adapter, an HTTP request that uses an **absolute-form
  request target** (`GET http://host/path HTTP/1.1`\ninstead of `GET /path HTTP/1.1`)
  reaches the route handler without running the path-scoped Nest middleware bound
  to\nthat route. Applications that enforce authentication or authorization in middleware
  execute the protected handler\nwith those checks skipped."
