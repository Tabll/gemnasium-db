package_slug: "npm/fast-xml-parser"
title: "fast-xml-parser: Repeated DOCTYPE declarations reset entity expansion limits"
description: "`fast-xml-parser` processes multiple \"DOCTYPE\" declarations within
  a single XML document. Each declaration passes its entities to `@nodable/entities`
  through `addInputEntities()`.\n\n`addInputEntities()` resets the entity expansion
  counters every time it is called. An attacker can therefore insert additional DOCTYPE
  declarations to repeatedly reset maxTotalExpansions and maxExpandedLength during
  one parse operation.\n\nThis allows a crafted XML document to exceed the configured
  entity-expansion limits and can cause excessive CPU use, event-loop blocking, memory
  exhaustion, and process termination."
