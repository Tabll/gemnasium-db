package_slug: "npm/@vitest/browser"
title: "@vitest/browser: Browser Mode provider commands bypass the file-access permission
  gate"
description: "Browser Mode exposes a set of built-in \"commands\" that run on the
  Node.js side of the test runner and can touch the local filesystem (taking screenshots,
  managing Playwright traces, uploading files for `<input type=\"file\">`, comparing
  screenshots).\n\nSeveral of these commands accept a file path from the browser and
  act on it without checking the `allowWrite` permission gate and without confining
  the path to the project directory. A client that can reach the Browser Mode API
  can therefore read, create, overwrite, or delete files anywhere the Vitest process
  can access, even when `allowWrite` is `false`.\n\nThis matters most when the Browser
  Mode API is exposed to the network (for example `test.api.host` is set, or the dev
  server is reachable from another machine or origin). In that configuration `allowWrite`
  defaults to `false` precisely to block file access, and these commands bypass that
  protection. On a default localhost-only setup with trusted test code, there is no
  untrusted party in a position to exploit it. The gap still matters wherever you
  rely on `allowWrite: false` to contain untrusted test code, because these commands
  ignore that flag."
