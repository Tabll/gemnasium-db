package_slug: "npm/@hono/node-server"
title: "Node.js Adapter for Hono: Path traversal in `serve-static` on Windows via
  encoded backslash (`%5C`)"
description: "On Windows hosts, an encoded backslash (`%5C`) in the request path decodes
  to `\\`, which the Windows path resolver treats as a separator. `serve-static` then
  resolves a single URL segment such as `admin\\secret.txt` into a nested file under
  the root and serves it, letting an attacker read static files meant to be protected
  behind prefix-mounted middleware. Directory escape (`..`) remains blocked."
