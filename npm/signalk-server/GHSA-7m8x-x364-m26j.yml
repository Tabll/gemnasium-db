title: "Signal K Server: Buffered logs exposed to unauthenticated WebSocket clients"
description: "An unauthenticated WebSocket client can subscribe to the log path and
  receive buffered server logs.\n\nWebSocket connections are intentionally permitted
  before authentication because login occurs over the WebSocket connection. However,
  the log subscription path does not enforce an authorization check.\n\n`processSubscribe`
  handles subscriptions to the log path separately, without applying access control:\n\n```ts\nif
  (\nArray.isArray(msg.subscribe) &&\nmsg.subscribe.length > 0 &&\nmsg.subscribe[0].path
  === 'log'\n) {\nif (!spark.logUnsubscribe) {\nspark.logUnsubscribe = startServerLog(app,
  spark)\n}\n} else {\n// normal subscriptions go through subscriptionmanager, which
  applies\n// securityStrategy.filterReadDelta\n}\n```\n\n`startServerLog` then replays
  the whole buffer to that socket:\n\n```ts\napp.logging.getLog().forEach((log) =>
  {\nspark.write({ type: 'LOG', data: log })\n})\n```\n\nThe asymmetry is inside this
  one file. Writes are gated by `securityStrategy.shouldAllowWrite` (`ws.ts:961`),
  normal delta subscriptions are filtered by `securityStrategy.filterReadDelta` (`ws.ts:1159`,
  the else branch of this same function), and the log branch consults neither.\n\nAn
  unauthenticated socket, which is legitimately open for login, can subscribe to `log`
  and receive buffered server logs.\n\nFix: Requires an administrator principal, before
  `startServerLog`, in the same way the other branch defers to `securityStrategy`.
  The fix was released with version 2.31.0-beta.1.\n\nThe investigated code path was
  reviewed at commit 26ab199. No server was run and no WebSocket frames were captured.
  AI assistance was used during the investigation."
