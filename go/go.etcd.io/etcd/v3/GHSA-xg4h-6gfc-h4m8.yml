package_slug: "go/go.etcd.io/etcd/v3"
title: "etcd: Watch API authorization bypass via open-ended range requests"
description: "_What kind of vulnerability is it? Who is impacted?_\n\nA user granted
  READ permission on a single, exact key can use the Watch gRPC API with `clientv3.WithFromKey()`
  (an open-ended, \"from this key to the end of the keyspace\" watch) to receive watch
  events for every key lexicographically greater than or equal to their permitted
  key — not just the one key they were granted.\n\nThis is an authorization bypass
  in etcd's RBAC enforcement for the Watch API; Range/Get and DeleteRange requests
  are not affected. It only affects clusters with authentication enabled — clusters
  running without auth already allow unrestricted read access."
