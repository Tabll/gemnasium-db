title: "ORAS Go forwards registry credentials across registry redirects"
description: "ORAS Go can forward registry credentials configured for one registry
  origin to a different HTTP origin during registry redirects.\n\nThere are two related
  paths:\n\n1. A manifest or metadata request authenticates to the origin registry,
  then the origin returns a redirect to another host or port. The redirected request
  can carry the origin `Authorization` header to the redirect target.\n2. A blob upload
  `POST` authenticates to the origin registry, then the origin returns an upload `Location`
  on another host or port. The follow-up `PUT` can carry the origin `Authorization`
  header to the `Location` target.\n\nThe upload `Location` issue appears related
  to the existing public fix in pull request #1152 / GHSA-jxpm-75mh-9fp7. The manifest
  redirect path is a residual adjacent route: the v2 branch after the upload `Location`
  fix still forwards Basic credentials on an authenticated manifest redirect."
