title: "agent-router: MCP session resume does not verify the embedded anti-hijacking
  subject; default Helm seed makes session IDs forgeable"
description: "The MCP proxy's client-facing session ID embeds the authenticated caller's\nsubject
  (JWT `sub` claim) specifically as an anti-hijacking discriminator —\nmatching the
  Model Context Protocol specification's documented session-hijacking\nguidance (https://modelcontextprotocol.io/specification/2025-06-18/basic/security_best_practices#session-hijacking).\nHowever,
  the session-resume path never checks that discriminator against the\ncurrent caller's
  identity, so any client that obtains a session ID (its own or\nanother user's) can
  resume that session and act with it — including on\nroutes with per-user backend
  sessions. This is aggravated by the official\nHelm chart shipping a literal, publicly
  known default seed\n(`\"default-insecure-seed\"`) for the key that encrypts these
  session IDs."
