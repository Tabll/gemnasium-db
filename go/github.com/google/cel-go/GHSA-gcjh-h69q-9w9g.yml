package_slug: "go/github.com/google/cel-go"
title: "cel-go: JSON Private Fields Exposed via NativeTypes and ParseStructTag"
description: "The function `ext.NativeTypes(ParseStructTag(\"json\"))` does not honour
  the `encoding/json` skip directive `json:\"-\"`. Fields tagged `json:\"-\"` are
  registered in the CEL type system under the literal name `\"-\"` and are readable
  from any user-submitted CEL expression via `dyn(obj)[\"-\"]`.\n\nAdditionally, `newNativeTypes`
  silently registers every nested struct reachable from the type passed to `NativeTypes`,
  including types from third-party dependencies the developer never examined."
