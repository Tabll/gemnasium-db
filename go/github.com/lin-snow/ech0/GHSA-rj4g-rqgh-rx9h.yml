title: "Ech0 comment model's Email field returned on public /api/comments endpoints"
description: "The `Comment` model serializes its `Email` field through the public
  comment-listing API. `internal/model/comment/comment.go:33` uses `json:\"email\"`,
  while adjacent PII fields (`IPHash`, `UserAgent`) correctly use `json:\"-\"`. The
  public endpoints `GET /api/comments?echo_id=X` and `GET /api/comments/public?limit=N`
  both live on `PublicRouterGroup` with no authentication. Alice retrieves every guest
  commenter's email address on the instance with a few unauthenticated HTTP calls."
