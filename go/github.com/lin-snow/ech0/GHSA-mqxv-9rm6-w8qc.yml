package_slug: "go/github.com/lin-snow/ech0"
title: "Ech0: ParseAcceptLanguage `_` separator bypass enables ~70x CPU amplification
  via Accept-Language header in i18n.Middleware"
description: "Ech0's i18n middleware runs on every HTTP request and constructs a fresh
  `*goi18n.Localizer` from the raw `Accept-Language` header without imposing any size
  or shape filter. `goi18n.NewLocalizer` calls `golang.org/x/text/language.ParseAcceptLanguage`
  on the value internally. The underlying parser has quadratic-time behaviour on long
  lists of malformed language tags. The CVE-2022-32149 guard that golang.org/x/text
  added in v0.3.8 caps the number of `-` characters in the input at 1000, but it does
  not cap `_` characters even though the parser's internal scanner aliases `_` to
  `-` before parsing. A single unauthenticated GET request with an `Accept-Language`
  header built out of `_` separators burns about 1.5 seconds of server CPU on the
  host running Ech0; ten concurrent attackers saturate a ten-core box for the duration
  of the attack while consuming ~10 MiB/s of upstream bandwidth."
