title: "Ech0 has Server-Side Request Forgery (SSRF) via Connect Handler fetchPeerConnectInfo"
description: "The `fetchPeerConnectInfo` function in `internal/service/connect/connect.go:214-239`
  uses `httpUtil.SendRequest` (no SSRF protection) instead of `SendSafeRequest` (which
  has `ValidatePublicHTTPURL` with private IP blocking). This allows authenticated
  users to make the server request arbitrary URLs including internal/cloud metadata
  endpoints."
