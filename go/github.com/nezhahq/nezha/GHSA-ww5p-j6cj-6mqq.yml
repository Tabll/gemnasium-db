package_slug: "go/github.com/nezhahq/nezha"
title: "Nezha Dashboard: DDNS and Notification credential exposure via unredacted
  list API"
description: "The `GET /api/v1/ddns` and `GET /api/v1/notification` endpoints return
  full resource objects including plaintext third-party API credentials — Cloudflare
  API tokens, TencentCloud SecretKeys, Slack/Discord/Telegram webhook URLs with embedded
  bot tokens, and Authorization header values — without any field-level redaction.
  Any authenticated admin who calls these endpoints receives every stored credential
  in the system in a single API response. A compromised admin session or leaked PAT
  with `nezha:ddns:read` or `nezha:notification:read` scope exposes all third-party
  integration secrets."
