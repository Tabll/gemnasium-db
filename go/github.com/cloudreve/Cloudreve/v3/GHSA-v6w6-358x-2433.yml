title: "Cloudreve Admin.Read OAuth tokens can trigger server-side node test requests"
description: "Cloudreve exposes two admin node test endpoints under the `Admin.Read`
  OAuth scope. These endpoints accept attacker-controlled node definitions and cause
  Cloudreve to make outbound server-side network requests. This allows an OAuth client
  authorized only for `Admin.Read` to trigger operational network actions that should
  require `Admin.Write`."
