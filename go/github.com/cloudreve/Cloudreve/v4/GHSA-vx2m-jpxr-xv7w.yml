title: "Cloudreve has Broken Access Control - Revoked Share Access Still Allows Signed
  File URL Generation via Cached context_hint"
description: "Cloudreve's file-listing responses hand the client a `context_hint`
  (UUID) that is meant to speed up follow-up operations. When that hint is replayed
  on the `file/url` (and `file/thumb`) routes, DBFS caches a `shareNavigatorState`
  containing the already-loaded share root and share row.\n\nOn a later request carrying
  the same hint, `shareNavigator.RestoreState` repopulates `shareRoot`, and `shareNavigator.To`
  then **skips `Root`**. `Root` is the only place that re-checks `inventory.IsValidShare`
  (share expiry, remaining-download count, owner status, source-file validity) and
  the share password. As a result, a recipient who prewarms a context hint while access
  is valid can keep minting signed file URLs for already-known shared file paths for
  up to the context-hint TTL (`5 * 60` = 300 s) after the owner deletes the share
  or the share expires — plus the lifetime of any signed entity URL minted in that
  window.\n\nThis is a **revocation / expiry bypass**, not a way to discover unknown
  share contents: the attacker must already have had access to the share and must
  know the target file URI from a prior listing."
