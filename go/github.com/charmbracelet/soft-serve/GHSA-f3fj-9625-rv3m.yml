package_slug: "go/github.com/charmbracelet/soft-serve"
title: "charmbracelet/soft-serve: Race in `SetPrivate` leaves a private repository
  readable by unauthenticated users"
description: "Soft Serve cached repository records in memory with no expiry, and trusted
  the cached record for every access check. `SetPrivate` cleared the cached record
  before it saved the new visibility, and not afterwards.\n\nA request that arrived
  between the two read the old, public record from the database and cached it after
  the change was saved. From then on every access check used that stale record, so
  a repository the operator had just made private stayed readable by unauthenticated
  users over HTTP, SSH, and `git://` until the server restarted."
