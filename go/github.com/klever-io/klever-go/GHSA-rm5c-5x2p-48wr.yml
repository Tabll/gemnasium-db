title: "Klever-Go KVM: Unauthenticated remote node crash (nil-pointer DoS) in klever-go
  P2P transaction interceptor (txVersionChecker nil RawData) - potential chain halt"
description: "Every transaction gossiped on the klever-go P2P network is decoded and
  validated\nsynchronously inside the libp2p pubsub topic-validator callback. The
  validator\n`txVersionChecker.CheckTxVersion` dereferences `tx.RawData.Version` with
  no nil\ncheck. A protobuf `Transaction` whose embedded `RawData` sub-message is
  omitted\ndecodes to `RawData == nil`, so validating it triggers a nil-pointer panic.\n\nThe
  libp2p pubsub callback, the underlying go-libp2p-pubsub validation worker, and\nklever's
  own `network/p2p` layer install no `recover()`, so the panic propagates and\ncrashes
  the entire node process. The attacker payload is a 3-byte protobuf message;\nno
  validator key, stake, funds, or on-chain account is required. Aimed at enough of\nthe
  BLS validator set, repeated delivery halts block production (chain halt)."
