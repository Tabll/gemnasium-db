title: "Kong Ingress Controller for Kubernetes (KIC): Secret-backed plugin configurations
  leak through non-sensitive diagnostics endpoint"
description: "A vulnerability in the Kong Ingress Controller (KIC) allows for the
  unauthorized exposure of sensitive plugin credentials through the diagnostics interface.
  Even when configured to redact sensitive information (using `--dump-sensitive-config=false`),
  KIC fails to sanitize the `Plugins` field in diagnostic configuration dumps. This
  causes secrets referenced via `configFrom.secretKeyRef` to be resolved and displayed
  in plaintext.\n\nBecause the diagnostics HTTP endpoints require no authentication,
  any process within the cluster network capable of reaching the KIC pod can exfiltrate
  sensitive data, including API keys, bearer tokens, and database passwords."
