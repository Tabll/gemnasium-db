title: "Kong Ingress Controller for Kubernetes (KIC): Cross-namespace TLS Secret Exfiltration
  in Gateways with GatewayClass missing `konghq.com/gatewayclass-unmanaged: 'true'`
  annotation"
description: "A vulnerability in the Kong Ingress Controller (KIC) allows for the
  unauthorized exfiltration of TLS certificates and private keys across Kubernetes
  namespace boundaries. In \"managed\" mode (where the `GatewayClass` lacks an unmanaged
  annotation), the Gateway TLS translator skips critical status checks. This bypass
  allows the translator to fetch Secrets from any namespace KIC watches, even when
  a `ReferenceGrant` explicitly denies access or is missing.\n\nAn actor with RBAC
  permissions to create or modify Gateways in a low-privileged namespace can reference
  a Secret in a high-privileged namespace, causing KIC to \"leak\" that Secret's sensitive
  private key material into the Kong dataplane configuration."
