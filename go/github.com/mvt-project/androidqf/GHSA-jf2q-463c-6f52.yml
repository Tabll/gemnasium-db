package_slug: "go/github.com/mvt-project/androidqf"
title: "androidqf: Zip entry Name Injection in APK bundle (Zip Slip for zip consumers)"
description: "`generateZipPath()` constructs zip entry names for collected APKs using
  device controlled content from `extractFileName()`. Since `extractFileName()` does
  not reject traversal sequences, the resulting zip entry name can contain `../`.
  AndroidQF itself does not extract the zip it creates, but any forensic tool that
  extracts the acquisition bundle without zip-slip protection could write files to
  attacker chosen paths."
