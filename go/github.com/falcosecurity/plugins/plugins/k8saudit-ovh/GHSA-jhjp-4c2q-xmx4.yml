title: "k8saudit shipped rules do not detect privileged/sensitive settings on init
  or ephemeral containers"
description: "The `k8saudit` plugin's per-container fields (`ka.req.pod.containers.*`)
  and the shipped `k8s_audit_rules.yaml` evaluated only `requestObject.spec.containers`.
  Security-relevant settings on a pod's `initContainers` or `ephemeralContainers`
  were not inspected, so the shipped `Create Privileged Pod` rule did not fire for
  a privileged container placed in either list."
