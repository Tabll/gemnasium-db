package_slug: "go/github.com/corazawaf/coraza/v3"
title: "Coraza: Unbounded recursion in JSON response body processor causes CPU exhaustion"
description: "The JSON response body processor parses response bodies with no recursion\nlimit.
  `ProcessResponse` calls `readJSON(ss, ignoreJSONRecursionLimit)`, and\nthat constant
  is `-1`. The guard in `readItems` only fires on `== 0`, so\ncounting down from `-1`
  (-2, -3, ...) never reaches it. The guard is effectively\ndead on the response path.
  The request path is fine: `ProcessRequest` passes the\nconfigured limit (default
  1024). There is no equivalent directive or default for\nresponses.\n\nParsing a
  deeply nested JSON response is CPU-bound and its cost grows\nquadratically with
  nesting depth. A 512 KiB response (the default\n`ResponseBodyLimit`) holds about
  87,000 nesting levels and takes ~12 s to\nprocess, keeping one core busy the whole
  time."
