package_slug: "go/github.com/corazawaf/coraza/v3"
title: "Coraza: Multipart filename* (RFC 5987) charset restriction lets a decoy filename
  bypass FILES-based rules"
description: "Coraza extracts a multipart file upload's filename using Go's standard-library
  `mime.ParseMediaType`, which only decodes the RFC 5987/6266 extended `filename*`
  `Content-Disposition` parameter when its declared charset is exactly `us-ascii`
  or `utf-8`. Any other charset — including `iso-8859-1`, which RFC 5987 explicitly
  permits — is silently dropped by the stdlib, with no error and no fallback signal.
  This lets an attacker present one filename to Coraza and a different one to the
  backend application in the same request."
