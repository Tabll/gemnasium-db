title: "Coraza has Cookie Parser Confusion"
description: "Coraza's cookie parser (`internal/cookies.ParseCookies`) does not strip
  ASCII control characters (CTLs) from the edges of a cookie name/value before they're
  matched against `REQUEST_COOKIES` / `REQUEST_COOKIES_NAMES`. When a CTL sits directly
  next to the `=` separator, Coraza absorbs it into the adjacent name or value, while
  several backend cookie parsers trim it away — so the WAF and the application disagree
  about the cookie it just received."
