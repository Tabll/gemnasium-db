title: "Coraza: Resource exhaustion via deferred file handle accumulation in multipart
  body processor"
description: "`defer temp.Close()` sits inside a `for` loop in the multipart processor.
  Go defers run at function return, not loop end, so every file part in the request
  holds an open fd until `ProcessRequest()` exits. Send enough parts and you hit `EMFILE`.
  With CRS loaded, that flips `MULTIPART_STRICT_ERROR` to 1 and rule `200001` starts
  returning 400s, including on legitimate requests hitting the same condition."
