title: "SiYuan: /history/*path and /repo/diff/*path potentially exposing historical
  snapshots of data/.siyuan/publishAccess.json and data/templates/*"
description: "`GHSA-c8r8-95hg-mp34` added a centralized guard,\n`util.IsForbiddenAbsPath()`,
  specifically to block access to a small\nset of sensitive files: `conf/conf.json`
  (plaintext\n`accessAuthCode`/API token/cookie key), `data/snippets/conf.json`,\nthe
  entire `data/templates/` directory, and\n`data/.siyuan/publishAccess.json` (plaintext
  publish-mode passwords).\nIt was applied to `kernel/api/file.go` and `kernel/mcp/tools/file.go`.\nTwo
  other routes in the same server that serve arbitrary files by path,\n`/history/*path`
  and `/repo/diff/*path`, construct their target paths\nindependently and were not
  updated to call this new guard. Since the\nrepo/history snapshot system's tracked
  root is `data/` (confirmed by\n`getSyncIgnoreLines()`, whose ignore file lives at\n`data/.siyuan/syncignore`
  with entries relative to `data/`), both\n`data/.siyuan/publishAccess.json` and `data/templates/*`
  fall within\nthe scope that can legitimately be captured in historical snapshots,\nmeaning
  a prior version of either file can exist in\n`util.HistoryDir`/the repo-diff temp
  checkout even after the live file\nhas been protected by the new guard. This is
  CWE-862 (Missing\nAuthorization) applied to a very recently introduced protection\nmechanism."
