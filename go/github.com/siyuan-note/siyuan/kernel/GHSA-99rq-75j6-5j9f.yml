title: "SiYuan: Stored and reflected XSS in SiYuan through an SVG sanitizer bypass"
description: "SiYuan cleans user supplied SVG with `util.SanitizeSVG` before it serves
  the file inline as `image/svg+xml`. This cleaner is the guard behind the `Editor.AllowSVGScript`
  setting, which is off by default, so a `<script>` inside an SVG is meant to be removed.\n\nThe
  cleaner reads the input as HTML, but the browser reads the served file as XML (SVG).
  Because the two parsers treat some tags differently, a `<script>` can be hidden
  so the cleaner never removes it. The cleaned file still holds a working script.
  When a browser opens that file as an SVG document, the script runs in the app origin.
  There is no Content Security Policy in the product to stop it.\n\nThe same bug can
  be reached in two ways. Both share one root cause (the cleaner), so one fix in the
  cleaner closes both:\n\n* Reflected, through a single link: `GET /api/icon/getDynamicIcon`\n*
  Stored, through a planted `.svg` asset: `GET /assets/<name>.svg`\n\nI confirmed
  this on a live SiYuan 3.7.2 kernel."
