title: "SiYuan Agent Tools SSRF via DNS-Rebinding TOCTOU (Bypass of CheckHostSSRF)"
description: "SiYuan's AI Agent tools `http_request` (`util.HTTPRequest`) and `web_fetch`
  (`util.WebFetch`) are the only SSRF gate for outbound requests from the kernel.
  That gate is `CheckHostSSRF`, which performs a **single DNS resolution at guard
  time** and checks whether any returned IP is private/loopback/link-local. The actual
  connection, however, performs a **second, independent DNS resolution** through the
  default `net.Dialer` — and **no connect-time private-IP check is mounted** on this
  path.\n\nBecause the two resolutions are not pinned to the same result, an attacker-controlled
  domain can answer the guard-resolution with a **public IP** (passing `CheckHostSSRF`)
  and the connect-resolution with a **private/loopback/metadata IP** (e.g. `169.254.169.254`).
  This is a classic **DNS-rebinding TOCTOU** that bypasses the SSRF defense entirely.
  It reaches cloud instance metadata and internal services that the guard was specifically
  added to block."
