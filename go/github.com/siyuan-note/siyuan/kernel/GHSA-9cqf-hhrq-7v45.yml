title: "SiYuan: getAttributeViewSearchTarget returns database row content to anonymous
  readers with no publish-access check, reopening the class closed one day earlier
  at the adjacent route"
description: "`/api/av/getAttributeViewSearchTarget` is registered with `CheckAuth`
  only and performs no authorization of any kind. Given a database identifier and
  a keyword, it searches that database's rows and returns matching content, regardless
  of whether the caller may see the database, the rows, or the notebook holding them.\n\nCommit
  `64c26e74b` on 2026-07-26 closed a reader-reachable gap on `getAttributeViewFieldViews`
  by adding `CheckReadonly` at router line 536. `9b8e8956f`, the following day, registered
  this endpoint at line 535 without it. The new route returns more than the one that
  was just closed: row content rather than field-visibility metadata."
