title: "SiYuan: TLS Private Keys Readable via getFile (Incomplete Blocklist)"
description: "`IsForbiddenAbsPath()` only blocks `conf/conf.json` by exact match.
  The TLS private key (conf/key.pem) and CA private key (conf/ca.key) live in the
  same conf/ directory and are absent from the blocklist. Any authenticated user can
  retrieve them via POST `/api/file/getFile`."
