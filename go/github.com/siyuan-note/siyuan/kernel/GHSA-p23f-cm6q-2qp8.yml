title: "SiYuan MCP asset.upload Reads Arbitrary Absolute File Paths (Workspace Boundary
  Bypass)"
description: "SiYuan exposes a native MCP tool `asset` → `asset.upload`. Its `files`
  argument is documented as a **comma-separated list of absolute file paths**. The
  handler (`kernel/mcp/tools/asset.go:195`) only normalizes each entry with `filepath.Abs(...)`
  — it performs **no workspace boundary check** (`IsSubPath`) and **no sensitive-path
  check** (`IsSensitivePath`). The downstream `model.InsertLocalAssets` (`kernel/model/upload.go:97`)
  then `os.Open`s each path and copies its bytes into the workspace `assets/` directory.\n\nEvery
  other AI-plane file primitive in SiYuan is workspace-constrained:\n- `file` / `unzip`
  tools resolve paths via `resolvePath` (workspace-relative, escape-proof).\n\n`asset.upload`
  is the **only** AI tool that accepts arbitrary absolute paths with zero boundary
  validation. An attacker who can steer the Agent (prompt injection) can induce it
  to upload sensitive files — e.g. `/Users/victim/.ssh/id_rsa`, `~/.aws/credentials`,
  `/etc/passwd` — into the workspace, from where they are reachable via notes / export
  / sync."
