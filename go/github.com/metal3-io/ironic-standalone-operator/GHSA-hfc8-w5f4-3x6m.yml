title: "Ironic Standalone Operator's controller modifies user-owned resources without
  consent"
description: "The Ironic Standalone Operator (IRSO) is the operator to maintain an
  Ironic deployment for Metal3. IRSO controller automatically adds its environment
  label to user-provided Secrets and ConfigMaps without the resource owner's consent.
  A high-privilege controller modifying user-owned resources constitutes an unauthorized
  integrity violation. Deployments running IrSO v0.7.0 through v0.8.1 that reference
  user-provided Secrets or ConfigMaps (TLS certificates, BMC CA, trusted CA) are affected."
