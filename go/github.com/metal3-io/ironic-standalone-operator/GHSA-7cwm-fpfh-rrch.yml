title: "Ironic Standalone Operator's prometheus metrics exporter bound to all interfaces"
description: "The Ironic Standalone Operator (IRSO) is the operator to maintain an
  Ironic deployment for Metal3. The Prometheus metrics exporter binds to 0.0.0.0 (all
  network interfaces) by default with no authentication. The default config is disabled.
  If enabled, this exposes operational metrics to any host on adjacent networks. Deployments
  running IrSO v0.7.0 through v0.8.1 with the Prometheus exporter enabled are affected.
  Versions prior to v0.7.0 do not have the Prometheus exporter feature."
