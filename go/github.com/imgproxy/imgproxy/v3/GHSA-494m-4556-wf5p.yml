package_slug: "go/github.com/imgproxy/imgproxy/v3"
title: "imgproxy has out-of-bounds heap read/write in ICO loader BMP header reconstruction
  that allows unauthenticated remote worker crash"
description: "Out-of-bounds heap write in imgproxy's ICO loader (`vips/icoload.c`):
  when the ICO entry's image data buffer is small, the loader's BMP-header-reconstruction
  writes land past the allocation, corrupting the size field of the following heap
  chunk. The worker then aborts deterministically (glibc `munmap_chunk(): invalid
  pointer` → SIGABRT → Go panic, exit code 2)."
