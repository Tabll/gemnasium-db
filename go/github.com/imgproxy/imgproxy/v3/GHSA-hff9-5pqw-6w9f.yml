package_slug: "go/github.com/imgproxy/imgproxy/v3"
title: "imgproxy has integer overflow in imgproxy ICO loader that causes denial of
  service and may permit remote code execution"
description: "The ICO loader allocates `data_size + BMP_FILE_HEADER_LEN` bytes after
  reading a 32-bit attacker-controlled `data_size`. For `data_size > UINT32_MAX -
  BMP_FILE_HEADER_LEN`, the addition wraps before allocation. imgproxy then writes
  the ICO prefix and reads up to the original declared size starting 14 bytes into
  the undersized allocation. A network client can turn this heap overflow into remote
  denial of service or remote code execution."
