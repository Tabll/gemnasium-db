package_slug: "go/github.com/imgproxy/imgproxy/v3"
title: "imgproxy has unbounded memory allocation in ICO loader that allows unauthenticated
  memory-exhaustion DoS via crafted data_size field"
description: "Unbounded and unvalidated memory allocation in imgproxy's ICO loader
  (`vips/icoload.c`). An attacker-controlled `data_size` field (u32) from the ICO
  directory entry is passed directly to `VIPS_MALLOC` without any bounds check, so
  a single crafted 23-byte ICO file makes an imgproxy worker attempt a ~4GB allocation.
  Present in the latest release (v4.0.15) and the 3.3.x series; confirmed on a live
  production deployment of imgproxy v4.0.15."
