title: "Blnk has an API key authorization bypass in owner and scope enforcement"
description: "Blnk API key endpoints had an authorization issue that allowed non-master
  API keys to perform key-management actions outside their intended authorization
  boundary.\n\nIn affected versions, API key operations trusted caller-controlled
  request values for owner and scope decisions. As a result, a non-master API key
  could potentially manage keys for another owner by supplying a different owner value,
  or create a more privileged API key by requesting broader scopes than it already
  had.\n\nThis has been fixed by deriving the effective owner from the authenticated
  API key and enforcing scope coverage checks when creating new keys."
