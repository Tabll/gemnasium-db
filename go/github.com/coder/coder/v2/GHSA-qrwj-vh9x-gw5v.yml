title: "Coder's workspace agent API insecure redirect handling allowed cross-agent
  file read and write"
description: "`agentConn.apiClient()` used the default redirect behavior of `http.Client`
  while its custom transport dialed the host from the request URL as long as the port
  was the workspace agent HTTP API port (`4`). Agent tailnet IPs are deterministic
  from agent UUIDs, so a malicious workspace agent could return a redirect to another
  agent's tailnet IP and cause the control-plane client to send the follow-up workspace
  agent API request to the victim agent instead of the intended agent.\n\nRedirects
  that preserve the method and body, such as HTTP 307 and 308, allow replay of write
  and process-start requests. HTTP 301, 302 and 303 redirects only convert POST requests
  to GET requests, so they are sufficient to demonstrate redirected reads but not
  write or command-execution primitives."
