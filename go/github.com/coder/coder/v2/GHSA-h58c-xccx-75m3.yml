title: "Coder: Stored HTML injection via unescaped ApplicationName and LogoURL appearance
  settings"
description: "The `ApplicationName` and `LogoURL` appearance settings were rendered
  into HTML output without sufficient escaping which let a highly privileged Owner-role
  user inject HTML into the Coder dashboard and SMTP notification emails.\n\n> **Note:**
  Exploitation requires the `Owner` role which already holds full administrative control
  of the deployment so practical impact is limited."
