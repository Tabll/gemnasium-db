package_slug: "go/github.com/rclone/rclone"
title: "rclone: WebDAV Credentials Survive a Same-Host HTTPS-to-HTTP Redirect"
description: "WebDAV's default redirect handling can replay Basic authorization and
  configured Cookie headers over plaintext HTTP after a same-host HTTPS-to-HTTP redirect.
  This was reproduced through the real backend. Unlike the low-impact STS token in
  rclone's published S3 redirect advisory, Basic passwords and session cookies are
  complete reusable credentials, supporting a High rating when they grant normal WebDAV
  read/write access.\n\nThe credible threat requires a legitimate endpoint, gateway,
  or accelerator to emit an unsafe redirect and an adjacent/on-path actor to observe
  the plaintext hop. A report should not rely on a malicious original WebDAV endpoint
  because that endpoint already receives the credentials."
