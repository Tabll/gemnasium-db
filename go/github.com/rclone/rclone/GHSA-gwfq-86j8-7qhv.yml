title: "rclone: Verbose Stack Trace Disclosure in RC API Error Responses"
description: "When an RC API call triggers a panic (recovered by the job runner),
  the full Go stack trace is included in the JSON error response. This leaks internal
  file paths, Go module versions, goroutine state, and memory addresses to the API
  caller."
