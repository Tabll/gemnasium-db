package_slug: "go/github.com/xyproto/algernon"
title: "Algernon: Auto-refresh SSE event server binds to all interfaces with Access-Control-Allow-Origin:
  * and no authentication"
description: "When auto-refresh is enabled, Algernon spins up an SSE handler that
  streams a `data:` line for every filesystem event under the watched directory. The
  handler performs **no authentication** of any kind — no shared token, no cookie
  check against the `permissions2` userstate, no IP allow-list, no path-prefix permission.
  Any client that can complete a TCP connection to the listener address receives the
  stream.\n\nThis advisory covers the authentication gap in isolation. The cross-origin
  browser-reach (advisory #2b) and the network-reach (advisory #2c) amplify the impact,
  but each is independently fixable; this finding addresses the case where a same-origin
  or LAN-local client connects directly to the SSE port and reads the stream without
  proving anything about its identity."
