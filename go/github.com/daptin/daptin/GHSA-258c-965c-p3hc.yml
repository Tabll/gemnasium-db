package_slug: "go/github.com/daptin/daptin"
title: "Daptin's Session Management Vulnerability Leads to Insufficient Session Expiration
  After Password Change"
description: "A session invalidation vulnerability exists in daptin's authentication
  system where JSON Web Tokens (JWTs) remain fully valid after a user changes their
  password. The JWT validation middleware (`CheckJWT`) only verifies token signature,
  expiry, issuer, and signing algorithm — it does not check whether the token was
  issued before the most recent password change. The password update code path hashes
  the new password but never calls `InvalidateAuthCacheForEmail()` and never revokes
  or `blacklist`s existing tokens. This effectively negating password rotation as
  an incident response control."
