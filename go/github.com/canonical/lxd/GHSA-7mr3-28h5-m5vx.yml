title: "LXD has project restriction bypass for custom volume copy across projects "
description: "Missing authorization checks exist for custom volume copying where an
  attacker knowing the name of a project that they don't have access to and the name
  of a custom volume in that project can copy the custom volume to a new project.
  This issue could allow an attacker to access secrets in custom volumes they are
  not authorized to access."
