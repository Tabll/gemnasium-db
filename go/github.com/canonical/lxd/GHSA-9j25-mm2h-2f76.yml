package_slug: "go/github.com/canonical/lxd"
title: "LXD has arbitrary file write on host via `exec-output` symlink in crafted
  image"
description: "The `record-output` parameter of the `/instances/$name/exec` endpoint\nstores
  the output of the command in the `exec-output` directory of the\ninstance. If `exec-output`
  is a symlink, file named `exec_UUID.stdout`\nand `exec_UUID.stderr` can be written
  to an arbitrary location where\nthe `.stdout` file will contain arbitrary content.
  This behavior can be\nabused for arbitrary command execution."
