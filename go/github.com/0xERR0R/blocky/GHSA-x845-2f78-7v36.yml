title: "Blocky DNSSEC validation bypass and validation-cache scope pollution"
description: "Blocky accepts and caches forged DNS answers while `dnssec.validate:
  true` is enabled. The issue has two related exploit paths:\n\n1. **Basic DNSSEC
  validation bypass.** If an untrusted upstream returns an unsigned positive answer
  for a DNSSEC-signed public domain, Blocky classifies the response as `Insecure`
  solely because the response contains no RRSIG records. It does not first check the
  DS/DNSKEY chain to determine whether the queried name is below a signed delegation.
  The forged unsigned answer is returned and cached.\n\n2. **Validation-cache scope
  pollution through forged insecure proofs.** If a response contains some RRSIG material
  and enters RRset validation, an attacker-controlled response path can still cause
  Blocky to cache `ValidationResultInsecure` for the bare domain name by returning
  a DS response with no DS records and an unsigned NSEC/NSEC3 record in the authority
  section. Blocky treats the mere presence of NSEC/NSEC3 as authenticated DS absence
  and stores the resulting `Insecure` state without validating the parent-zone proof.
  That cached state is keyed only by domain name and can be reused for later responses
  and cache hits.\n\nBoth paths were reproduced through Blocky's real DNS listener
  using external UDP DNS client queries. In both reproductions, the malicious upstream
  was shut down before the second query; Blocky still returned the poisoned answer
  from its own cache."
