package_slug: "go/github.com/jandedobbeleer/oh-my-posh"
title: "Oh My Posh: Arbitrary command execution via template injection in the path
  segment"
description: "Oh My Posh re-renders the resolved path string, which contains the raw
  folder names taken from the filesystem, through the Go `text/template` engine. That
  engine's function map exposes a `cmd` function that runs arbitrary OS commands.
  A directory whose name contains a Go template expression is therefore evaluated
  when the prompt renders, giving arbitrary command execution as the current user
  as soon as the shell is inside (or below) that directory. The built-in default configuration
  is affected."
