package_slug: "go/github.com/OpenListTeam/OpenList/v4"
title: "OpenList: Authenticated users can rename files outside their base path via
  batch rename `src_name` traversal"
description: "The `/api/fs/batch_rename` handler validates and authorizes only the
  requested source directory. It rejects path separators in `new_name`, but it does
  not validate `src_name`. The handler concatenates `src_dir` and attacker-controlled
  `src_name`, then passes the result to the filesystem rename layer, where the path
  is normalized.\n\nAn authenticated user with rename permission can set `src_name`
  to traversal segments such as `../../ab/secret.txt`. When the user's base path is
  `/team/a` and `src_dir` is `/writable`, the authorized directory becomes `/team/a/writable`,
  but the final source path normalizes to `/team/ab/secret.txt`. The file outside
  the user's base path is then renamed."
