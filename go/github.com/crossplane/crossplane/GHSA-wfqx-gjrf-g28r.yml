package_slug: "go/github.com/crossplane/crossplane"
title: "Crossplane: Signature verification TOCTOU allows installing unverified package
  content via mutable tag"
description: "Crossplane allows package signature verification to be configured via
  the `ImageConfig` mechanism. When enabled, the package manager uses cosign to verify
  that packages are correctly signed before pulling and installing them.\n\nWhen a
  package is installed using a tag reference (e.g., a semantic version), a malicious
  OCI registry could serve a correctly signed image for verification, then subsequently
  serve an unsigned image for installation. This is possible because Crossplane resolves
  the tag reference separately for each step.\n\nThis vulnerability is relevant only
  for users who do all three of the following:\n\n1. Configure signature verification
  for packages,\n2. Install packages using tag references rather than digests, and\n3.
  Install packages from registries they do not control."
