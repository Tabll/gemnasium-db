package_slug: "go/github.com/edgelesssys/contrast"
title: "Contrast's Imagepuller registryFor uses unanchored suffix matching, leaking
  auth credentials and trusted CA configuration to sibling-domain registries"
description: "`Config.registryFor` selected a per-registry credential / CA / mirror
  block by checking `strings.HasSuffix(name, fqdn)` after stripping a single trailing
  dot.\nThe match has no boundary between the configured FQDN and any preceding characters
  in the request hostname.\nA registry configured as `[registries.\"ghcr.io.\"]` is
  therefore also applied to any image pulled from a host whose name happens to end
  in the literal byte sequence `ghcr.io`,\nincluding attacker-registered domains such
  as `evilghcr.io.`\nThe imagepuller would then send the configured `Authorization`
  header (basic auth, registry token, or identity token), trust the configured custom
  CA bundle,\nfollow the configured mirror, or honour `insecure-skip-verify`, on requests
  to that hostname."
