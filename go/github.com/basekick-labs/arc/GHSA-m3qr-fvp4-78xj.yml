title: "Arc has unauthenticated application log disclosure via `/api/v1/logs`"
description: "Arc exposes `GET /api/v1/logs` without authentication even when authentication
  is enabled by default. The route is registered before the global Fiber authentication
  middleware, and the handler returns recent buffered application logs without performing
  its own authorization check."
