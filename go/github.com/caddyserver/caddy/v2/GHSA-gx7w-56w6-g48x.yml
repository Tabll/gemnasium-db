title: "Caddy: Remote Admin Authorization Bypass on PKI Endpoints via Prefix-Based
  Path Matching"
description: "Caddy's remote admin access control performs path authorization using
  prefix matching:\n\n- [`admin.go`](/caddy/admin.go#L719): `strings.HasPrefix(r.URL.Path,
  allowedPath)`\n\nThis allows a client certificate authorized only for `/pki/ca/prod`
  to access sibling PKI resources whose paths merely share the same prefix, such as
  `/pki/ca/prod-backup`.\n\nThis is an authorization bug in Caddy's source code, not
  a misconfiguration issue. The configured policy is more restrictive than the behavior
  that Caddy actually enforces."
