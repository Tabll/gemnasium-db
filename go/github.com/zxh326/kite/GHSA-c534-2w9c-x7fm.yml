title: "Kite Kubernetes proxy path traversal allows authenticated users to bypass
  RBAC and read cluster-wide resources"
description: "Kite versions 0.6.9 through 0.14.0 authorize Kubernetes proxy requests
  against the pod or service identified by the original route parameters. Encoded
  path traversal segments can cause the upstream URL to resolve to a different Kubernetes
  API endpoint after authorization."
