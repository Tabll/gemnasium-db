title: "Hysteria has an authenticated UDP ACL bypass that enables localhost and private-network
  UDP SSRF"
description: "Hysteria's UDP relay treats the destination address as packet-scoped,
  but ACL and outbound policy are applied only once when a new UDP session is created.
  After an authenticated client opens a UDP session using an allowed first destination,
  later packets in the same `Session ID` can be sent to different destinations without
  re-running ACL evaluation.\n\nThis allows an authenticated user to bypass server-side
  UDP ACL rules and reach localhost or RFC1918/private-network UDP services from the
  server's network perspective, even when those destinations are explicitly rejected
  by ACL.\n\nVerified on current HEAD at commit `64c396385631579598cc29d5561bff98c439772f`."
