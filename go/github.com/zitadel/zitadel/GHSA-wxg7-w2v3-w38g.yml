title: " ZITADEL: Missing Token Lifecyle Validation (`exp` and `iat`) in JWT IdP Provider"
description: "A token lifecycle validation vulnerability was discovered in ZITADEL's
  external JWT Identity Provider (IdP) implementation.\nZITADEL enforces a 1-hour
  maximum token age freshness window (`maxAge`) calculated from the token's issue
  time. However, this safety check is guarded by a presence condition. If an incoming
  token omits the `iat` claim, the freshness check is entirely bypassed, allowing
  arbitrarily old tokens to pass authentication successfully.\n\nPer the OIDC Core
  1.0 specification, identity token validation pipelines must strictly handle and
  enforce session expiration. ZITADEL's silent acceptance of tokens missing these
  temporal constraints compromises session integrity."
