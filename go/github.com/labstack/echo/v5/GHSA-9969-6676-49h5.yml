title: "Echo: WebSocket proxy can retain connections and handlers after client disconnect"
description: "Echo's Proxy middleware could retain a handler, copy goroutines and
  network connections after a WebSocket client disconnected if the upstream kept its
  connection open. The raw proxy waited for both copy directions to finish without
  reliably closing the other connection when one direction ended. Rejected upgrade
  responses with HTTP keep-alive were one way to trigger this behavior.\n\nRepeated
  connections can accumulate resources and cause denial of service. The impact depends
  on the proxy route's accessibility, upstream behavior and configured connection
  deadlines. This is a medium-severity resource-retention issue; no confidentiality
  or integrity impact is claimed."
