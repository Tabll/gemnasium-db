package_slug: "go/github.com/labstack/echo/v4"
title: "Echo: Decompress permits unbounded gzip expansion in v4"
description: "Echo v4's opt-in Decompress middleware exposed a gzip-decoded request
  stream without limiting its expanded size. A small compressed request could therefore
  produce a very large decoded body. Handlers that read or bind that body could consume
  excessive memory or CPU, and repeated or concurrent requests could cause denial
  of service.\n\nThe middleware is not enabled by default. A limit on the compressed
  request size alone does not bound the decompressed size. Applications that already
  apply an effective body limit after decompression have reduced exposure."
