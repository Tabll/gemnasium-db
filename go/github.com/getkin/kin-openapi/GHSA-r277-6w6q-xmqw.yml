package_slug: "go/github.com/getkin/kin-openapi"
title: "kin-openapi: ValidationHandler.Load() Fail-Open Authentication Bypass via
  NoopAuthenticationFunc Default"
description: "`ValidationHandler.Load()` in `getkin/kin-openapi` silently replaces
  a nil `AuthenticationFunc` with `NoopAuthenticationFunc`, which always returns `nil`
  without performing any credential check. Because this substitution happens unconditionally
  when the caller omits the field, every OpenAPI `security` requirement declared in
  the spec is silently satisfied for unauthenticated requests. An unauthenticated
  remote attacker can reach handlers for routes whose OpenAPI operation requires an
  API key, OAuth token, or any other security scheme if the application relies on
  `ValidationHandler` as its enforcement middleware."
