title: "go-git: Malformed Git object data may cause panics or resource exhaustion"
description: "Several denial-of-service issues were identified in `go-git` when parsing
  maliciously crafted Git repository data.\n\nAn attacker may craft a malicious `.pack`,
  `.idx` or loose objects that causes an application using an affected version of
  `go-git` to panic or consume excessive resources.\n\nThis can lead to denial of
  service in applications that use `go-git` to clone, fetch, open, or otherwise process
  untrusted repositories or Git object data.\n\nExploitation requires the ability
  to alter read-only files such as `.pack` or `.idx` from the local repository's `.git/objects/pack/`
  directory. Alternatively, the user would need to be interacting with a malicious
  remote server, which is not recommended and exposes users to a broader class of
  security risks beyond this issue."
