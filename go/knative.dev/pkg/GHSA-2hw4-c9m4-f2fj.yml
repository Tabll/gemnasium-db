title: "knative.dev/pkg admission webhooks allow unbounded request-body memory exhaustion"
description: "`knative.dev/pkg`'s admission webhook handler reads the incoming HTTP
  request body via `json.NewDecoder(io.TeeReader(r.Body, &bodyBuffer))` with **no
  `http.MaxBytesReader` wrapping the body**. Because every consumer of `knative.dev/pkg/webhook`
  inherits this handler (Knative serving / eventing, Tekton Pipelines, KEDA, Sigstore
  policy-controller, and others), a single oversized POST to **any of those projects'
  admission webhook ports** drives the controller pod into memory exhaustion and OOM-kill.
  Worse, the `io.TeeReader` design keeps a verbatim copy of the body in `bodyBuffer`
  while the decoder also materializes the parsed struct — so the peak memory usage
  is roughly **twice the body size**.\n\nThis is the same shape as **CVE-2026-24514**
  (ingress-nginx) and `GHSA-9539-c3xr-w9vm` (Kyverno admission body OOM) filed today
  against the same antipattern."
