title: "Vikunja: Explicit lower-permission share on a sub-project is silently overridden
  by an inherited parent permission (broken access control / privilege-management
  regression in v2.6.0)"
description: "In Vikunja v2.6.0 the project-permission engine resolves a user's effective
  permission on a project as\nthe **MAX over the entire reachable project subtree**.
  As a result, when a user has been granted a\n**higher** permission on a parent project
  and the owner *explicitly* shares a **child** project with\nthat same user at a
  **lower** permission (an intended down-restriction), the explicit lower grant is\n**silently
  ignored** and the user receives the higher, inherited permission on the child. A
  user\nwho was deliberately restricted to **read-only** on a sensitive sub-project
  can therefore modify it,\ndelete it, and re-share it (including granting other users
  admin) - none of which the owner intended.\nThis is a behavior regression from v2.5.0,
  whose engine used \"nearest-ancestor-grant-wins\" semantics\nthat honored the explicit
  child grant."
