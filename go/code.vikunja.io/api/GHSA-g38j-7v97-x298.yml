package_slug: "go/code.vikunja.io/api"
title: "Vikunja: CalDAV relation creation bypasses TaskRelation.CanCreate, allowing
  an unauthorized write into any task by known UID"
description: "Creating a task relation over CalDAV does not run the `TaskRelation.CanCreate`
  permission check that the REST API enforces. An attacker can attach a relation to
  any task whose UID they know, including tasks in projects they have no access to.
  The identical operation over REST is correctly refused with 403."
