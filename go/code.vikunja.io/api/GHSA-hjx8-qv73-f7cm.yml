package_slug: "go/code.vikunja.io/api"
title: "Vikunja: Webhooks and link shares survive every revocation path, so a removed
  collaborator keeps a live feed"
description: "A collaborator removed from a project keeps a **live, automatic feed**
  of that project's contents, because nothing on any revocation path deletes the webhook
  they created while they had access.\n\nVikunja already has a revocation-cleanup
  routine that deletes other derived rows for exactly this reason. Its set is `{task_assignees,
  subscriptions}`. **`webhooks` and `link_shares` — the only two rows that carry a
  live channel into the project — are not in it**, and the routine is wired to one
  of four revocation paths."
