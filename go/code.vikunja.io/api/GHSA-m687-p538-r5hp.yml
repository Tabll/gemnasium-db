package_slug: "go/code.vikunja.io/api"
title: "Vikunja: Permissive Cross-domain Security Policy trusts every localhost origin
  which should not be trusted"
description: "Vikunja ships with `cors.origins` defaulting to `http://127.0.0.1:*`
  and `http://localhost:*`, and sends `Access-Control-Allow-Credentials: true`, so
  a page served from any port on the user's own machine may make credentialed cross-origin
  requests to the API and read the responses. The mandatory `service.publicurl` is
  appended to that default list rather than replacing it, so a fully configured production
  deployment still trusts every localhost origin. Combined with the token refresh
  endpoint, which authenticates with the `vikunja_refresh_token` cookie and returns
  a bearer JWT in the response body, one `fetch()` from such a page yields a working
  access token for whoever is logged in, and from there the whole account."
