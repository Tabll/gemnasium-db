title: "PHP JWT Framework: JWSVerifier uses algorithm from unprotected header, enabling
  algorithm confusion attacks"
description: "`JWSVerifier::getAlgorithm()` in `src/Library/Signature/JWSVerifier.php`
  (line 144) merges protected and unprotected headers using PHP's spread operator:\n\n```php\n$completeHeader
  = [...$signature->getProtectedHeader(), ...$signature->getHeader()];\n```\n\nIn
  PHP, when spreading arrays with duplicate string keys, the **last array's values
  take precedence**. Since the unprotected header (`getHeader()`) is spread second,
  an attacker can override the integrity-protected `alg` parameter by placing a different
  value in the unprotected header.\n\nThis creates a Time-of-Check/Time-of-Use (TOCTOU)
  vulnerability:\n1. `HeaderCheckerManager` validates `alg` from the **protected**
  header\n2. `JWSVerifier` uses `alg` from the **unprotected** header for actual verification\n\nThe
  same issue exists in `JWEDecrypter.php` (lines 120-124) where `array_merge()` exhibits
  the same last-wins behavior for `alg` and `enc`."
