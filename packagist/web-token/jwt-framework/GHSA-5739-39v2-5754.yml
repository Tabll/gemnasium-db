package_slug: "packagist/web-token/jwt-framework"
title: "PHP JWT Library: RSA1_5 (RSAES-PKCS1-v1_5) decryption lacks implicit rejection,
  exposing a Bleichenbacher/Marvin padding oracle"
description: "`RSACrypt::decryptWithRSA15()` (used by the `RSA1_5` key-encryption
  algorithm) implements RSAES-PKCS1-v1_5 decryption by inspecting the padding after
  RSADP and throwing `InvalidArgumentException` as soon as the padding is malformed.
  It does **not** implement the implicit-rejection countermeasure required by RFC
  3447 §7.2.2 / RFC 8017 §7.1.2 (return a deterministic pseudo-random value of the
  expected length on padding failure and let the downstream step fail uniformly).\n\nFrom
  a JWE caller this yields a Bleichenbacher/Marvin padding oracle: an attacker submitting
  adaptively crafted `encrypted_key` values can distinguish (a) padding rejected,
  (b) padding valid but wrong CEK length, and (c) padding valid and full AEAD executed
  — even though `JWEDecrypter` returns the same `false` in all cases — because each
  path performs a measurably different amount of work, amplifiable by enlarging the
  ciphertext (CWE-208 timing side channel). Enough adaptive queries can recover the
  wrapped CEK."
