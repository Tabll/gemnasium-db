title: "PHP JWT Library: PBES2-HS*+A*KW unwrap accepts an unbounded p2c iteration
  count, enabling CPU-amplification denial of service"
description: "When a JWE uses a password-based key-encryption algorithm (`PBES2-HS256+A128KW`,
  `PBES2-HS384+A192KW`, `PBES2-HS512+A256KW`), `PBES2AESKW::unwrapKey()` reads the
  `p2c` (PBKDF2 iteration count) parameter directly from the attacker-controlled JOSE
  header and passes it to `hash_pbkdf2()` with **no upper bound**. The only validation
  performed (`checkHeaderAdditionalParameters()`) was `is_int($p2c) && $p2c > 0`.\n\nAn
  unauthenticated attacker can craft a single JWE whose protected header sets a very
  large `p2c` (e.g. `100_000_000` ≈ 87 s of CPU, or `PHP_INT_MAX`), forcing a worker
  to spend an arbitrary amount of CPU inside PBKDF2 **before** the key unwrap can
  even fail. The decrypter swallows the eventual exception, so the attacker pays almost
  nothing while the server burns CPU. JSON General serialization (multiple recipients)
  and multi-key JWKSets multiply the cost. This is a classic uncontrolled-resource-consumption
  (CWE-400) denial of service."
