title: "PHP JWT Framework: Chacha20Poly1305 key-encryption algorithm discards the
  Poly1305 authentication tag, performing no authentication on decryption"
description: "The experimental `Chacha20Poly1305` key-encryption algorithm generates
  the 16-byte Poly1305 authentication tag during `encryptKey()` but **discards it**:
  the tag is never written to the header and therefore never reaches the wire. On
  the receiving side, `decryptKey()` calls `openssl_decrypt('chacha20-poly1305', ...)`
  **without the tag argument**, which makes OpenSSL skip authentication entirely.\n\nAs
  a result the AEAD construction is silently degraded to unauthenticated ChaCha20:
  a tampered encrypted CEK is accepted, and because ChaCha20 is a stream cipher, a
  single-byte change in the ciphertext propagates as a single-byte change in the recovered
  CEK with no integrity check (CWE-353 / CWE-347). An attacker on the token path can
  manipulate the wrapped key without detection."
