title: "Craft CMS: Authenticated leak of secret environment variables"
description: "Environment variables and secrets are interpolated into a Twig template
  even when the Twig sandbox is enabled, allowing them to be leaked by an authenticated
  attacker.\n\nThe Craft vulnerability [CVE-2026-31857](https://github.com/craftcms/cms/security/advisories/GHSA-fp5j-j7j4-mcxc)
  was only patched by applying sandboxed Twig templating. This theoretically protects
  Craft CMS against RCE attacks, provided the sandbox is enabled and secure, with
  no known bypasses.\n\nHowever, the same request parameter `elementId,` which allows
  for sandboxed Twig templates to be rendered, also includes functionality that interpolates
  referenced environment variables. If the parameter includes a string of the form
  `${ENV_VAR}` then the string is replaced with the environment variable or secret
  from a secrets file with that name.\n\nAfterward, the string is rendered as a Twig
  template. If the sandbox is disabled, Twig templates can already gain RCE or access
  environment variables using the getenv function. Sandboxed Twig templates should
  not have this access, but now do thanks to this additional environment-variable
  replacement behavior.\n\nThe template’s resulting value is not directly reflected
  in the response. To exfiltrate the value, the sandboxed Twig template cannot use
  network functions. But it can use a blind error-based approach similar to blind
  SQL injection. With enough requests, any environment variable or secret can be incrementally
  leaked. This can be abused to forge a session, escalate privileges with the `CRAFT_SECURITY_KEY`,
  and steal credentials for the database, SMTP server, or other connected APIs or
  blob storage."
