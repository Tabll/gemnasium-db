package_slug: "packagist/craftcms/cms"
title: "Craft CMS: Passkey login accepts replayed WebAuthn assertions"
description: "Craft CMS passkey login accepts WebAuthn requestOptions from the unauthenticated
  login request body and does not persist the updated credential counter returned
  by the WebAuthn assertion validator. A captured passkey login request body can therefore
  be replayed because the old challenge is accepted again, and the stored credential
  counter remains stale.\n\nCraft CMS 5.10.3 and current `5.x` HEAD accept `PublicKeyCredentialRequestOptions`
  from the unauthenticated `users/login-with-passkey` request body and do not persist
  the updated `PublicKeyCredentialSource` returned/mutated by `web-auth/webauthn-lib`
  after assertion validation.\n\nAs a result, a captured passkey login request body
  is not one-time-use. Reposting the same `requestOptions` and `response` can result
  in validation against the same stale credential counter and create another Craft
  session for that user. This weakens passkeys from a fresh, server-challenged authentication
  ceremony into a replayable bearer artifact if one successful assertion body is exposed."
