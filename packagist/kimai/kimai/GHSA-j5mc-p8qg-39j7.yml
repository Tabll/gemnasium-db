title: "Kimai Favorite Timesheet Add and Remove Endpoints Allows Cross-User Bookmark
  Manipulation"
description: "Kimai 2.56.0 contains an authenticated improper authorization / IDOR
  vulnerability in the favorite timesheet add and remove endpoints. A low-privileged
  user who knows another user's `timesheet.id` can add that record to, or remove it
  from, the victim's `favorite/recent` bookmark list. This allows cross-user manipulation
  of per-user favorite state without administrative privileges."
