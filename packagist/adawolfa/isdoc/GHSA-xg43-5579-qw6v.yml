title: "adawolfa/isdoc: Uncontrolled resource consumption (decompression bomb) when
  reading untrusted ISDOCX or PDF files"
description: "`adawolfa/isdoc` reads ISDOC invoices from ISDOCX (ZIP) archives and
  from PDF files with embedded ISDOC documents and supplements. Affected versions
  inflate ZIP entries and read embedded files **without validating their uncompressed
  size**, so a small crafted file can amplify into gigabytes:\n\n- **ISDOCX decompression
  bomb** — `getFromName()` inflates the ISDOC document and binary supplements with
  no size cap.\n- **`saveTo()` disk-fill** — the supplement copy loop writes inflated
  bytes to disk with no running byte budget, so a bomb can exhaust disk even if the
  central-directory size is under-reported.\n- **PDF embedded files** — an embedded
  file whose declared `Length` is enormous is read and digested with no upper bound.\n\nExploitation
  requires the application to parse an attacker-supplied `.isdocx` or `.pdf` (the
  typical use is generating files or parsing files from trusted vendors, so a user
  must be induced to process a malicious file). When that happens the process can
  be driven to exhaust memory or disk, causing denial of service. There is **no confidentiality
  or integrity impact** — availability only."
