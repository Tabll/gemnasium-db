package_slug: "packagist/verbb/formie"
title: "Formie: Missing authorization in administrative settings allows low-privileged
  CP users to modify plugin configuration"
description: "Formie contains a missing authorization vulnerability in administrative
  settings routes. An authenticated, non-admin Craft CMS control panel user with limited
  Formie access could directly access Formie settings pages and modify global plugin
  configuration.\n\nIn affected versions, Formie settings-related control panel routes
  did not consistently enforce the required settings permission on the server side.
  A low-privileged Craft CMS control panel user with limited Formie access could access
  /admin/formie/settings, save changes to global plugin settings, and access /admin/formie/settings/import-export.\n\nThe
  issue has been fixed by enforcing the formie-accessSettings permission across Formie
  settings controllers and related settings actions."
