title: "Pheditor: Terminal command-allowlist bypass via argument injection leads to
  RCE — surviving vector after the metacharacter-sanitization fixes"
description: "pheditor's terminal feature restricts callers to an allowlist of commands
  (`TERMINAL_COMMANDS`) and rejects shell metacharacters. The allowlist is enforced
  as a PREFIX match with no argument validation, and the allowlist includes binaries
  that grant arbitrary command execution through their own options (`find`, `git`,
  `php`, `tar`, `grep`). A caller can therefore run any command using only allowlisted
  binaries and no rejected metacharacter, escaping the allowlist restriction the terminal
  feature relies on."
