title: "Pheditor: Authentication Bypass in Forced Password-Change Flow via Unverified
  Current Password"
description: "The forced password-change flow, triggered when the stored password
  is still the default (`admin`), does not verify that the password submitted by the
  client actually matches the current password. Any non-empty value in `pheditor_password`
  is enough to reach the password-change form, and submitting `pheditor_new_password`
  / `pheditor_confirm_password` in the same request is enough to set an arbitrary
  new password and obtain an authenticated session — without ever proving knowledge
  of the current password."
