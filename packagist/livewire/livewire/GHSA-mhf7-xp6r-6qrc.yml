package_slug: "packagist/livewire/livewire"
title: "Livewire: Authorization bypass in #[Authorize] via reordered parameter keys
  and #[Json] execution order"
description: "Three issues allowed actions protected by the `#[Authorize]` attribute
  to run against records the current user is not authorized for:\n\n1. **Out-of-order
  parameter keys on actions.** `#[Authorize]` resolved a model parameter by its array
  key, while the action itself received parameters positionally. A request sending
  params as an object with reordered integer keys (e.g. `{\"1\": 2, \"0\": 1}`) could
  pass authorization with a record the user owns while the action received a different
  record. With `#[Authorize('delete', 'comment')]` on `deleteComment(Comment $comment)`,
  a user could delete another user's comment.\n2. **The same issue on event listeners.**
  Methods using both `#[On]` and `#[Authorize]` with a model parameter were affected
  in the same way through the `__dispatch` call.\n3. **`#[Json]` methods ran before
  authorization.** When a method had both `#[Json]` and `#[Authorize]`, the method
  body executed before the authorization check. The response was still a 403, but
  any side effects (such as database writes) had already happened.\n\nOnly applications
  using the `#[Authorize]` attribute are affected: on methods that take model parameters
  (issues 1 and 2), or on `#[Json]` methods (issue 3). Authorization performed inside
  the method (e.g. `$this->authorize(...)`) is not affected. Livewire 3.x is not affected."
