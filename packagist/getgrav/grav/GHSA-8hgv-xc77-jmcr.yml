title: "Grav: Page editors can inject arbitrary script into rendered pages via the
  Twig sandbox's assets.addJs/addCss allowlist, escalating to super-admin"
description: "Grav 2.0 renders editor-authored Twig in page content by default and
  relies on the Twig content sandbox to contain it. The shipped sandbox policy allowlists
  `addcss` and `addjs` on `Grav\\Common\\Assets` (`system/src/Grav/Common/Twig/Sandbox/SandboxDefaults.php:307`).
  Because the sandbox arbitrates the *call* and not its downstream effect, a user
  holding only page-edit rights can register an arbitrary asset from page content;
  the theme then emits it into the document head as a `<script src>` / `<link href>`
  tag. The asset URL is concatenated into that tag **without escaping**, so it can
  also break out of its own attribute.\n\nThe save-time XSS scan cannot see this:
  `Security::detectXssInEditorContent()` renders the content body in isolation and
  inspects the returned string, while `assets.addJs()` acts by mutating the shared
  Assets service and returns only an object key. The payload contains no markup for
  the scanner to flag.\n\nThis is not a `Security::detectXss()` bypass. It is content
  reaching an unescaped output sink through an allowlisted method."
