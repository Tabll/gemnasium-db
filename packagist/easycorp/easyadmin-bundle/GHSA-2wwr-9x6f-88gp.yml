package_slug: "packagist/easycorp/easyadmin-bundle"
title: "EasyAdminBundle has path traversal and reflected XSS in Flag and Icon Twig
  components"
description: "EasyAdminBundle ships two public Twig components — `<twig:ea:Flag countryCode=\"...\">`
  and `<twig:ea:Icon name=\"...\">` — that load SVG files from disk using a path built
  directly from a public component property, and then render the resulting markup
  with the Twig `|raw` filter.\n\nWhen an application binds either of those properties
  to data that is influenced by an end user, the lack of validation on the property
  value leads to two distinct issues:\n\n- Arbitrary `.svg` file disclosure (both
  components) — the property value is concatenated into a filesystem path without
  normalizing or constraining it, so `..` segments are preserved and resolved by PHP.
  Any file on the server whose absolute path ends in `.svg` (for example, user-uploaded
  SVG icons stored elsewhere on the host) can be read and embedded into the rendered
  page.\n- Reflected XSS in the admin UI (Flag component only) — when the requested
  flag file does not exist, the Flag component falls back to a hard-coded SVG string
  that interpolates the raw `countryCode` value twice, and the parent template renders
  that string with `|raw`. An attacker who controls `countryCode` can therefore inject
  arbitrary HTML/JavaScript that will execute inside the authenticated admin context
  that rendered the component.\n\nThe first-party usage shipped by EasyAdminBundle
  itself is not affected: the bundle only passes ISO 3166 alpha-2 codes validated
  through `Symfony\\Component\\Intl\\Countries` to the `Flag` component, and only
  hard-coded `internal:..` names or values previously set in PHP via `MenuItem::setIcon()`
  to the `Icon` component. The vulnerability is reachable only in third-party templates
  that pass attacker-controlled data into these properties."
