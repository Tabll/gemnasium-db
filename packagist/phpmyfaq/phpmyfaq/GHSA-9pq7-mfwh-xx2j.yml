title: "phpMyFAQ enables unauthenticated 2FA brute-force attack via /admin/check acceptance
  of arbitrary user-id"
description: "The `/admin/check` endpoint in `AuthenticationController` implements
  `SkipsAuthenticationCheck`, making it reachable without any prior authentication.
  An anonymous attacker (Bob) can POST arbitrary `user-id` and `token` values to brute-force
  any user's 6-digit TOTP code. No rate limiting exists. The 10^6 keyspace is exhaustible
  in minutes. Reachability confirmed against a default install: unauthenticated `POST
  /admin/check` with a `user-id` body field returns HTTP 302 to `/admin/token?user-id=<value>`,
  echoing the attacker-supplied user id without any binding to a prior password-phase
  authentication."
