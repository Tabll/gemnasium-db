title: "phpMyFAQ has an incomplete fix for GHSA-xvp4-phqj-cjr3 — editUser() and updateUserRights()
  lack authorization guards"
description: "phpMyFAQ 4.1.3 fixed **GHSA-xvp4-phqj-cjr3** (\"IDOR Account Takeover\")
  by adding actor-authorization guards to `UserController::overwritePassword()`. The
  patch establishes a new invariant, stated in its own code comments:\n\n> \"Only
  SuperAdmins may change other users' [attributes]. Self-service is\n> always allowed.\"
  and \"a non-SuperAdmin must never be able to alter a\n> SuperAdmin or protected
  account.\"\n\nThat invariant is **not enforced** on two sibling endpoints in the
  *same file*, which the 4.1.3 fix left **unchanged**, and which carry the identical
  \"user-controlled `userId` → `getUserById()` → privileged mutation\" primitive —
  but with a strictly more dangerous sink:\n\n| Endpoint | Route | Sink | Guard in
  4.1.3 |\n|----------|-------|------|----------------|\n| `overwritePassword()` |
  `admin/api/user/overwrite-password` | `changePassword()` | **isSelf + isSuperAdmin
  + target-protection** (patched) |\n| `editUser()` | `admin/api/user/edit` | `setSuperAdmin((bool)$req.is_superadmin)`
  | **none** (only `userHasPermission(USER_EDIT)`) |\n| `updateUserRights()` | `admin/api/user/update-rights`
  | `grantUserRight($req.userId, …)` | **none** (only `userHasPermission(USER_EDIT)`)
  |\n\nA logged-in administrator holding the delegable `edit_user` right — but  **not**
  SuperAdmin — can therefore:\n\n1. Set their own (or anyone's) `is_superadmin` flag
  to `true` via `admin/api/user/edit` → **full privilege escalation to SuperAdmin**.\n2.
  Grant arbitrary rights to any account via `admin/api/user/update-rights`.\n\nThis
  is exactly the threat model the parent advisory (GHSA-xvp4) calls out: \"organizations
  with multiple admin users where not all should have SuperAdmin access.\""
