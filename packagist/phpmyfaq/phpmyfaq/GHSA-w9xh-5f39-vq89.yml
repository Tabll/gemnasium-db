title: "phpMyFAQ: Missing Password Reset Token Allows Account Takeover via Username/Email
  Enumeration"
description: "An authentication bypass vulnerability in phpMyFAQ allows any unauthenticated
  attacker to reset the password of any user account, including SuperAdmin accounts.
  By sending a PUT request with just a valid username and associated email address
  to /api/user/password/update, an attacker receives a new plaintext password via
  email without any token verification, rate limiting, or email confirmation. This
  enables complete account takeover of any user, including full administrative access."
