title: "league/commonmark XSS: `on*` event-handler filter in `AttributesExtension`
  bypassed with a U+000C form feed"
description: "The `AttributesExtension` documents a security guarantee:\n\n> **Note:**
  Attributes starting with `on` (e.g. `onclick` or `onerror`) are capable of executing\n>
  JavaScript code and are therefore **never allowed by default**. You must explicitly
  add them to\n> the `allow` list if you want to use them.\n>\n> — `docs/2.x/extensions/attributes.md`\n\nPrefixing
  the attribute name with a single U+000C FORM FEED byte defeats that guarantee.\n`{<FF>onclick=\"alert(1)\"}`
  passes through `AttributesHelper::filterAttributes()` untouched and is\nwritten
  verbatim into the output, where browsers parse it as a genuine `onclick` handler.\n\nThe
  same prefix defeats the `allow_unsafe_links` check, letting a `javascript:` URI
  through on\n`href` / `src` even when `allow_unsafe_links` is `false`.\n\nThis bypasses
  the fix shipped in the **2.7.0 security release** (\"Fix XSS in AttributesExtension\",\n43207253ea5f14867c77c697cd3838c446cadcea),
  which added `filterAttributes()` for the express\npurpose of blocking these attributes.\n\nThroughout
  this report `<FF>` denotes a literal U+000C byte (`\"\\x0C\"` in PHP). It is invisible
  in\nrendered text, so all payloads below are written with PHP escape sequences to
  stay unambiguous."
