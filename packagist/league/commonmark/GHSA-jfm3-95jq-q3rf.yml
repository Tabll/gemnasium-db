title: "league/commonmark:  Denial of service via duplicate footnote definitions"
description: "The Footnote extension records one backref per footnote *reference*
  and then appends the **entire** backref list for **every** footnote *definition*
  block in the document, without ever de-duplicating or removing repeated definitions
  of the same label (`GatherFootnotesListener`, populated by `NumberFootnotesListener`).
  A document that references a single label N times and also supplies N duplicate
  `[^a]:` definitions of that label therefore produces **N × N** `FootnoteBackref`
  nodes, so output size, parse time, and peak memory are all **O(N²)**.\n\nReaching
  the vulnerable path requires `FootnoteExtension` to be registered on the `Environment`.
  This is opt-in, but is a commonly enabled GFM-style feature; no other non-default
  configuration is required. An unauthenticated attacker can expand a **~10 KB** request
  into a **~62 MB** HTML response, **~3 s** of CPU, and **~440 MB** of peak memory
  — enough to OOM-kill a default 128 MB PHP worker and deny service. Availability
  impact only; no confidentiality or integrity effect. **The Footnote extension was
  introduced in 1.5.0 (May 2020) with this backref logic present from the first commit,
  so all releases from 1.5.0 onward (including every 2.x through 2.8.x) are affected.**"
