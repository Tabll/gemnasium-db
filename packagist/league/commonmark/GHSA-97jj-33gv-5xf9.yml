title: "league/commonmark: DisallowedRawHtml bypassed when a disallowed tag name ends
  the raw-HTML literal"
description: "## Summary\n\nThe `DisallowedRawHtml` extension does not escape a disallowed
  tag when the tag name is the last thing in the raw HTML. A Markdown line containing
  just `<script` is emitted unchanged, and the next block can supply its attributes.
  With the shipped GFM defaults this allows stored XSS by anyone who can post Markdown."
