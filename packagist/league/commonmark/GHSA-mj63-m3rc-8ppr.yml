title: "league/commonmark: Denial of service via deeply nested XML output"
description: "`XmlRenderer` pretty-prints XML by emitting depth-proportional indentation
  whitespace for **every** opening and closing tag. For a tree of depth n, the indentation
  alone sums to **O(n²)** bytes of output (and corresponding memory), reachable through
  `MarkdownToXmlConverter` — e.g. `str_repeat('> ', $depth) . \"x\\n\"`, a single
  line of nested blockquotes — or through a direct `XmlRenderer::renderDocument()`
  call on an attacker-influenced AST.\n\nThis affects applications that convert untrusted
  Markdown to XML, which is an **opt-in** output path. The parser's `max_nesting_level`
  bounds the depth of *parser-created* trees, but its default is high enough to reach
  damaging sizes, can be raised by the host application, and does not constrain custom
  or programmatically built ASTs handed straight to the renderer. The result is a
  memory / output-size amplification rather than a hard crash, which is why this issue
  is rated **Medium** rather than High. No confidentiality or integrity impact. XML
  rendering was introduced in 2.0.0 (first shipped in 2.0.0-beta1, June 2021) and
  has emitted depth-proportional indentation ever since, so all 2.x releases are affected
  (verified against 2.8.x, clean upstream `1902f60f`). 1.x has no XML renderer and
  is not affected."
