title: "Semantic MediaWiki'a missing authorization in the smwtask API module allows
  unauthenticated access to admin-only maintenance tasks"
description: "The `api.php?action=smwtask` API module performs no authorization check.
  The equivalent maintenance interface in the web UI (`Special:SMWAdmin`) requires
  the `smw-admin` right, but the API module that backs several of the same operations
  enforces nothing. An unauthenticated visitor can therefore retrieve internal Semantic
  MediaWiki database statistics and reach state-changing maintenance operations that
  are intended to be administrator-only."
