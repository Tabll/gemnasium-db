package_slug: "packagist/poweradmin/poweradmin"
title: "Poweradmin: Broken access control (IDOR): any zone owner can modify DNS records
  in zones they do not own"
description: "When you save a record edit, Poweradmin checks whether you're allowed
  to touch the record by looking at a zone id you send in the POST body, but it then
  applies the change to a record id you also send in the POST body. Nothing checks
  that the record id actually belongs to that zone id. So you point the permission
  check at a zone you legitimately own, point the record id at somebody else's record,
  and the update goes through.\n\nA low-privilege \"Editor\" who only owns `attacker.example`
  was able to overwrite a record living in `victim.example` (owned by the admin),
  even though the same account gets a flat \"you do not have permission to access
  this zone\" if it tries to open that zone directly."
