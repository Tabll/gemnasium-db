title: "spomky-labs/otphp: Mass-assignment in Factory::loadFromProvisioningUri lets
  a hostile provisioning URI corrupt OTP state or leak an uncaught TypeError"
description: "`OTPHP\\Factory::loadFromProvisioningUri()` parses an attacker-supplied
  `otpauth://` URI and forwards **every** query key to `OTP::setParameter($key, $value)`.
  `setParameter()` resolves the name with `property_exists($this, $parameter)` and
  performs a dynamic write `$this->{$parameter} = $value` (`src/OTP.php:196-197`).
  Because the query keys are entirely controlled by whoever produced the URI, a URI
  can target the internal properties of the OTP object that are not meant to be set
  from a URI: `parameters`, `issuer`, `label`, `issuer_included_as_parameter`, and
  (on TOTP) the readonly `clock`. This is an instance of object property mass-assignment
  (CWE-915)."
