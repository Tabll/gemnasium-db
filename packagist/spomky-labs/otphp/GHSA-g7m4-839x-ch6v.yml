title: "spomky-labs/otphp: Unbounded digits parameter in a provisioning URI triggers
  an uncaught DivisionByZeroError in OTP generation"
description: "The `digits` parameter parsed from a provisioning URI is validated only
  with a lower bound (`$value > 0`) and has no upper bound (`src/OTP.php:353-357`).
  OTP generation computes `$code % (10 ** $this->getDigits())` (`src/OTP.php:283`).
  When `digits` is large enough that `10 ** digits` overflows PHP's integer range
  and the `(int)` cast yields `0` (around `digits >= 40` on 64-bit PHP 8.x), the modulo
  operand becomes `0` and PHP raises a `DivisionByZeroError`."
