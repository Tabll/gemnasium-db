title: "LibreNMS Vulnerable to Remote Code Execution via AboutController"
description: "A Remote Code Execution (RCE) vulnerability exists in LibreNMS 26.3.1
  through the AboutController. An authenticated administrator can manipulate the `snmpget`
  configuration parameter to execute arbitrary system commands. When the `/about`
  endpoint is accessed, the application executes the configured binary path via `shell_exec()`
  without proper validation. This vulnerability leads to complete server compromise,
  allowing attackers to establish reverse shells, exfiltrate sensitive data, and maintain
  persistent access.\n\n**Severity:** High (CVSS 7.2)\n**Attack Vector:** Network\n**Privileges
  Required:** High (Administrator)\n**User Interaction:** None\n**Impact:** Complete
  system compromise with web server privileges\n\n---\n\n\n| Category | Level | Description
  |\n|----------|-------|-------------|\n| **Confidentiality** | HIGH | Read config
  files, database credentials, SSH keys |\n| **Integrity** | HIGH | Create webshells,
  backdoors, modify code |\n| **Availability** | HIGH | Disrupt services, delete data,
  stop monitoring |\n| **Scope** | CHANGED | Compromise extends beyond application
  to system |"
