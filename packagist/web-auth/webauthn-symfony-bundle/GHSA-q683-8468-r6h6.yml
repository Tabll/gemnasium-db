title: "WebauthnAuthenticator leaks sensitive HTTP headers through INFO-level logs"
description: "`Webauthn\\Bundle\\Security\\Http\\Authenticator\\WebauthnAuthenticator`
  logs the full `Symfony\\Component\\HttpFoundation\\Request` object inside the log
  context of both `onAuthenticationSuccess()` and `onAuthenticationFailure()` at INFO
  level:\n\n```php\n$this->logger->info('User has been authenticated successfully
  with Webauthn.', [\n'request' => $request,\n'firewallName' => $firewallName,\n'identifier'
  => $token->getUserIdentifier(),\n]);\n\n$this->logger->info('Webauthn authentication
  request failed.', [\n'request' => $request,\n'exception' => $exception,\n]);\n```\n\n`Request::__toString()`
  returns the raw HTTP message, including every request header. As soon as the configured
  logger normalises or stringifies the context (default behaviour for `LineFormatter`,
  `JsonFormatter` via `NormalizerFormatter`, etc.), sensitive headers such as `Cookie`
  (session identifier), `Authorization` and any custom auth header are written to
  the log stream in clear text.\n\nApplications that forward logs to centralised platforms
  (ELK, Splunk, Datadog and similar) are particularly exposed: log access is typically
  broader than application access, which can allow log readers to hijack authenticated
  sessions."
