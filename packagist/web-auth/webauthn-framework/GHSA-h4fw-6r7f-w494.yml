package_slug: "packagist/web-auth/webauthn-framework"
title: "Webauthn has a User Verification Downgrade via Default-Open ClientOverridePolicy"
description: "In version 5.3.0 of the Symfony bundle, `Webauthn\\Bundle\\Policy\\ClientOverridePolicy`
  defaulted to allowing all client overrides, including `userVerification`. A client
  could send `{\"userVerification\": \"discouraged\"}` in the assertion or attestation
  options request to override a server-configured `userVerification: required`, causing
  the emitted WebAuthn options to instruct the authenticator to skip user verification.
  The `CheckUserVerification` ceremony step then read the same downgraded options
  and skipped its check."
