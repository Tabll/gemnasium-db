package_slug: "packagist/web-auth/webauthn-lib"
title: "Webauthn: SimpleFakeCredentialGenerator with an empty secret produces predictable
  fake credentials, weakening username enumeration protection"
description: "`Webauthn\\SimpleFakeCredentialGenerator` is the library-provided default
  implementation of the `FakeCredentialGenerator` interface. It returns a stable list
  of decoy `PublicKeyCredentialDescriptor` objects for a given username so that an
  assertion request for an unknown user looks the same as a request for a real one,
  which mitigates username enumeration.\n\nThe generator derives the whole decoy list
  from a single seed:\n\n```php\n$seed = hash('sha256', $username . $this->secret,
  true);\n```\n\nWhen it is constructed without a secret (its constructor default,
  `$secret = ''`), the seed depends only on the username. The username is attacker-chosen
  and the algorithm is public, so an unauthenticated requester can recompute the exact,
  byte-for-byte decoy list the server returns for any username. The attacker then
  compares a probed username's response against the locally computed list and decides
  whether the account is real or fake, which is precisely the distinction the mechanism
  is meant to hide.\n\nWith any non-empty secret the seed becomes a value the attacker
  cannot evaluate and the mitigation holds. The defect is the empty default, not the
  algorithm."
