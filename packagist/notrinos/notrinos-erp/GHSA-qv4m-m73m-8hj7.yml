package_slug: "packagist/notrinos/notrinos-erp"
title: "NotrinosERP: Authenticated arbitrary file upload leads to remote code execution
  via HRM employee \"Documents\" (doc_file)"
description: "An authenticated user with the HR \"Manage Employees\" permission (`SA_EMPLOYEE`)
  can upload a\nfile with an arbitrary extension through the employee **Documents**
  tab. The handler writes the\nraw client-supplied filename — extension intact — into
  a web-served directory with no extension,\nMIME, or content validation, so a `.php`
  file is stored under the web root and executes as code,\nyielding remote code execution
  on the server."
