title: "NotrinosERP: Authenticated arbitrary file upload leads to remote code execution
  via HRM employee \"Documents\" (doc_file)"
description: "An authenticated user with the HR \"Manage Employees\" permission (`SA_EMPLOYEE`)
  can upload a file with an arbitrary extension through the employee **Documents**
  tab. The handler writes the raw client-supplied filename — extension intact — into
  a web served directory with no extension, MIME, or content validation, so a `.php`
  file is stored under the web root and executes as code, yielding remote code execution
  on the server."
