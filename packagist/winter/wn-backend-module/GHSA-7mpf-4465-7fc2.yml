title: "Winter: Stored XSS through Backend List widget image columns"
description: "`Backend\\Widgets\\Lists::evalImageTypeValue()` interpolated the resolved
  image URL into a single-quoted `src` attribute without escaping it. Where a list
  column of type [`image`](https://wintercms.com/docs/v1.2/docs/backend/lists#image)
  rendered an attacker-influenced value, that value could break out of the attribute
  and inject arbitrary attributes — including event handlers — into the backend list,
  executing in the session of whichever backend user viewed it.\n\nWinter core ships
  no `image` list column, so a default installation is unaffected. Exploitation requires
  a plugin that renders attacker-influenced values through one.\n\nThe supported [image
  sources](https://wintercms.com/docs/v1.2/docs/services/image-resizing#available-sources)
  are plugins, themes, the Media Library, the uploads directory, and `Attach\\File`
  models; an arbitrary external URL is not among them. `ImageResizer::filterGetUrl()`
  returns the value it was given when it cannot resolve an image, however, so an unsupported
  value reached the attribute verbatim rather than being rejected.\n\nAs with previous
  issues of this kind the severity is limited: an attacker must already be able to
  store the value, and a backend user must then open the affected list. Note that
  validating a stored URL was not necessarily sufficient — a payload can survive `filter_var($url,
  FILTER_VALIDATE_URL)`, since `/` is valid both in a URL path and after a quoted
  HTML attribute value."
