package_slug: "packagist/shopper/cart"
title: "shopper/framework: Race condition on Discount.usage_limit allows silent over-redemption"
description: "`CreateOrderFromCartAction::execute` previously created the `Order`
  row before checking and incrementing the discount's `total_use` counter. Under concurrent
  checkout pressure (Black Friday, flash sale, viral coupon), the global `usage_limit`
  was silently exceeded: orders were committed with the discount fully applied to
  `price_amount` while the counter blocked at `usage_limit`. The merchant had no signal
  that an over-redemption had occurred.\n\nA second related bug: `usage_limit_per_user`
  was effectively a no-op because the counter it relied on (`DiscountDetail.total_use`)
  was never incremented anywhere in the codebase. The per-user check therefore always
  saw `0` uses and validation passed regardless of how many times the same customer
  had previously redeemed the coupon. For `eligibility = Everyone` the per-user limit
  could not fire at all because the underlying `DiscountDetail` row only exists for
  `eligibility = Customers`.\n\nDirect financial loss: each over-redemption is a discount
  the merchant did not intend to grant."
