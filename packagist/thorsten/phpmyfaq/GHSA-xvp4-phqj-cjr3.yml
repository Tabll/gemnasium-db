title: "phpMyFAQ: IDOR Account Takeover "
description: "An Insecure Direct Object Reference (IDOR) vulnerability in phpMyFAQ's
  Admin API allows any authenticated administrator to change the password of any user
  account, including SuperAdmin accounts (userId=1), without authorization verification.
  An attacker with a low-privilege admin account can escalate privileges to full SuperAdmin
  control by simply changing the target user's ID in the API request body."
