title: "phpMyFAQ has SQL Injection in CurrentUser::setTokenData through unescaped
  OAuth token fields"
description: "`CurrentUser::setTokenData()` in `phpmyfaq/src/phpMyFAQ/User/CurrentUser.php`
  at lines 515-534 builds a SQL UPDATE statement with `sprintf` and interpolates OAuth
  token fields (`refresh_token`, `access_token`, `code_verifier`, and `json_encode($token['jwt'])`)
  without calling `$db->escape()`. Sibling methods `setAuthSource()` and `setRememberMe()`
  in the same file do call `$db->escape()` on user-controlled values, so the omission
  is local to this method. An attacker (Bob) whose Azure AD display name contains
  a single quote (for example `O'Brien`, or a deliberate SQL payload) breaks out of
  the string literal and injects arbitrary SQL against the phpMyFAQ database."
