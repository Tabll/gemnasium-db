title: "phpMyFAQ: Unauthenticated Password Reset Endpoint Allows User Enumeration
  and Forced Password Change Without Token Validation"
description: "The password reset API can be triggered without authentication and without
  any out-of-band confirmation step.\n\nIf an attacker knows a valid `username + email`
  pair, they can call the reset endpoint directly. The application immediately generates
  a new password, writes it to the account, and only then sends the new password by
  email.\n\nThis creates two issues at the same time:\n\n- account enumeration through
  the response difference between valid and invalid pairs\n- forced password reset
  of another user's account, which invalidates the old password immediately\n\nIn
  my local reproduction, I confirmed both the response difference and the password
  change itself."
