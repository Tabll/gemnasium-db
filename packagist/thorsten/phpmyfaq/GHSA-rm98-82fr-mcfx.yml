title: "phpMyFAQ's Missing CONFIGURATION_EDIT Permission Check on 12 Admin API Configuration
  Tab Endpoints Allows Information Disclosure by Any Authenticated User"
description: "12 endpoints in `ConfigurationTabController.php` use `userIsAuthenticated()`
  (login-only check) instead of `userHasPermission(PermissionType::CONFIGURATION_EDIT)`.
  This allows any authenticated user — including ones with zero admin permissions
  — to enumerate system configuration metadata including the permission model, active
  template, cache backend, mail provider, and translation provider."
