title: "October CMS: Incomplete Scheme Validation in Image Resizer"
description: "The image resizer classified external sources by testing whether the
  source string began with the substring `http`, and the string-source branch in `ResizeImageItem::fromObject()`
  accepted any value containing `://` as a URL. As a result, non-http(s) PHP stream
  wrappers such as `phar://`, `file://` and `ftp://` could be stored in the resizer
  cache and later passed to the underlying image library. On a `phar://` path this
  can lead to metadata deserialization during subsequent file operations.\n\n**Exploitation
  requires an existing template-authoring or backend-configuration primitive that
  passes untrusted input into the `|resize` Twig filter (or the `ResizeImages::resize()`
  API).** The `/resize/{file}` route itself is a lookup against a cache entry that
  was previously written by trusted server-side code, and an unauthenticated visitor
  cannot cause an arbitrary source path to be written into that cache. In October's
  trust model the Publisher and Developer backend roles that can author templates
  are already trusted with template code execution, so this is a defense-in-depth
  hardening rather than an unauthenticated network-to-RCE path."
