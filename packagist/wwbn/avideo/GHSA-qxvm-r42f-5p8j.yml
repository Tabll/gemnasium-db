title: "AVideo's Meet plugin: `uploadRecordedVideo.json.php` derives `users_id` from
  the uploaded filename and calls passwordless `User->login()`, allowing any caller
  with the Meet shared secret to obtain a session as arbitrary users including admin"
description: "**Type:** Authorization-bypass via user-controlled identifier. The Meet
  plugin's recorded-video upload endpoint (`plugin/Meet/uploadRecordedVideo.json.php`)
  authenticates the caller using a single shared `Authorization: Bearer <secret>`
  against `$objM->secret`. Once that check passes, the endpoint reads the *target
  user identifier* from the uploaded file's `name` field, instantiates a `User` object
  with that ID, and calls `$userObject->login(true, true)` — the no-password / encoded-password
  login path — committing a session for that user and emitting `Set-Cookie` headers
  to the caller. There is no check that the caller actually owns the requested `users_id`.\n**File:**
  `plugin/Meet/uploadRecordedVideo.json.php`, lines 56-65; secondary in `objects/user.php`
  `User::login()` (no-password branch at lines 1276-1310).\n**Root cause:** the upload
  handler's identity model is \"service-to-service\" (a Meet/Jitsi recorder posts
  a finished recording back to AVideo with the shared secret) but the `users_id` to
  credit the upload to is parsed from the FILENAME the same caller controls — `$users_id
  = explode('-', $_FILES['upl']['name'])[0];`. There is no signed claim, no separate
  proof-of-identity, no allowlist. The subsequent `$userObject->login(true, true)`
  call invokes the no-password login path which sets `$_SESSION['user']`, calls `setUserCookie(...)`,
  and `_session_regenerate_id()` — exactly the operations a normal login performs.
  The response carries the new `PHPSESSID` back to the caller, who can then reuse
  it on every subsequent request to act as the targeted user. The Meet shared secret
  is `md5($global['systemRootPath'] . $global['salt'] . \"meet\")` (`Meet.php:73`),
  so any attacker who can read `videos/configuration.php` (e.g., via a path-traversal
  CVE such as `GHSA-83xq-8jxj-4rxm` or `GHSA-4wmm-6qxj-fpj4` that the project has
  already addressed in this surface area) can compute the Meet secret deterministically
  and pivot to full account takeover."
