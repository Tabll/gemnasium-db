title: "Laravel Framework: Temporary Signed URL Path Confusion"
description: "A vulnerability in Laravel's local filesystem driver allows temporary
  signed URLs to be parsed ambiguously, potentially misrouting requests and bypassing
  expiration enforcement.\n\nUnder certain conditions, a generated temporary signed
  URL can be interpreted differently by the server than intended at signing time.
  This may cause requests to resolve to an unintended resource, and can prevent expiration
  from being enforced, allowing expired URLs to remain valid indefinitely."
