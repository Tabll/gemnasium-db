package_slug: "packagist/froxlor/froxlor"
title: "Froxlor's API Authentication bypasses 2FA Authentication"
description: "Froxlor's API authentication (`FroxlorRPC::validateAuth`) does not enforce
  Two-Factor Authentication. When a user (admin or customer) enables 2FA on their
  account, the web UI correctly requires a TOTP code after password verification.
  However, the API accepts requests authenticated with only an API key and secret
  — no TOTP challenge is issued, checked, or required.\n\nAn attacker who obtains
  a leaked API key+secret for a 2FA-protected account has full access to all API operations
  without providing a second factor."
