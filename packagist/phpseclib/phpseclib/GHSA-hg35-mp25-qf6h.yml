description: "### Duplicate Advisory\nThis advisory has been withdrawn because it
  is a duplicate of GHSA-2528-jw5q-ww88. This link is maintained to preserve external
  references.\n\n### Original Description\nAn issue was discovered in phpseclib 1.x
  before 1.0.23, 2.x before 2.0.47, and 3.x before 3.0.36. An attacker can construct
  a malformed certificate containing an extremely large prime to cause a denial of
  service (CPU consumption for an isPrime primality check). NOTE: this issue was introduced
  when attempting to fix CVE-2023-27560."
