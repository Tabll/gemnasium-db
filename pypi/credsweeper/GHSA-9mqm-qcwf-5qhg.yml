package_slug: "pypi/credsweeper"
title: "CredSweeper: Recursive archive size-limit bypass in deep scanner allows crafted
  compressed inputs to exhaust resources"
description: "CredSweeper's deep scanner does not enforce `recursive_limit_size` as
  a hard limit. Several recursive scanners fully decompress or fully read attacker-controlled
  content before the remaining budget is validated, and `AbstractScanner.recursive_scan()`
  continues processing even when the residual budget is already negative.\n\nThis
  allows a crafted archive to bypass the intended recursive zip-bomb protection and
  force excessive memory / CPU consumption when deep scanning is enabled (`--depth
  > 0`). I confirmed this on upstream commit `8b081acf04311eafe8fbd66ea41d02b0a7a4c6f6`
  / package version `1.15.8`.\n\nThe issue has two closely related exploitation paths
  that share the same root cause:\n\n1. Single-stream decompressor bypass:\n`gzip`,
  `bzip2`, and `lzma/xz` inputs are fully decompressed first, then the remaining budget
  is computed, and the recursive scan proceeds even if the result is negative.\n\n2.
  Multi-entry archive cumulative-budget bypass:\n`zip` and `tar` entries are checked
  only against the original per-entry budget, not against a mutable cumulative remaining
  budget shared across sibling entries. Multiple individually small entries can therefore
  exceed the configured recursive limit in aggregate.\n\nThe impact is availability/resource
  exhaustion. I did not confirm arbitrary code execution, arbitrary file write, or
  data exfiltration from this issue."
