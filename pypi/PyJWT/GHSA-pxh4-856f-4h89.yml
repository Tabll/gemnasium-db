package_slug: "pypi/PyJWT"
title: "PyJWT: HS256/384/512 verify accepts empty HMAC key via oct JWK (PyJWK/PyJWKClient)
  enabling token forgery"
description: "`HMACAlgorithm.from_jwk` accepts a symmetric (`kty=oct`) JWK whose `k`
  value is\nthe empty string and returns a zero-length key without raising. When a
  token is\nthen verified with that key object (a `PyJWK`, or a `PyJWK` resolved by\n`PyJWKSet`
  / `PyJWKClient`), the HMAC verifier computes\n`HMAC(key=b\"\", signing_input)` and
  accepts any token an attacker forged with the\nsame empty key. The attacker needs
  no secret knowledge: they reproduce the digest\nlocally with an empty key and set
  the token's `kid` to the empty-`k` JWK.\n\nThe empty-key rejection that `HMACAlgorithm.prepare_key`
  performs for\nstring/bytes secrets (added in 2.13.0) was never propagated to the
  sibling\n`from_jwk` code path, so the JWK/JWKS verification route stays exploitable.
  Under\ndefault decode options this path only emits an `InsecureKeyLengthWarning`,
  not an\nerror, so verification still succeeds. This is the same \"empty/nil HMAC
  key is\naccepted by verify\" defect the JWT ecosystem is currently closing library-side:\nfast-jwt
  CVE-2026-44351 (CVSS 9.1) and ruby-jwt CVE-2026-45363 both added a\nlibrary-side
  reject-empty-HMAC-key precondition."
