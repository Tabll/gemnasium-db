package_slug: "pypi/vyper"
title: "Vyper: Call stack corruption when passing complex type containing non-base
  type members as argument"
description: "When we pass a multi-dimensional array (like `[[1, 2], [3, 4]]`) as
  an argument to internal/external functions we get incorrect output. This is due
  to a stack management issue, because it was assumed that the size of each subtype
  of an array/struct is 32, which is not always correct.\n\nExample code:\n```python\n@internal\ndef
  test_input(arr: int128[2][1], i: int128) -> (int128[2][1], int128):\nreturn arr,
  i\n\n@external\ndef test_values(arr: int128[2][1], i: int128) -> (int128[2][1],
  int128):\nreturn self.test_input(arr, i)\n```\n\nPlease see #2183 for further information"
