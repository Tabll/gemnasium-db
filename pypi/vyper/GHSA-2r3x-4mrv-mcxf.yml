title: "Vyper: Memory corruption using function calls within tuples / nested calls"
description: "When performing a function call inside a tuple or as an argument inside
  another function call, there is a memory corruption issue that occurs because of
  an incorrect pointer to the the tip of the stack.\n\nExample code:\n```python\n@internal\ndef
  _foo(a: uint256, b: uint256, c: uint256) -> (uint256, uint256, uint256, uint256,
  uint256):\nreturn 1, a, b, c, 5\n\n@internal\ndef _foo2() -> uint256:\na: uint256[10]
  = [6,7,8,9,10,11,12,13,15,16]\nreturn 4\n\n@external\ndef foo() -> (uint256, uint256,
  uint256, uint256, uint256):\nreturn self._foo(2, 3, self._foo2())\n```\n\nPlease
  see #2186 for further information"
