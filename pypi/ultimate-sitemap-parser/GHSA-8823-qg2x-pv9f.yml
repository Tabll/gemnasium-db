package_slug: "pypi/ultimate-sitemap-parser"
title: "Ultimate Sitemap Parser (USP): Gzip Decompression Bomb Bypasses Sitemap Size
  Limit"
description: "`ultimate-sitemap-parser` enforces a 100 MiB size limit on sitemap responses,
  but applies it only to the **compressed** bytes received over the network. When
  a `.gz` sitemap is fetched, `usp/helpers.py:239` calls `gzip_lib.decompress(data)`
  with no output-size cap, allowing an attacker-controlled server to serve a small
  gzip-compressed payload (~549 KB) that expands to over 120 MiB in process memory.
  This completely bypasses the declared limit and can exhaust memory or crash any
  process that calls `sitemap_tree_for_homepage()` against an untrusted site."
