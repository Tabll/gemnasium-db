title: "Bleach clean() / Cleaner() fails to sanitize dangerous URI schemes in allowed
  formaction attributes"
description: "Bleach `clean()` / `Cleaner()` fails to sanitize dangerous URI schemes
  in allowed `formaction` attributes.\n\nBleach applies URI protocol sanitization
  only to attributes listed in `attr_val_is_uri`. While URI-bearing attributes such
  as `action`, `href`, `src`, and `poster` are included in that set, `formaction`
  is not. As a result, if a downstream application explicitly allows `formaction`
  on submit-capable controls in untrusted HTML, Bleach preserves dangerous values
  such as `javascript:alert(1)` instead of stripping them.\n\nThis can lead to **submit-triggered
  JavaScript execution** in applications that rely on Bleach to sanitize untrusted
  HTML and allow the relevant tag/attribute combination.\n\n---"
