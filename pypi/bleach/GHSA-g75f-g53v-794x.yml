title: "Bleach linkify(parse_email=True) CPU exhaustion via unbounded email regex
  scanning"
description: "Bleach 6.3.0 exposes a documented email-linkification path through `bleach.linkify(...,
  parse_email=True)`. The implementation scans attacker-controlled text with `EMAIL_RE.finditer()`
  over the full character token and has no length, timeout, or linear prefilter before
  applying the dot-atom email regex. A non-email payload around 30 KB causes multi-second
  CPU consumption per request/call, creating a direct availability risk for applications
  that enable email linkification on user-submitted text."
