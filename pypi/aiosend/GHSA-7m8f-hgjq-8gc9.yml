title: "aiosend: Deserialization of request body before signature verification (Pre-auth
  DoS) in webhook handler"
description: "`WebhookHandler.feed_update()` deserializes the entire request body
  before verifying the HMAC signature. This allows an unauthenticated attacker to
  force expensive parsing of arbitrary JSON payloads that will ultimately be rejected,
  leading to unnecessary CPU and memory consumption."
