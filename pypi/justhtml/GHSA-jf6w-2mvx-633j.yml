title: "justhtml: to_markdown() code-span blank-line breakout enables XSS"
description: "In `justhtml` 0.9.0 through 1.21.0, `to_markdown()` renders `<code>`
  text (and `<pre>` text inside a link) as an inline Markdown code span whose only
  protection is backtick-fence length. A blank line (`\\n\\n`) in that text terminates
  the inline span in any compliant Markdown renderer, so attacker-controlled text
  that survived HTML sanitization is emitted **unescaped** after the blank line and
  is re-parsed as live raw HTML/Markdown — yielding XSS in the default configuration.
  Likely **CWE-79 (Cross-site Scripting)** arising from **CWE-116 (Improper Encoding/Escaping
  of Output)**."
