package_slug: "pypi/Crawl4AI"
title: "Crawl4AI: Arbitrary file write (path traversal) in crawler downloads can lead
  to RCE"
description: "When the crawler saves a downloaded file, the destination filename was
  taken from attacker-influenced input and joined to the downloads directory with
  no confinement. A filename containing an absolute path (e.g. `/etc/cron.d/evil`)
  or `../` traversal escaped the downloads directory, giving an arbitrary file write
  with attacker-controlled contents. Because the written bytes are attacker-controlled,
  this escalates to remote code execution (overwriting a shell rc-file, `~/.ssh/authorized_keys`,
  a cron entry, or a Python module on the import path)."
