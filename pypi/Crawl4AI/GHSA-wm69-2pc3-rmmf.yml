package_slug: "pypi/Crawl4AI"
title: "Crawl4AI: Unauthenticated SSRF on the Docker server streaming crawl path (/crawl/stream)"
description: "The Docker API server applied its SSRF destination check (`validate_url_destination`)
  on the non-streaming `/crawl` path but not on the streaming path. `handle_stream_crawl_request`
  passed seed URLs straight to the crawler with no destination validation. A remote,
  unauthenticated client could call `POST /crawl/stream` (or `POST /crawl` with `crawler_config.stream=true`,
  which short-circuits to the same handler) with a URL pointing at an internal, private,
  or link-local address; the server fetched it and streamed the response body back.
  The Docker API is unauthenticated by default."
