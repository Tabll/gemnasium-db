package_slug: "pypi/Crawl4AI"
title: "Crawl4AI: Unauthenticated RCE via Chromium launch-argument injection in browser_config.extra_args"
description: "The Docker API server accepted a request-supplied `browser_config.extra_args`,
  which flowed into Chromium's launch arguments. An attacker could inject Chromium
  switches that replace a child-process launch command (`--utility-cmd-prefix`, `--renderer-cmd-prefix`,
  `--gpu-launcher`, `--browser-subprocess-path`) together with `--no-zygote`, causing
  Chromium to fork/exec an attacker-controlled command as the container's runtime
  user. The Docker API is unauthenticated by default, so a single request yields arbitrary
  command execution.\n\nThe earlier `extra_args` SSRF patch (0.8.9) used a denylist
  scoped to proxy/DNS flags; a denylist of launch switches is inherently incomplete,
  and these command-execution switches were not covered."
