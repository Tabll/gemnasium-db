package_slug: "pypi/netlicensing-mcp"
title: "netlicensing-mcp: REST Path Traversal Bypasses Token Redaction"
description: "The `netlicensing_get_product` MCP tool in `netlicensing-mcp` interpolates
  a caller-controlled `product_number` argument directly into a REST URL path without
  any validation. Passing `../token` as the product number causes `httpx` to normalize
  `/product/../token` into `/token`, silently redirecting the request to the NetLicensing
  token endpoint instead of the intended product endpoint. The response is then serialized
  through the generic `_wrap_json` wrapper rather than the token-specific `_wrap_json_token_read`
  wrapper, bypassing all APIKEY `number` and SHOP `shopURL` redaction. An authenticated
  MCP client can recover plaintext API key values that the token read tools intentionally
  mask, including admin-level APIKEY credentials."
