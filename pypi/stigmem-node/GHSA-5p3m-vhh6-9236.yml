package_slug: "pypi/stigmem-node"
title: "stigmem-node has blind SSRF via unvalidated webhook subscription delivery_address"
description: "Stigmem allows an authenticated user to create a webhook subscription
  with a user-controlled `delivery_address`. That value is stored and later used directly
  by the subscription delivery worker as the destination of a server-side HTTP POST
  request.\n\nThe codebase already contains an outbound SSRF guard, `assert_safe_url()`,
  which blocks loopback, private, link-local, and metadata-style destinations. However,
  the subscription webhook delivery path does not appear to apply this guard either
  when the subscription is created or immediately before delivery.\n\nAs a result,
  an authenticated user can configure a webhook destination such as `http://127.0.0.1:9999/ssrf`,
  trigger a matching fact-change event, and cause the Stigmem server to issue a server-side
  HTTP request to an internal loopback address."
