package_slug: "pypi/stigmem-node"
title: "stigmem-node: decay sweep expires and counts facts across all tenants (cross-tenant
  BOLA)"
description: "On a multi-tenant stigmem node, a caller holding a `write` credential
  for **one** tenant can run a decay sweep that acts on **every** tenant's facts.
  The candidate-selection queries in `lifecycle/decay.py` (`_select_ttl_candidates`,
  `_select_confidence_candidates`) carried no `tenant_id` predicate, and the caller's
  tenant was not threaded into the sweep or its async worker (`run_decay_sweep` /
  `_decay_job_worker`), reached via `POST /v1/decay/sweep`."
