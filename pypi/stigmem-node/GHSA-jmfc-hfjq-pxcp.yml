title: "stigmem-node's federation insecure transport settings may allow non-loopback
  cleartext federation"
description: "Stigmem nodes with federation enabled could be configured to run without
  mTLS outside loopback-only local development. In affected deployments, federation
  traffic may traverse the network without the intended transport protection. Impacted
  users are operators who enabled federation and explicitly disabled mTLS while binding
  the node to a non-loopback URL."
