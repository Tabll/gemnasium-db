package_slug: "pypi/stigmem-node"
title: "stistigmem-node: quarantine review surface exposes and mutates other tenants'
  quarantined facts (cross-tenant BOLA)"
description: "On a multi-tenant stigmem node, a tenant administrator could list, read,
  and **admit or reject** quarantined facts belonging to **other** tenants. The list/count
  queries and `_get_quarantined_fact` in `routes/quarantine.py` lacked an `f.tenant_id
  = identity.tenant_id` predicate, and the garden lookup was not tenant-scoped — reached
  via the `/v1/quarantine` list and admit/reject endpoints."
