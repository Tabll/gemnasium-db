package_slug: "pypi/GitPython"
title: "GitPython: Unguarded git option forwarding in IndexFile.checkout() and TagReference.create()
  enables arbitrary file overwrite and arbitrary file read"
description: "GitPython blocks dangerous git options through `Git.check_unsafe_options()`,
  gated per method by an `allow_unsafe_options` parameter. That guard is applied **per
  call site**, so any API that forwards `**kwargs` into a git command without calling
  it passes caller-controlled options straight to git.\n\nA mechanical sweep of every
  method that forwards `**kwargs` into a `.git.<command>(...)` call found **14 sites
  with no guard**. Two reach a git option that takes a filesystem path:\n\n| # | Call
  site | git option | Impact |\n|---|---|---|---|\n| 1 | `IndexFile.checkout()` →
  `git checkout-index` | `--prefix=<path>` | arbitrary file **overwrite** with repository-controlled
  content |\n| 2 | `TagReference.create()` → `git tag` | `-F <file>` / `--file=<file>`
  | arbitrary file **read**, returned in-band |\n\nThis is the same defect class already
  fixed in `Commit.count()` (GHSA-p538-c434-8v24), `Repo.archive()` and `Git.ls_remote()`
  (GHSA-956x-8gvw-wg5v). Both instances below are still present at HEAD.\n\n---"
