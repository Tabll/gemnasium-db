title: "GitPython: arbitrary file read via attacker-controlled branch name in `Head.checkout()`
  (incomplete fix of CVE-2026-78679)"
description: "`Head.checkout()` guards its `**kwargs` against unsafe Git options but
  never inspects its own\npositional argument — the branch name — which reaches the
  `git checkout` argv with no `--`\nseparator. A repository whose default branch is
  named `--pathspec-from-file=/etc/passwd` makes a\nconsumer that merely clones it
  and checks out the default branch return the entire contents of that\nfile to the
  caller.\n\nThis is the exact combination of two advisories the project already fixed:\n\n-
  **CVE-2026-76217** (`GHSA-hh9p-6wh2-4mfc`) — *\"Arbitrary file read via `--pathspec-from-file`
  in\n`IndexFile.remove()` **and `Head.checkout()`**\"*. Fixed in 3.1.58 by commit
  `f2550b65`, which added\nthe guard to this exact method — but only for `**kwargs`.\n-
  **CVE-2026-78679** (`GHSA-3wxw-xv34-2frg`) — *\"`TagReference.create` positional
  reference\nbypasses kwargs-only `--file` guard, enabling arbitrary file read (incomplete
  fix of 3af0c251)\"*. Fixed in 3.1.59 by commit `1b0d2d9b`, which applied the\npositional
  check to `git/refs/tag.py`, `git/diff.py`, `git/index/base.py` and `git/repo/base.py`
  —\nbut not to `git/refs/head.py:286`.\n\n`f2550b65` states in its own commit message
  that the audit found the positional variant and applied\nit to `HEAD.reset` — 185
  lines above `Head.checkout`, in the same file, in the same commit:\n\n> \"The audit
  also found that **reset's positional commit could carry the option before its argument\n>
  separator**. […] **Check reset's positional commit as well as keyword options**\"\n\n`HEAD.reset`
  got the fix. `Head.checkout` did not, and `1b0d2d9b` did not come back for it."
