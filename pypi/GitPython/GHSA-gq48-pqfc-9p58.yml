package_slug: "pypi/GitPython"
title: "GitPython: Submodule.move() follows an attacker-committed intermediate symlink
  outside the worktree"
description: "GitPython's public `Submodule.move()` API verifies that its destination
  is lexically inside the parent repository, but it does not reject symbolic links
  in the destination's intermediate components before filesystem operations. On systems
  that check out Git symlinks, an untrusted repository can therefore redirect a fixed,
  application-selected move destination outside the parent worktree.\n\nThe reporter
  reproduced this on the latest release, GitPython 3.1.62, and current `main`. In
  the strict scenario, the repository commits `vendor -> ../outside`, while the consuming
  application independently passes the fixed literal `vendor/module`. `Submodule.move()`
  follows `vendor`, moves the initialized submodule checkout to `outside/module`,
  rewrites `.gitmodules` and the index to the symlinked path, and leaves the index
  unable to produce a tree.\n\nThe same result occurs when the committed symlink contains
  an absolute path to an external directory. No attacker-controlled API argument,
  local symlink planting, race, Git hook, unsafe-option flag, or network access during
  the proof is required."
