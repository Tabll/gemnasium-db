title: "GitPython: --no-index bypasses diff unsafe-option protections and enables
  a blind local-file content oracle"
description: "GitPython 3.1.59 blocks a previously available local-file read path
  through unsafe git diff options such as -O/--orderfile.\n\nHowever, the high-level
  diff API still permits --no-index with the default allow_unsafe_options=False.\n\n--no-index
  changes the semantics of the paths arguments: instead of repository-relative pathspecs,
  Git interprets them as arbitrary filesystem paths.\n\nWhen combined with the still-allowed
  -I/--ignore-matching-lines option, this creates a content-dependent Boolean oracle
  over a caller-selected local file.\n\nThis was reproduced against the published
  GitPython 3.1.59 wheel.\n\nThe original unsafe-option path is blocked in 3.1.59,
  while this alternate path remains reachable without setting allow_unsafe_options=True."
