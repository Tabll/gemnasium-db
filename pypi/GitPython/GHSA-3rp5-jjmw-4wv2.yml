package_slug: "pypi/GitPython"
title: "GitPython: git-config section-name injection enables arbitrary config directives
  (core.sshCommand RCE)"
description: "In GitPython `<= 3.1.52`, the config writer neutralizes only CR, LF,
  and NUL in configuration **names**, but writes section names into the `[...]` header
  with no other escaping. A section/subsection name that contains `] [ \"` closes
  the intended header and opens a second same-line section, injecting an arbitrary
  config directive — with no newline required. Because a submodule **name** is attacker-controlled
  data (it comes from a repository's `.gitmodules`, or from an application that lets
  a user name a submodule) and is written verbatim into the parent repository's trusted
  `.git/config`, an attacker can set `core.sshCommand` (or `alias.*`, `core.pager`,
  `core.fsmonitor`) and achieve remote code execution on the victim's next git operation.
  Likely **CWE-74 (Injection)**.\n\nThis is a distinct variant of the injection addressed
  by GHSA-mv93-w799-cj2w / GHSA-v87r-6q3f-2j67: those fixed **newline** injection
  into config values/names (patched in 3.1.50); the `[r\\n\\x00]` guard added for
  them does not stop a **same-line** section break inside a name."
