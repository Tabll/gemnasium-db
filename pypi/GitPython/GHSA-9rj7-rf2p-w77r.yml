package_slug: "pypi/GitPython"
title: "GitPython: Unguarded git option forwarding in Repo.init enables arbitrary
  command execution via --template clone hooks"
description: "`Repo.init()` forwards `**kwargs` verbatim to `git init` with no unsafe-option
  guard and no `allow_unsafe_options` parameter. `git init --template=<dir>` copies
  `<dir>/hooks/*` into the new repo's `.git/hooks`, so an attacker-controlled `template`
  kwarg plants a hook that executes on the next git operation → arbitrary code execution.
  `--template` is already recognized as unsafe for clone (it is on `unsafe_git_clone_options`,
  and GHSA-6p8h-3wgx-97gf covers the clone path), but `Repo.init` is a distinct method
  that never received a guard and needs an independent fix."
