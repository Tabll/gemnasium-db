title: "GitPython: Unguarded git read-tree option forwarding in IndexFile.from_tree/reset/merge_tree
  enables arbitrary file overwrite"
description: "`IndexFile.from_tree`, `IndexFile.reset` (→ from_tree) and `IndexFile.merge_tree`
  append caller-influenced treeish strings positionally to `git read-tree` with no
  unsafe-option guard, no `allow_unsafe_options` parameter, and no `--` separator.
  `git read-tree --index-output=<file>` writes the resulting index to an arbitrary
  path, and last-occurrence-wins lets an injected `--index-output` override the method's
  internal temp path — clobbering an arbitrary file with a valid git-index blob. This
  is a distinct, never-guarded sink: commit `3af0c251` (GHSA-3f7w-8rr8-f37f) guarded
  only `checkout_index` and `tag`; `read_tree` was left unprotected (it is among the
  acknowledged unguarded call sites in that advisory's sweep but was never reported
  or fixed)."
