title: "GitPython: Command Injection via git long-option prefix abbreviation bypass
  of CVE-2026-42215 blocklist"
description: "The 3.1.47 fix for CVE-2026-42215 blocks dangerous git options (`--upload-pack`,
  `--config`, `-c`, `-u` for clone; `--upload-pack` for fetch/pull; `--receive-pack`,
  `--exec` for push) so callers cannot reach command-executing options unless they
  pass `allow_unsafe_options=True`.\n\nThe fix canonicalizes an option name along
  **one** axis (underscore→hyphen via `dashify`) and checks it against an **exact-match**
  dict. It does not account for git's unambiguous long-option prefix abbreviation.
  Git accepts any unambiguous prefix of a long option (`--upload-p`, `--upload-pa`,
  `--upload-pac` all resolve to `--upload-pack`). So a kwarg key like `upload_p` canonicalizes
  to `upload-p`, misses the blocklist dict, and is emitted to git as `--upload-p=<value>`
  → executed as `--upload-pack=<value>` → command injection, in the default `allow_unsafe_options=False`
  configuration."
