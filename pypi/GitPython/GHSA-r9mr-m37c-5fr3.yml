package_slug: "pypi/GitPython"
title: "GitPython: Unsafe git option guard bypass via single-character kwarg value
  token smuggling enables arbitrary command execution"
description: "GitPython's `check_unsafe_options` guard (the control introduced by
  CVE-2026-42215 / GHSA-2f96 and hardened since) can be bypassed for **every** guarded
  method (`clone`/`clone_from`, `fetch`/`pull`/`push`, `ls_remote`, `iter_commits`,
  `blame`, `archive`) by smuggling an option token inside the VALUE of a single-character
  kwarg. In the default `allow_unsafe_options=False` configuration this yields arbitrary
  command execution via `--upload-pack`."
