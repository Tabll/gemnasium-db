title: "GitPython: Arbitrary file read via --pathspec-from-file in IndexFile.remove()
  and Head.checkout()"
description: "`IndexFile.remove()` and `Head.checkout()` forward `**kwargs` into `git
  rm` and `git checkout`\nwith no guard. Passing `--pathspec-from-file=<file>` **together
  with `--pathspec-file-nul`**\nmakes Git treat the whole file as a single NUL-delimited
  pathspec, and the unmatched-pathspec\nerror quotes it verbatim. GitPython surfaces
  that through `GitCommandError.stderr`, so the\nentire contents of a caller-chosen
  file are returned to the caller in band.\n\nThis is the same primitive as Instance
  2 of\n[GHSA-3f7w-8rr8-f37f](https://github.com/advisories/GHSA-3f7w-8rr8-f37f) -
  `TagReference.create()`\nwith `-F`, arbitrary file read returned in band - at two
  sites that advisory assessed and\ncleared."
