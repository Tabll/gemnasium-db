title: "GitPython: Unsafe git option guard bypass via split_single_char_options=False
  short-option token smuggling enables command execution"
description: "The `check_unsafe_options` guard can be bypassed on every guarded method
  (clone/clone_from, fetch/pull/push, ls_remote, iter_commits, blame, archive) by
  combining a single-character kwarg with `split_single_char_options=False`. The guard's
  candidate list omits the smuggled option, but `transform_kwarg` emits a JOINED `-n<value>`
  argv token that git parses as `--upload-pack=<cmd>`, yielding arbitrary command
  execution at the default `allow_unsafe_options=False`. This is an incomplete-fix
  bypass of commit `e8d0fbf7` (the fix for GHSA-r9mr-m37c-5fr3), which only emits
  value-derived candidates when `split_single_char_options` is True."
