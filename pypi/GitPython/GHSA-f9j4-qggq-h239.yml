package_slug: "pypi/GitPython"
title: "GitPython Remote.pull() refspec bypasses the --upload-pack unsafe-option guard,
  enabling arbitrary command execution"
description: "`Remote.pull()` in GitPython forwards its positional `refspec` argument
  directly to the `git pull` child process while its unsafe-option guard inspects
  only keyword arguments. An application that passes attacker-influenced data as the
  `refspec` (for example a user-supplied branch or refspec parameter in a web or CI
  service) can supply an option-shaped value such as `--upload-pack=<command>`. The
  value bypasses the `unsafe_git_pull_options` check, is placed after the `--` separator
  on the `git pull` command line, and is executed as the upload-pack program for local-path
  or SSH transports. This yields arbitrary command execution with the privileges of
  the calling process using the documented default arguments (`allow_unsafe_options=False`)."
