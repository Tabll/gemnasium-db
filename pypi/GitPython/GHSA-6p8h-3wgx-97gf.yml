title: "GitPython: Incomplete unsafe_git_clone_options denylist omits --template enabling
  arbitrary command execution via clone hooks"
description: "GitPython's `unsafe_git_clone_options` denylist omits `--template`.
  `git clone --template=<dir>` copies `<dir>/hooks/` into the new repository and runs
  them (`post-checkout` fires during clone), so a caller who can influence clone options
  can achieve arbitrary command execution in the default `allow_unsafe_options=False`
  configuration."
