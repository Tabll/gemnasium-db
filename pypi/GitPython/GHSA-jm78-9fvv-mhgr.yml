title: "GitPython: git-config OPTION-name injection via =/#/whitespace bypasses name
  validator, enabling forged core.sshCommand/hooksPath (RCE)"
description: "GitPython's config-name validator only neutralizes CR/LF/NUL for the
  `\"option\"` label; it does not reject `=`, `#`, `;`, `[`, `]`, or whitespace in
  an **option name**. `write_section` writes the option name verbatim into the config
  file, so an option name such as `sshCommand = touch <cmd> #` is written as `\\tsshCommand
  = touch <cmd> # = <value>`, which git parses as `core.sshCommand = touch <cmd>`
  (the trailing `#` comments out the intended value). This forges arbitrary config
  directives (`core.sshCommand`, `core.hooksPath`, `alias.*`) → RCE on the next git
  operation. This is a distinct field (option name, not section name) and distinct
  character class (`=`/`#`/space, not newline/bracket) from GHSA-3rp5-jjmw-4wv2 (section-name
  bracket injection) and GHSA-mv93-w799-cj2w / GHSA-v87r-6q3f-2j67 (newline injection)."
