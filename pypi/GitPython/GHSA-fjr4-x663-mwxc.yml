package_slug: "pypi/GitPython"
title: "GitPython: Arbitrary file overwrite via git diff --output argument injection
  in Diffable.diff (key- and value-controlled)"
description: "`Diffable.diff()` forwards `**kwargs` straight into `diff`/`diff_tree`
  with **no** `check_unsafe_options` guard. `Diffable` is mixed into `Commit`, `Tree`,
  `IndexFile`, and `Submodule`, giving a broad surface. `git diff --output=<path>`
  writes real patch content to an attacker-chosen path, enabling arbitrary file overwrite."
