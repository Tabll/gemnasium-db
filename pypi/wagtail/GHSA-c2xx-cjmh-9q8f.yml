title: "Wagtail: Improper restriction handling on descendant collections in Documents
  and Images API"
description: "The Documents and Images [API V2](https://docs.wagtail.org/en/stable/advanced_topics/api/index.html)
  incorrectly listed items in descendants of private collections, which should inherit
  the view restrictions defined on their ancestors. A user with access to the API
  could see the filename and name of documents and images in these descendant collections."
