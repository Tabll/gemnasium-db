package_slug: "pypi/wagtail"
title: "Wagtail: Identification of documents by SHA1 hash"
description: "By passing specific HTTP headers to the document serve URL endpoint,
  an attacker was able to determine whether a document with a given ID matched a specified
  SHA1 hash, regardless of any permission restrictions on the document or knowing
  its filename. This could allow an attacker to determine whether a document with
  a specific known hash is present in the Wagtail document library.\n\nThis vulnerability
  does not expose the document's contents or any metadata beyond the already known
  SHA1 hash, and does not expose information about any documents for which the attacker
  does not know the SHA1 hash."
