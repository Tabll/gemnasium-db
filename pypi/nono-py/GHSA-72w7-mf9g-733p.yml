package_slug: "pypi/nono-py"
title: "nono-py has proxy-only network fallback bypass on older Linux kernels"
description: "On Linux kernels that do not support Landlock network rules, `nono_py.sandboxed_exec()`
  could run `CapabilitySet.proxy_only(proxy)` without supervising the seccomp-notify
  proxy-only fallback returned by the Rust core.\n\nIn that configuration, a sandboxed
  child process could remove `HTTP_PROXY` / `HTTPS_PROXY` environment variables or
  use raw sockets and then open direct TCP connections that should have been denied
  by proxy-only policy.\n\nThe issue affects proxy-only enforcement. It does not mean
  that all nono-py network blocking is ineffective. ECS validation showed `caps.block_network()`
  denied regular TCP and ECS metadata TCP on the tested Linux 6.1 host."
