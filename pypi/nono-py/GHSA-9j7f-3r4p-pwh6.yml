title: "nono-py vulnerable to authorization bypass / policy confusion"
description: "The python API made a restrictive-looking configuration unsafe by default.
  A caller could configure only reverse-\nproxy credential routes, put the child in
  CapabilitySet.proxy_only, and reasonably expect network access to be limited\nto
  those routes. Instead, because empty allowed_hosts meant allow-all inside nono-proxy,
  the child could use the local\nproxy as a transparent CONNECT tunnel to non-route
  nominated hosts (not including metadata endpoints).\n\nThat is an authorization
  bypass / policy confusion issue:\n\n- Intended policy: route-only proxy access.\n-
  Actual policy: route-only plus arbitrary transparent CONNECT.\n- Boundary crossed:
  sandboxed child gains broader outbound network reach than the Python policy appears
  to grant.\n- Impact depends on environment, but it can allow exfiltration or access
  to unintended internet/internal services\nthrough the unsandboxed proxy.\n\nThis
  should be classified as medium severity by default, potentially high if users rely
  on route-only configs for strict egress\ncontrol around untrusted code or sensitive
  credentials. The fix is security-relevant because it changes the default from\nimplicit
  allow-all to explicit opt-in."
