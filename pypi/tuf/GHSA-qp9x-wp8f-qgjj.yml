package_slug: "pypi/tuf"
title: "tuf has platform-dependent delegation path matching"
description: "`DelegatedRole._is_target_in_pathpattern` uses `fnmatch.fnmatch` to
  decide whether a given target path is authorized by a delegation's glob pattern.\n\nPython's
  `fnmatch.fnmatch` calls `os.path.normcase()` on both arguments before matching.
  On POSIX hosts `normcase` is the identity function; on Windows hosts `os.path` resolves
  to `ntpath`, whose `normcase` lowercases its input and replaces `/` with `\\`.\n\nAs
  a result, python-tuf's delegation *path pattern* matching is case-sensitive on Linux/macOS
  but case-INSENSITIVE on Windows. This makes the authorization decision for a target
  dependent on the host operating system of the client running the updater.\n\nThe
  result on Windows is a TUF specification violation in the python-tuf `ngclient`
  implementation."
