description: "The HTML and RSS output handlers in `dosagelib/events.py` write user-controlled
  content (comic text and page URLs) directly into generated files without proper
  HTML escaping. When a user scrapes a malicious webcomic and opens the generated
  HTML/RSS file, attacker-controlled JavaScript can execute in their browser.\n\n**CWE**:
  [CWE-79](https://cwe.mitre.org/data/definitions/79.html) - Improper Neutralization
  of Input During Web Page Generation (Cross-site Scripting)\n\n---"
