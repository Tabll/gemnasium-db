title: "AIIR verification and policy gates could report success without enforcing
  the control (fail-open)"
description: "Several of AIIR's verification and policy paths could return a success/\"verified\"
  result without actually enforcing the control they represent — they could **fail
  open** rather than fail closed. For a tool whose purpose is trustworthy verification,
  a consumer relying on these gates may have treated unverified or non-conforming
  input as verified.\n\nFound during an internal adversarial hardening review of AIIR
  (not a third-party audit). All paths are fixed in **1.7.0**."
