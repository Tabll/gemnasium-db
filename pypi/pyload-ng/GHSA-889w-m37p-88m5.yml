package_slug: "pypi/pyload-ng"
title: "pyLoad: Api.set_user_permission never invalidates the target's session"
description: "An admin who revokes or downgrades a non-admin user's permissions through
  pyLoad's own documented\n`/api/<func>` RPC surface — e.g. `POST /api/set_user_permission`
  (or its legacy alias\n`/api/setUserPermission`) — updates the target's database
  row but never invalidates that user's\nexisting Flask cookie session. The demoted
  user keeps their pre-revocation `role`/`permission` bits\non every subsequent WebUI
  page load and every subsequent `/api/<func>` call made with that cookie,\nfor up
  to the default `session_lifetime` of ~31 days, or until they voluntarily log out.
  No action\nby the demoted user is required beyond already being logged in at the
  time of revocation."
