title: "pyLoad: Tar extraction creates device nodes and FIFOs (member types not filtered;
  tarfile extractall without filter=)"
description: "`UnTar._safe_extractall` — the hardening added for GHSA-mvwx-582f-56r7
  — validates member\n**names** and symlink/hardlink **targets**, but never checks
  member **types**, and calls\n`tarfile.extractall` without a `filter=`. On Python
  < 3.14 the default extraction filter is\n`fully_trusted`, so a crafted tar containing
  device or FIFO entries makes pyLoad create\nthem on disk. When pyLoad runs as root
  (the official Docker deployment), a block-device\nmember grants raw disk access
  — full host compromise — reachable by any low-privileged user\nwho can trigger archive
  extraction (ADD to supply an archive, STATUS to invoke\n`ExtractArchive.extract_package`)."
