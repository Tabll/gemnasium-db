package_slug: "pypi/pyload-ng"
title: "pyLoad: Rate-Limit Bypass and Audit-Log Spoofing via Trusted Client-Controlled
  `X-Forwarded-For` Header"
description: "pyLoad determines the \"client IP\" used for its rate-limiting decorator
  and for its\nsecurity/audit logging by reading the client-supplied `X-Forwarded-For`
  (XFF) HTTP header and\ntaking the leftmost value. No trusted-proxy configuration
  exists (the Cheroot WSGI server faces\nclients directly, and there is no `ProxyFix`
  middleware). Because any client can freely set this\nheader, an attacker can (1)
  completely bypass rate limiting by rotating the header on each request,\nand (2)
  forge the source IP recorded in security logs for login and API-key authentication\nfailures,
  defeating IP-based blocking (e.g. fail2ban) and poisoning attribution."
