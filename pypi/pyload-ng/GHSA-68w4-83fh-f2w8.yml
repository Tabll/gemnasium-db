package_slug: "pypi/pyload-ng"
title: "pyload-ng: getUserData/get_userdata exposed at Perms.ANY allow any authenticated
  account to brute-force the administrator password"
description: "`Api.getUserData` (legacy) and `Api.get_userdata` are declared with
  `@permission(Perms.ANY)` and are reachable at `/api/getUserData` and `/api/get_userdata`.
  Because `Perms.ANY == 0` and pyLoad's permission check is a bitmask AND, that gate
  is a no-op: **every authenticated account passes, including one holding zero permission
  bits.**\n\nBoth methods are thin wrappers around `check_auth()`, which the maintainers
  deliberately restricted to administrators by omitting `@permission` (no entry in
  `perm_map`, so `is_authorized()` returns `False` for non-admins). The wrappers undo
  that protection.\n\nAn attacker holding the lowest-privileged account in the system
  therefore has a clean binary oracle on the **administrator password**, with no account
  lockout anywhere in the codebase, and with the 100 req/min rate limiter bypassable
  by rotating `X-Forwarded-For`."
