title: "Vibe-Trading file-read tools expose arbitrary server-readable files"
description: "2 findings — `safe_user_path()` accepts any path under `Path.home()`
  or `Path.cwd()`, which inside the shipped root container resolves to `/root` and
  `/app` (so all of root's home, including `/root/.ssh/id_rsa`, `/root/.aws/credentials`,
  `/root/.kube/config`, and `/app/agent/.env`, passes the check) (F9). `read_document()`
  has no sandbox call at all and returns the full content of any path the FastAPI
  process can read, including `/etc/shadow`, `/etc/passwd`, `/proc/self/environ`,
  and any secret file mounted into the container (F10). F10 is strictly broader than
  F9 but they have different fix scopes (F10 = a missing `safe_path()` call in one
  function; F9 = the envelope definition in `path_utils.py`), so both must be patched.\n\n---"
