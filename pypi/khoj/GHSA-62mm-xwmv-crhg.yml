package_slug: "pypi/khoj"
title: "khoj has an unauthenticated path traversal in /home/ endpoint that allows
  file read from server filesystem"
description: "The `/home/{file_path:path}` endpoint in `web_client.py` serves static
  files by directly concatenating the user-supplied `file_path` with the `home_directory`
  constant. There is no path traversal filtering, no path normalization check, and
  no authentication required. An attacker can use `../` sequences to read arbitrary
  files from the server filesystem."
