title: "gmaps-mcp's unauthenticated HTTP transport allows unlimited Google Maps API
  calls at operator expense"
description: "## Unauthenticated HTTP Transport Allows Unlimited Google Maps API Calls
  at Operator Expense\n\nThe `gmaps-mcp` codebase was reviewed at commit `e671db68c804c9e67d51582d3280839ffa65f127`
  and three issues worth flagging were discovered — one high-severity, one medium,
  one structural. There were no preexisiting CVEs for this package yet and the repository
  had no prior security issues.\n\nThe primary issue is that the HTTP transport in
  `server.py` skips authentication entirely when `MCP_API_KEY` is not set — which
  is the default, since `.env.example` ships the key as a blank value. Any unauthenticated
  caller who knows the server's public URL can invoke all six tools and generate live,
  billed Google Maps API requests against the operator's key. Because the README explicitly
  instructs operators to expose the server via ngrok (`ngrok http 8000`, then point
  MCP clients at the ngrok URL), this configuration gets deployed internet-facing
  as a matter of normal usage.\n\n**Affected files and exact lines:**\n\n`src/google_maps_mcp/server.py`,
  lines 186–192:\n```python\nexpected_key = os.getenv(\"MCP_API_KEY\")\n\nif not expected_key:\n
  \   # If no MCP_API_KEY is set, allow all requests (development mode)\n    return
  await call_next(request)\n\nif api_key != expected_key:\n    return JSONResponse(\n
  \       {\"error\": \"Invalid or missing API key. Provide X-API-Key header.\"},\n
  \       status_code=401\n    )\n```\n\n`run.py` lines 37 and 38 bind to `0.0.0.0:8000`
  by default (`MCP_HOST=0.0.0.0`, `MCP_PORT=8000`). No rate-limiting middleware exists
  anywhere in the codebase — not in the middleware stack, not in `GoogleMapsClient`,
  not in the tool handlers.\n\n**Attack model:** operator deploys with default config
  (blank `MCP_API_KEY`), exposes via ngrok per the README instructions, attacker discovers
  the ngrok URL through ngrok's public endpoint scan surface or via a targeted test
  of shared URLs. No credentials needed to call the server.\n\n**PoC — reproduces
  from the default config:**\n```bash\n# Start with default .env.example (MCP_API_KEY
  blank/unset)\nexport GOOGLE_MAPS_API_KEY=<operator_key>\npython run.py  # binds
  0.0.0.0:8000"
