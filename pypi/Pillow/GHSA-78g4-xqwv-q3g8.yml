title: "Pillow: Bundled libopenjp2 2.5.4 in all wheels since 11.1.0 carries OSV-2025-219
  heap-buffer-overflow write reachable from Image.open().load()"
description: "Every Pillow wheel from 11.1.0 onward bundles a libopenjp2 containing
  a heap-buffer-overflow **write** that is fixed upstream on master but has never
  appeared in an OpenJPEG release. See https://osv.dev/vulnerability/OSV-2025-219\n\nBecause
  the wheel bundles its own copy, a patched host OS does not help. It is reachable
  from `Image.open(fp); im.load()` with default settings.\n\nI am reporting it here
  rather than only upstream because Pillow is where the vulnerable binary actually
  reaches users.\n\nNote the inversion that makes this easy to miss: **OpenJPEG 2.5.2
  and earlier are safe.** The bug was introduced in `954c6e3c` (2024-06-25), so keeping
  the dependency current is what creates the exposure."
