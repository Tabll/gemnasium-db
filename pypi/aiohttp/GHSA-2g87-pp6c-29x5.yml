package_slug: "pypi/aiohttp"
title: "aiohttp: Multiple instances of excessive or unbounded memory/CPU use"
description: "While reassembling a WebSocket frame that arrived across many small
  transport reads, the reader kept one `bytes` object per read with no bound on the
  count. The per-object overhead is many times larger than the payload bytes, so a
  frame delivered a few bytes at a time could use far more memory than `max_msg_size`
  allows."
