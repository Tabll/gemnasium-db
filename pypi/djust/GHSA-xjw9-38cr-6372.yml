title: "djust: A template binding inherits a context safety grant it never earned
  (XSS)"
description: "A context safety grant was inherited by a template **binding** that
  never earned it, so rebinding a name the view had marked safe left the mark attached
  to the new, attacker-controlled value.\n\ndjust's context safety channel is keyed
  by **name**, not by value. Every bind copied the value and left the grant in place:\n\n```\nview
  marks   p = mark_safe('<b>trusted</b>')\ntemplate     {% with p=user_input %}{{
  p }}{% endwith %}\n\ndjust   '<img src=x onerror=alert(1)>'          <- executes\ndjango
  \ '&lt;img src=x onerror=alert(1)&gt;'\n```"
