title: "djust: Six template-layer defects emit attacker-controlled markup unescaped
  (XSS)"
description: "Five independent defects in djust's template auto-escaping cause attacker-controlled
  input to be rendered as live markup where Django escapes it. All four are present
  in shipped 1.1.0 and are fixed in 1.1.1.\n\nThey share one shape: **a filter or
  grant that escapes nothing itself and relies on the render-time auto-escape, which
  something downstream then removes.** They are grouped into a single advisory because
  the mitigation is identical — upgrade to 1.1.1 — and because no single one of them
  is meaningfully actionable in isolation."
