package_slug: "pypi/praisonaiagents"
title: "PraisonAI ToolsMCPServer legacy SSE transport accepts attacker Host/Origin
  and exposes registered tools"
description: "`praisonaiagents.mcp.ToolsMCPServer.run_sse()` builds a Starlette MCP\nHTTP+SSE
  server around `mcp.server.sse.SseServerTransport`. The server exposes\n`/sse` and
  `/messages/`, but it does not validate `Origin`, does not validate\n`Host`, and
  does not require any authentication.\n\nThis is reachable through supported PraisonAI
  code paths that wrap configured\nMCP server tools and re-expose them over legacy
  SSE:\n\n- `praisonai mcp run <name> --transport sse`\n- `praisonai serve mcp --name
  <name> --transport sse`\n- direct use of `ToolsMCPServer(...).run_sse(...)` or\n`launch_tools_mcp_server(...,
  transport=\"sse\")`\n\nA malicious website can use DNS rebinding against a local
  or internal\nPraisonAI SSE MCP server and send requests with attacker-controlled
  `Host` and\n`Origin` headers. The local PoV binds only to `127.0.0.1`, sends an
  attacker\n`Host` and `Origin`, lists the registered tool, and invokes it successfully.\n\nThe
  same attacker `Origin` is rejected by PraisonAI's current Streamable HTTP\ntransport
  with HTTP 403. The vulnerability is therefore a sibling transport\nguard gap in
  the legacy SSE wrapper, not intended behavior."
