package_slug: "pypi/praisonaiagents"
title: "PraisonAI: IMAP Command Injection via Unsanitized Email Search Parameters"
description: "The email search tool in `src/praisonai-agents/praisonaiagents/tools/email_tools.py`
  constructs IMAP SEARCH commands by interpolating LLM-controlled parameters (from_addr,
  subject, query) directly into IMAP protocol strings using f-string formatting with
  double-quote delimiters. An attacker who can influence the arguments to the `search_emails`
  or `reply_email` tool (via crafted agent prompts) can inject arbitrary IMAP commands,
  potentially exfiltrating email data from other folders, deleting emails, or performing
  other unauthorized IMAP operations."
