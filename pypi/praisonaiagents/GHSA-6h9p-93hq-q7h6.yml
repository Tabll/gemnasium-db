title: "PraisonAI: SpiderTools redirect-target SSRF protection bypass"
description: "`SpiderTools.scrape_page()` validates the initial URL and rejects direct\nloopback,
  private, link-local, metadata, and internal hostnames. It then calls\n`requests.Session.get()`
  without disabling automatic redirects or validating\nredirect `Location` targets.\n\nRequests
  follows redirects by default for GET requests. A safe-looking public\nURL can therefore
  pass `_validate_url()`, redirect to a blocked target such as\n`127.0.0.1` or `169.254.169.254`,
  and have the redirected response body parsed\nand returned by `scrape_page()`.\n\nThe
  same sink is used by `extract_links()`, `crawl()`, and `extract_text()`\nthrough
  their calls to `scrape_page()`."
