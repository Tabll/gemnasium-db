package_slug: "pypi/praisonaiagents"
title: "PraisonAI: Unauthenticated Event Injection via SSE `/publish` Endpoint"
description: "The SSE (Server-Sent Events) server in `src/praisonai-agents/praisonaiagents/server/server.py`
  exposes a `/publish` endpoint that broadcasts arbitrary messages to all connected
  clients without any authentication. The `ServerConfig` dataclass (line 24) defines
  an `auth_token` field, but this token is never validated in the `/publish` or `/events`
  request handlers. Any attacker with access to the SSE server port can inject arbitrary
  events into the SSE stream visible to all connected clients, or use `/info` to leak
  server configuration including connected client count."
