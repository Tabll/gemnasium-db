title: "PraisonAI: Unauthenticated RCE via Jobs API + Approval Bypass "
description: "An unauthenticated attacker can execute arbitrary OS commands on any
  server running\nthe PraisonAI Jobs API by submitting a crafted workflow YAML. The
  attack chains two\nweaknesses: the `/api/v1/runs` endpoint requires no credentials,
  and a top-level\n`approve` field in the submitted YAML unconditionally bypasses
  the\n`@require_approval` safety decorator on dangerous tools such as `execute_command`.\n\n**Ecosystem:**
  pip | **Package:** `praisonai` | **Affected:** `<= 4.6.48` | **Patched:** *(none)*\n\n---"
