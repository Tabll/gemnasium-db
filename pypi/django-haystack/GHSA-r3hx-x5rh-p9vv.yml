package_slug: "pypi/django-haystack"
title: "django-haystack: Remote Code Execution via `eval()` in Elasticsearch Result
  Deserialization"
description: "The Elasticsearch backend in django-haystack calls `eval()` on raw field
  values returned from Elasticsearch when a `SearchField` is declared with an `index_fieldname`
  alias that differs from the logical field name. During result processing, the backend
  looks up fields by logical name but Elasticsearch stores them under the alias key;
  the lookup fails and the value falls through to `_to_python()` → `eval()`. An attacker
  who can control content that is indexed into Elasticsearch—and can trigger or wait
  for a search that returns it—achieves arbitrary code execution in the Django application
  process. CVSS 3.1 Base Score: **8.5 (High)**."
