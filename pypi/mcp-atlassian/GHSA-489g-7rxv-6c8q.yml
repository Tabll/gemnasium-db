title: "MCP Atlassian: DNS-rebinding TOCTOU bypass of the SSRF fix (CVE-2026-27826)"
description: "GHSA-7r34-79r5-rcc9's fix added `validate_url_for_ssrf`, which resolves
  the attacker-controlled `X-Atlassian-{Jira,Confluence}-Url` header host **once at
  middleware time** and trusts the result. But the outbound request is later built
  with the **raw hostname** and **re-resolves at connect time with no IP pinning**.
  An attacker-controlled rebinding DNS name returns a public IP on the guard's lookup
  (validation passes) and `169.254.169.254` / an internal IP on the request's lookup
  (the socket connects there) → unauthenticated SSRF to cloud metadata / internal
  services on the **patched** build."
