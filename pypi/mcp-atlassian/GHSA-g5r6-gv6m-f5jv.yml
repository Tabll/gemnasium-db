title: "mcp-atlassian: Arbitrary file read via missing path validation in confluence_upload_attachment"
description: "`confluence_upload_attachment` passes `file_path` directly to `open(file_path,
  \"rb\")` with no path validation. Any authenticated MCP client — or an AI agent
  manipulated via prompt injection — can read any file the server process can access
  and exfiltrate it to Confluence as an attachment."
