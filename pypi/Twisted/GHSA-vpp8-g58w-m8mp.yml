package_slug: "pypi/Twisted"
title: "Twisted: Unauthenticated Remote Denial of Service in the Twisted HTTP/2 Server
  via Rapid Stream Reset"
description: "An uncontrolled-resource-consumption vulnerability (CWE-400) in the
  Twisted HTTP/2 server lets any unauthenticated remote client exhaust server CPU
  over a single connection. A client that sends a request header block with `END_STREAM`
  and then immediately resets the stream makes the server route and render the request
  before it processes the reset. Reset streams are freed and never count against the
  concurrent-stream limit, and no reset-rate limiter exists, so the pattern can be
  repeated at line rate on one connection. This is the HTTP/2 Rapid Reset class, CVE-2023-44487."
