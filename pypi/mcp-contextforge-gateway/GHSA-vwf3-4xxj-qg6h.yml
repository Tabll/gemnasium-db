package_slug: "pypi/mcp-contextforge-gateway"
title: "mcp-contextforge-gateway has Server-Side Template Injection (SSTI) leading
  to Remote Code Execution in `PromptService._render_template` via unsandboxed Jinja2
  Environment"
description: "`mcpgateway.services.prompt_service.PromptService` renders user-supplied
  prompt templates using Jinja2's plain `Environment()` rather than `SandboxedEnvironment`.
  An authenticated user with permission to register or update prompt templates can
  store a malicious template that, on subsequent rendering, executes arbitrary Python
  code on the gateway host with the privileges of the gateway process. This is a Server-Side
  Template Injection (SSTI) vulnerability leading to Remote Code Execution."
