title: "wger: trainer_login open redirect - ?next= parameter not validated against
  host"
description: "The `trainer_login` view in wger redirects to `request.GET['next']`
  directly via `HttpResponseRedirect()` without calling `url_has_allowed_host_and_scheme()`.
  After the trainer successfully enters impersonation mode, their browser is redirected
  to any attacker-controlled URL supplied in the `?next=` parameter, enabling Referer
  exfiltration and phishing."
