package_slug: "pypi/wger"
title: "wger: CSV/TSV formula injection in gym member export (first_name/last_name)"
description: "The gym member TSV export endpoint in wger writes `first_name` and `last_name`
  profile fields verbatim to TSV cells with no formula-prefix sanitization. Any gym
  member (including newly self-registered users) can pre-load a spreadsheet formula
  into their own profile. When a gym admin later exports the member list and opens
  the file in Excel, LibreOffice Calc, or Google Sheets, the formula executes in the
  admin's local spreadsheet context — enabling data exfiltration and, on legacy Excel
  with DDE enabled, arbitrary local code execution."
