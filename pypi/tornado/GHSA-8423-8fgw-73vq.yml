title: "tornado: multipart split() creates huge temp list before max_parts check ->
  memory amplification DoS (httputil.py:34)"
description: "`parse_multipart_form_data` (httputil.py:34) calls\n`data.split(b\"--\"+boundary+b\"\\r\\n\")`
  **before** the `max_parts` check (:35).\nA 600KB body with 100k parts creates a
  100k-element transient list first,\nthen rejects   transient memory amplification
  (each split element is a copy).\nPre-auth HTTP DoS."
