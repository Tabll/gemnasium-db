title: "Tornado: Incomplete fix for CVE-2026-35536: cookie attribute injection re-opened
  via the legacy case-insensitive `**kwargs` path in `set_cookie`"
description: "The CVE-2026-35536 fix added a validation loop that rejects `[\\x00-\\x20\\x3b\\x7f]`,
  but only for the\nhardcoded **lowercase** keys `name`/`domain`/`path`/`samesite`.
  The still-live deprecated `**kwargs` path\nwrites attacker-supplied attribute values
  straight into the `Morsel` with no validation, and because\n`Morsel.__setitem__`
  is case-insensitive, a capitalized kwarg (`Domain=`, `Path=`, `SameSite=`, `Max-Age=`)\nroutes
  to the same reserved attribute while bypassing the loop — re-opening `;`-delimited
  attribute injection.\n\n```python\nself.set_cookie(\"sid\", \"abc\", Domain=\"evil.com;
  Secure; SameSite=None\")"
