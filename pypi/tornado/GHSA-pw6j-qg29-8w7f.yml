title: "Tornado: CurlAsyncHTTPClient leaks per-request credentials on handle reuse"
description: "`CurlAsyncHTTPClient` pools and reuses `pycurl` handles across requests
  but does\nnot reset them between requests, and several per-request options are applied
  with\nno clearing branch. As a result, sensitive state set by one request persists
  onto\na later request on the same client that does not set it. Two credential vectors\nare
  demonstrated below — a client TLS certificate (`SSLCERT`/`SSLKEY`) and proxy\nbasic-auth
  credentials (`PROXYUSERPWD`) — both leaking to a different,\nunintended host. This
  affects all released versions through 6.5.6."
