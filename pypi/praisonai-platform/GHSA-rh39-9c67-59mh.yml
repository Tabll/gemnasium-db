description: "A workspace member can permanently delete any resource — projects, agents,
  issues, labels, issue dependencies, and issue-label attachments — created by the
  workspace owner or other members. All six content DELETE endpoints enforce workspace
  membership but perform no ownership or role check. A single malicious or compromised
  member account can wipe an entire workspace's content irreversibly."
