title: "praisonai-platform: default JWT signing secret 'dev-secret-change-me' enables
  token forgery"
description: "This is the familiar default-secret shape — a hardcoded fallback used
  to sign authentication tokens — with the additional twist that this one has a guard
  the author *intended* to catch the misconfiguration but whose polarity is wrong.
  Every route in `praisonai_platform.api.app:create_app` is authenticated via Bearer
  JWT, and every Bearer JWT is signed and verified with the public default secret.
  An unauthenticated network-adjacent attacker mints a token carrying any user-id
  (and any e-mail, name, etc.) they like, and the platform server treats them as that
  user.\n\nWorkspace authorisation (`require_workspace_member` in `deps.py`) then
  checks the forged user is a member of the requested workspace; if the attacker mints
  a token with `sub` equal to a known member's id, they bypass that check too. In
  default deployments, workspace IDs and member IDs are exposed via the activity and
  labels endpoints to any authenticated client — including the attacker's own forged
  token."
