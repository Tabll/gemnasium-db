title: "ouroboros-ai: Incomplete fix of CVE-2026-47211: untrusted project .env can
  still reach RCE via omitted execution-routing keys"
description: "The CVE-2026-47211 fix (0.39.0) added `_UNTRUSTED_ENV_DENYLIST` to stop
  an untrusted project-directory `.env` from redirecting execution. The denylist was
  incomplete — several execution-routing keys of the same RCE class were omitted,
  so a malicious cloned repo can still reach arbitrary command execution by shipping
  a `.env` (auto-loaded at import, no review step):\n\n- **Backend config-home roots**
  `CODEX_HOME`, `OPENCODE_CONFIG`, `OPENCODE_CONFIG_DIR`, `XDG_CONFIG_HOME`: a spawned
  vendor CLI resolves its config from these. `CODEX_HOME=./.evil` + committed `./.evil/config.toml`
  redirects the nested Codex agent to attacker config — `mcp_servers.<name>.command/args`
  (RCE) and `approval_policy=\"never\"` / `sandbox_mode=\"danger-full-access\"` (silent
  removal of the human approval gate). (reported by matte1782)\n- **MCP bridge / plugin
  execution roster** `OUROBOROS_MCP_CONFIG` (the YAML's server `command`/`args` are
  spawned via stdio_client — RCE), `OUROBOROS_PLUGIN_LOCKFILE`, `OUROBOROS_PLUGIN_TRUST_ROOT`
  (redirect the installed-plugin roster / trust root so `ooo <name>` dispatches into
  attacker code). (reported by hackkim)\n- **SSRF guard toggle** `OUROBOROS_ALLOW_LOCAL_TRANSPORT`
  (re-enables loopback/private MCP transport targets).\n- **Instruction / capability
  roots** `OUROBOROS_AGENTS_DIR`, `COPILOT_CUSTOM_INSTRUCTIONS_DIRS` (replace spawned
  sub-agent role prompts), `OUROBOROS_RUNTIME_PROFILE` (backend selector), `OUROBOROS_TOOL_CAPABILITIES`
  (override YAML can lower a tool's `approval_class`, weakening the approval gate).\n\nAdditionally,
  the MCP bridge auto-loaded `./.ouroboros/mcp_servers.yaml` from the working directory
  (`create_bridge_from_env(cwd=Path.cwd())`), so running `ooo` inside a malicious
  repo spawned the committed roster's `command` — RCE with no `.env` at all. (cwd-branch
  noted by hackkim)"
