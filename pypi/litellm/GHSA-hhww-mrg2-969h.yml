title: "LiteLLM vulnerable to reflected XSS in /sso/debug/callback"
description: "The `/sso/debug/callback` endpoint reflected identity-provider-controlled
  fields into an inline `<script>` block via `json.dumps`, which escapes JSON string
  syntax but not HTML context characters such as `</script>`. An IdP-returned string
  field containing `</script>` (for example a user-editable display name) closed the
  script block and executed attacker JavaScript in the proxy's origin."
