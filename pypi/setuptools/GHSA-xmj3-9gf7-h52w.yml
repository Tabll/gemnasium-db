title: "setuptools: Windows path escape via namespace_packages.txt during legacy wheel
  installation  Description"
description: "On Windows, attacker-controlled content in a wheel's\n`.dist-info/namespace_packages.txt`
  can cause setuptools' legacy wheel\ninstallation path to create an `__init__.py`
  outside the requested\n`destination_eggdir`.\n\nThe attacker can influence the destination
  path, but not the contents of\nthe created file."
