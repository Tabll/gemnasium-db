package_slug: "pypi/nltk"
title: "NLTK: Quadratic CPU exhaustion in LegalitySyllableTokenizer.tokenize via unguarded
  onset reversal loop"
description: "`LegalitySyllableTokenizer.tokenize` in the NLTK tokenizer package contains
  an unguarded O(n^2) processing loop. When the method is called on a single token
  that consists of a long run of vowels (for example `\"a\" * n`), it consumes CPU
  time proportional to the square of the token length. An attacker who can supply
  an untrusted token to this public tokenizer API can force a single request to saturate
  one CPU core for a prolonged period, degrading availability of any service that
  syllabifies attacker-controlled text. No authentication, special configuration,
  or user interaction is required."
