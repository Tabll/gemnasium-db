package_slug: "pypi/jupyterlab"
title: "JupyterLab: Cross-site scripting (XSS) via crafted settings file (`overrides.json`)"
description: "JupyterLab 4.5+ allows notebook settings to be shared and applied through
  an `overrides.json` file using the `Import` button in the Settings Editor.\n\nCertain
  notebook display settings were not properly validated before being applied. As a
  result, a crafted settings file could contain hidden instructions that run as code
  inside JupyterLab when imported, instead of only changing a display preference.\n\nBecause
  importing a settings file appears harmless, a user could import a file shared by
  another party without realizing it could do more. On multi-tenant file systems without
  proper permission control, another user could plant a malicious `overrides.json`.\n\n>
  CVE assignment pending, GitHub CNA is experiencing severe backlog"
