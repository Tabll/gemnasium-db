title: "JupyterLab: Stored XSS in extension manager through package metadata unsanitized
  URI protocol"
description: "A malicious PyPI package can place a `javascript:` URL in its `[project.urls]`
  metadata. JupyterLab's Extension Manager renders this as the extension's home-page
  link without validating the protocol, so a user who clicks the extension name executes
  attacker-controlled JavaScript in the JupyterLab origin."
