title: "FastMCP: Post-transform component authorization is skipped on direct calls"
description: "FastMCP's direct component paths can return a transformed component
  before its applicable `AuthCheck`, allowing low-privilege callers to execute hidden
  protected behavior. I reproduced this against FastMCP 4.1.0 and commit `e2fcc412001ff7414095c5dc282f94c70299a612`
  using only an in-process FastMCP server. The attacker does not have server-side
  access and does not control FastMCP configuration."
