package_slug: "pypi/trapster"
title: "Trapster Community: Unauthenticated malformed DNS compression pointers crash
  per-packet honeypot handler"
description: "`trapster.libs.dns.decode_labels()` decodes DNS names from attacker-supplied
  UDP packets and recurses **once per RFC 1035 compression pointer** with **no cycle
  detection and no depth bound**. A single unauthenticated UDP datagram sent to the
  DNS honeypot drives the function past CPython's recursion limit, raising `RecursionError`.
  That exception is not handled anywhere on the `datagram_received` path, so it escapes
  into the asyncio event loop's default exception handler, the per-packet proxy task
  is never created, and a low-rate flood produces sustained CPU burn and log flooding
  (denial of service of the DNS honeypot module)."
