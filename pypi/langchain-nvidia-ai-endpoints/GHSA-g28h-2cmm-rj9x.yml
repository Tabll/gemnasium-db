title: "langchain-nvidia-ai-endpoints has local file disclosure through VLM image
  inputs"
description: "`langchain-nvidia-ai-endpoints` versions before 1.4.2 accepted local
  filesystem paths as image inputs for Vision Language Model (VLM) requests. If an
  application passed attacker-controlled image input to `ChatNVIDIA` or VLM reranking
  APIs, an attacker could cause files readable by the application process to be read
  and included in the outbound request to the configured NVIDIA/NIM model endpoint."
