title: "PraisonAI dynamic-context artifact tools read arbitrary host files outside
  artifact storage"
description: "PraisonAI's Dynamic Context Discovery feature exposes artifact helper
  tools\nthrough `ctx.get_tools()`:\n\n```python\nctx = setup_dynamic_context()\n\nagent
  = Agent(\ninstructions=\"You are a data analyst.\",\ntools=ctx.get_tools(),\nhooks=[ctx.get_middleware()],\n)\n```\n\nThe
  official documentation describes these helpers as a way for the agent to\nexplore
  large tool-output artifacts that were queued by the middleware:\n\n- large tool
  outputs are saved as artifacts;\n- the agent receives compact artifact references;
  and\n- the agent uses `artifact_tail` and `artifact_grep` to explore that data.\n\nThe
  implemented artifact tools do not enforce that the supplied\n`artifact_path` is
  an artifact created by the configured store or that it lives\nunder the configured
  artifact base directory. Instead, `artifact_head`,\n`artifact_tail`, `artifact_grep`,
  and `artifact_chunk` wrap the caller-supplied\npath directly into an `ArtifactRef`
  and then read it from the host filesystem.\n\nAs a result, any prompt/user/tool-caller
  that can influence those tool\narguments can read files readable by the PraisonAI
  process, such as project\n`.env` files, cloud credentials, SSH keys, source files,
  or other local data."
