title: "PraisonAI: HTTPApproval dashboard renders tool arguments as raw HTML, allowing
  approval-page XSS to approve dangerous tools"
description: "`praisonai.bots.HTTPApproval` renders pending tool approval arguments
  directly\ninto the approval dashboard HTML. An attacker-controlled tool argument
  can\ninject JavaScript into that page. When a human opens the approval URL to inspect\nthe
  risky tool request, the script runs in the dashboard origin and can POST to\nthe
  same request's `/approve/{request_id}/decide` endpoint, causing\n`HTTPApproval`
  to return `approved=True`.\n\nThe local PoV uses a harmless `touch /tmp/prai010
  #` command prefix and stops at\nthe approval decision. It does not execute the command."
