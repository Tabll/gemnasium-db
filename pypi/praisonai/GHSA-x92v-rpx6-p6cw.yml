title: "PraisonAI: Webhook signature verification skipped (fail-open) when secret
  unset, allowing forged inbound webhooks (WhatsApp & Linear bots)"
description: "The WhatsApp and Linear bot adapters verify the inbound webhook HMAC
  signature only\nwhen a secret is configured. When the secret environment variable
  is unset — the\ndefault on a fresh install and common in development — verification
  is skipped entirely\nand the webhook body is parsed and dispatched as a genuine,
  trusted event. A remote,\nunauthenticated attacker who can reach the bot's webhook
  endpoint can inject arbitrary\nplatform events.\n\nAffected code:\n\nWhatsApp -
  src/praisonai/praisonai/bots/whatsapp.py\n- __init__ (line 108): self._app_secret
  = app_secret or os.environ.get(\"WHATSAPP_APP_SECRET\", \"\")  -> defaults to \"\"\n-
  route (line 246): app.router.add_post(self._webhook_path, self._handle_webhook)
  \ -> default path \"/webhook\"\n- _handle_webhook (lines 585-595): `if self._app_secret:`
  gates the ENTIRE check; when falsy the body is\njson.loads()'d and dispatched to
  _process_webhook_data() with no verification.\n\nLinear - src/praisonai/praisonai/bots/linear.py\n-
  __init__ (line 86): self._signing_secret = signing_secret or os.environ.get(\"LINEAR_WEBHOOK_SECRET\",
  \"\")  -> \"\"\n- _handle_webhook (lines 244-248): same `if self._signing_secret:`
  fail-open guard.\n- start() (lines 169-170): only logs a warning; does not fail
  closed.\n\nThe _verify_signature implementations themselves are correct (constant-time
  HMAC-SHA256);\nthe defect is that verification is bypassed when the secret is absent.\n\nImpact:\n-
  WhatsApp: attacker POSTs a crafted Meta Cloud API payload spoofing any sender and
  message\ntext; injected into agent sessions and processed as a real user message
  (prompt injection,\nunauthorized agent/command invocation, contact impersonation).\n-
  Linear: attacker POSTs forged AgentSession / Comment events, causing the agent to
  act on and\ncomment on issues no legitimate event referenced.\nThe webhook routes
  require no other authentication, so exploitation needs only network\nreachability.\n\nProof
  of concept (bot started without the secret - the default):\n\ncurl -X POST http://VICTIM:PORT/webhook
  \\\n-H 'Content-Type: application/json' \\\n-d '{\"object\":\"whatsapp_business_account\",\"entry\":[{\"changes\":[{\"value\":\n{\"messages\":[{\"from\":\"15551234567\",\"id\":\"wamid.x\",\"type\":\"text\",\n\"text\":{\"body\":\"attacker-injected
  message\"}}]}}]}]}'"
