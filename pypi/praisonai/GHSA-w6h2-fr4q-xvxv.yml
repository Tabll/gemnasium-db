title: "PraisonAI: Compute-bridged file tools allow shell command injection"
description: "`LocalManagedAgent` / `SandboxedAgent` compute bridging wraps\n`read_file`,
  `list_files`, and `write_file` when a compute provider is\nattached. The bridge
  converts those file operations into shell command strings\nusing raw path arguments,
  then sends those strings to shell-backed compute\nproviders.\n\nAn attacker who
  can influence a file-tool path argument can break out of the\nquoted path and execute
  arbitrary shell commands in the compute environment.\nWith `compute=\"local\"`,
  commands execute through the local subprocess compute\nprovider on the host. With
  Docker, commands execute in the container."
