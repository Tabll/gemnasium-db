package_slug: "pypi/praisonai"
title: "PraisonAI recipe workflow policy can be bypassed by declaring and YAML-approving
  dangerous tools outside TEMPLATE.yaml"
description: "PraisonAI recipe execution has a dangerous-tool policy that is supposed
  to block default-denied tools unless the caller explicitly passes `allow_dangerous_tools=True`.
  That policy only checks tools declared in `TEMPLATE.yaml` `requires.tools`.\n\nFor
  steps-based recipes, the actual execution path loads `workflow.yaml` with `YAMLWorkflowParser`.
  That parser resolves agent-level `tools:` declarations and preserves top-level `approve:`.
  `Workflow.start()` then installs those YAML-approved tools into the approval context.\n\nAs
  a result, an untrusted recipe can omit `execute_command` from `TEMPLATE.yaml requires.tools`,
  declare it in `workflow.yaml agents.*.tools`, and add top-level `approve: [execute_command]`.
  The caller did not set `allow_dangerous_tools=True`, but the recipe policy allows
  the recipe and the workflow approval path self-approves the critical shell tool.\n\nThe
  local PoV uses a harmless `printf` canary and explicitly unsets `PRAISONAI_AUTO_APPROVE`."
