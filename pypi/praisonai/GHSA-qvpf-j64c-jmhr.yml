title: "PraisonAI Slack app_mention bypasses configured user/channel authorization"
description: "PraisonAI's Slack bot applies its configured `allowed_users`,\n`allowed_channels`,
  and unknown-user pairing policy in the normal Slack\n`message` event handler, but
  not in the adjacent Slack `app_mention` event\nhandler.\n\nA Slack workspace user
  who can mention the bot in a channel where the Slack app\nis present can trigger
  the configured PraisonAI agent even when:\n\n- the sender is not in `BotConfig.allowed_users`;\n-
  the channel is not in `BotConfig.allowed_channels`;\n- `unknown_user_policy=\"deny\"`
  is configured; and\n- the same event content is correctly dropped by the normal
  `message` handler.\n\nThis is a sibling-handler guard-coverage issue. Slack documents\n`app_mention`
  as a distinct event type rather than a `message.*` event, so\ndeployments subscribed
  to app mentions can route unauthorized sender input\naround the guarded message
  path."
