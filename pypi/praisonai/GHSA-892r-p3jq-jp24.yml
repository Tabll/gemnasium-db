title: "PraisonAI: AgentOS remains unauthenticated after incomplete fix version and
  allows remote agent invocation"
description: "PraisonAI's `AgentOS` FastAPI deployment surface remains unauthenticated
  in\ncurrent main and in releases after the published patched version for\n`GHSA-pm96-6xpr-978x`
  / `CVE-2026-40151`.\n\nThe public AgentOS advisory is published as an instruction-disclosure
  issue\nwith affected versions `< 4.5.128` and patched version `4.5.128`. However,\n`v4.5.128`,
  latest release `v4.6.57`, and current main still register\n`GET /api/agents` and
  `POST /api/chat` without authentication. The chat route\ndirectly calls `agent.chat(request.message)`.
  No-auth and wrong-bearer requests\nboth execute the deployed agent.\n\nThis is broader
  than passive metadata disclosure. In any deployment where\nAgentOS wraps agents
  with tools, private context, memory, API integrations, or\ncost-bearing model calls,
  an unauthenticated reachable client can drive those\nagents."
