title: "PraisonAI: Arbitrary File Read/Write via `multiedit` Tool Without Path Validation"
description: "The `multiedit` tool in `src/praisonai/praisonai/tools/multiedit.py`
  allows LLM-controlled arbitrary file read and write without any path validation,
  workspace boundary check, or protected path guard. This enables an attacker who
  can influence agent tool arguments (via crafted prompts, user input in chat bots,
  or malicious YAML workflow configs) to read sensitive files (e.g., `/etc/shadow`,
  `~/.ssh/id_rsa`, `~/.aws/credentials`) and overwrite arbitrary files on the filesystem."
