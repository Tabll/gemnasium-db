title: "PraisonAI Dynamic Context history and terminal tools read files outside configured
  storage via path traversal"
description: "PraisonAI's Dynamic Context module provides filesystem-backed history
  and\nterminal-log storage. The SDK reference describes the module as providing:\n\n-
  artifact storage for tool outputs, history, and terminal logs;\n- history persistence
  with search; and\n- terminal session logging.\n\nThe module also exports agent-callable
  tool factories:\n\n- `create_history_tools()` returns `history_search`, `history_tail`,
  and\n`history_get`.\n- `create_terminal_tools()` returns `terminal_tail`, `terminal_grep`,
  and\n`terminal_commands`.\n\nThose tools accept `run_id` and `agent_id` arguments
  from the tool caller. The\nunderlying stores join those values into filesystem paths
  without rejecting\nabsolute paths or `..` traversal:\n\n```python\nhistory_dir =
  self.base_dir / run_id / \"history\"\nreturn history_dir / f\"{agent_id}.jsonl\"\n```\n\n```python\nterminal_dir
  = self.base_dir / run_id / \"terminal\"\nreturn terminal_dir / f\"{agent_id}.log\"\n```\n\nBecause
  `run_id` can be an absolute path and `agent_id` can contain traversal,\na lower-trust
  prompt/user that can call these tools can read `.jsonl` and\n`.log` files outside
  the configured Dynamic Context base directory."
