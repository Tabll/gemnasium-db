title: "PraisonAI recipe serve Typer command bypasses the non-localhost authentication
  guard"
description: "PraisonAI's installed console entrypoint is Typer-first. In current
  releases,\nthe `recipe` command is registered in the Typer app and\n`praisonai recipe
  serve` dispatches to the deprecated Typer command in\n`src/praisonai/praisonai/cli/commands/recipe.py`.\n\nThat
  Typer command can start the Recipe HTTP server on a non-localhost\ninterface with
  no authentication:\n\n```text\npraisonai recipe serve --host 0.0.0.0 --admin\n```\n\nIt
  prints a deprecation warning, then launches the server with:\n\n```json\n{\n\"host\":
  \"0.0.0.0\",\n\"config\": {\n\"cors_origins\": \"*\",\n\"enable_admin\": true\n}\n}\n```\n\nBecause
  `config.auth` is absent, `create_app()` does not attach the API-key or\nJWT middleware.
  Unauthenticated requests can then reach the recipe API and, when\nenabled, `/admin/reload`.\n\nThis
  is an incomplete hardening / sibling-callsite issue. The legacy feature\nhandler
  in `src/praisonai/praisonai/cli/features/recipe.py` rejects the same\nnon-localhost/no-auth
  combination, and current `create_auth_middleware()` now\nfails closed if API-key/JWT
  auth is selected without a secret. The installed\nTyper command bypasses both expectations
  by never requiring or setting `auth`."
