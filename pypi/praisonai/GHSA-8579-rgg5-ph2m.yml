title: "PraisonAI DiscordApproval accepts unrelated channel messages as dangerous-tool
  approvals"
description: "`praisonai.bots.DiscordApproval` approves a pending dangerous tool call
  when it\nsees any later non-bot message in the configured Discord channel whose
  text is\nclassified as approval, such as `yes`.\n\nThe decision is not bound to:\n\n-
  a Discord reply to the approval message;\n- a Discord thread created for that request;\n-
  a Discord interaction/button callback for that request;\n- an explicit approver
  user allowlist; or\n- an approval nonce visible only to intended approvers.\n\nAs
  a result, any user who can post in the configured approval channel can\napprove
  a pending high-risk tool call by sending `yes` after the approval\nmessage appears.
  The same local PoV also shows that the Slack and Telegram\nmessaging approval backends
  have no explicit approver allowlist parameter, but\nthe primary report-grade issue
  is the Discord backend's unthreaded channel\ncross-talk: the approving message does
  not need to be a reply or otherwise\nrequest-bound."
