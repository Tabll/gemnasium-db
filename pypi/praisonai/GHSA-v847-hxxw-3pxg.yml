title: "PraisonAI recipe.run_stream skips dangerous-tool policy enforcement"
description: "PraisonAI recipe execution blocks default-denied dangerous tools unless
  the\ncaller explicitly passes `allow_dangerous_tools=True`. The normal `recipe.run()`\npath
  enforces this with `_check_tool_policy()`. The streaming path,\n`recipe.run_stream()`,
  loads the same recipe, checks dependencies, and then\ncalls `_execute_recipe()`
  without running the dangerous-tool policy check.\n\nAs a result, a recipe that honestly
  declares `execute_command` in\n`TEMPLATE.yaml requires.tools` is denied by `recipe.run()`,
  but reaches the\nexecution engine through `recipe.run_stream()` with\n`allow_dangerous_tools=False`.\n\nThe
  local PoV uses a harmless `printf` canary, explicitly unsets\n`PRAISONAI_AUTO_APPROVE`,
  and avoids network access."
