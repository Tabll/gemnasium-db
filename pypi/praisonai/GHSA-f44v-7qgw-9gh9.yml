title: "PraisonAI GitHub template cache path traversal allows outside-cache file write
  and directory deletion"
description: "PraisonAI's template loader accepts GitHub template URIs with refs,
  for example\n`github:owner/repo/template@v1.0.0`. The resolver stores the user-controlled\ntemplate
  path and ref verbatim, and the cache layer later joins those values into\n`~/.praison/cache/templates/github/<owner>/<repo>/<template>/<ref>`
  without\nnormalizing each segment or checking that the final path remains inside
  the\ntemplate cache root.\n\nA crafted ref such as `../../../../../../outside-delete-target`
  therefore\nescapes the cache directory. The first load can write `.cache_meta.json`
  outside\nthe cache. If the normal cache hierarchy for the same owner/repo/template
  has\nalready been created, the same path reaches `shutil.rmtree(cache_path)` and\nremoves
  an attacker-selected outside directory before replacing it with cache\nmetadata.\n\nThis
  is distinct from the old template Zip Slip advisory. No malicious archive\nmember
  is needed, and the PoV disables network access entirely. The bug is in\ncache-key
  construction for GitHub template URIs."
