title: "PraisonAI: Missing Authentication for Critical Function and Improper Neutralization
  of Special Elements used in an OS Command ('OS Command Injection') in praisonai"
description: "PraisonAI v4.6.48 exposes the PraisonAIUI MCP client management API
  through the default UI host apps without authentication. A remote unauthenticated
  client can send `POST /api/mcp/connect` with a `command` and `args` field. The endpoint
  passes those values into the MCP stdio client, which starts the attacker-selected
  local process as the PraisonAI UI service user.\n\nThe issue is reachable through
  PraisonAI's hosted UI integration (`praisonai ui`, `praisonai ui agents`, `praisonai
  claw`, and any app using `praisonai.integration.host_app.create_host_app()` / `build_host_app()`).
  `praisonai ui` and related Typer UI commands bind to `0.0.0.0` by default."
