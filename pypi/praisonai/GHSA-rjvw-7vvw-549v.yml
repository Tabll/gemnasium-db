title: "PraisonAI: Jobs webhook SSRF protection bypass via DNS rebinding"
description: "PraisonAI's Async Jobs API validates `webhook_url` when a job request
  is parsed\nand again when the internal `Job` object is constructed. That validation
  blocks\ndirect loopback/private targets, but it is not bound to the later network\nrequest.
  When a job completes, `_send_webhook()` passes the original hostname to\n`httpx.AsyncClient.post()`
  with no send-time validation, IP pinning, or guarded\ntransport.\n\nAn attacker-controlled
  hostname can therefore resolve to a public IP during\nPydantic validation and later
  resolve to loopback/private/cloud-metadata\ninfrastructure during webhook delivery.
  This bypasses the intended SSRF guard in\ncurrent supported releases.\n\nThis appears
  to be an incomplete fix / patch bypass for `GHSA-8frj-8q3m-xhgm`\n(\"Server-Side
  Request Forgery via Unvalidated webhook_url in Jobs API\"). I defer\nto maintainers
  on whether this should be a new advisory/CVE or an amendment to\nthe prior advisory,
  but current supported releases still appear affected."
