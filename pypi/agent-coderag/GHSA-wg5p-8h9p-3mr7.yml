package_slug: "pypi/agent-coderag"
title: "agent-coderag: Gradle Wrapper Execution During Dependency Discovery Enables
  Arbitrary Code Execution"
description: "`agent-coderag` unconditionally executes a repository-controlled `gradlew`
  script during its default `sync` dependency-discovery flow. An attacker who can
  induce a victim to index a malicious Gradle repository (one containing `build.gradle`
  and a crafted `gradlew`) achieves arbitrary code execution with the victim's OS
  privileges. No authentication, no extra flags, and no elevated permissions are required;
  the attack fires on the default `agent-coderag sync <path>` invocation."
