description: "**Denial-of-Service (DoS)** vulnerability in the Mistune Markdown parser.
  The issue occurs when processing specially crafted reference links, which can cause
  excessive parsing and CPU consumption, leading to application hangs.\n\n**Function
  affected:** parse_link_title() in helpers.py\n**Issue:** Malformed reference links
  cause excessive backtracking and parsing loops.\n**Impact:** Remote attackers can
  submit malicious Markdown to hang processes, causing service unavailability."
