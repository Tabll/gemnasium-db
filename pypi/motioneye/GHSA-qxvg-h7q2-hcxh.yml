title: "motionEye: LFI → pass‑the‑hash admin → unsafe restore → unauth action exec
  (RCE)"
description: "A multi‑stage chain in motionEye leads to remote code execution. The
  chain combines:\n\n1. **Arbitrary file read (LFI)** via the picture download endpoint
  for **local motion cameras** using absolute paths.\n2. **Pass‑the‑hash admin auth**
  due to accepting request signatures computed with password hashes.\n3. **Unsafe
  config restore** that extracts attacker‑controlled tarballs into `CONF_PATH`.\n4.
  **Unauthenticated action execution** via `/action/<id>/<action>`.\n\nIf the **normal
  user password is unset**, the chain becomes **unauthenticated RCE**. If a normal
  password exists, a **normal user** can still achieve **admin escalation and RCE**.\n\n---"
