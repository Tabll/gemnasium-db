title: "eduMFA: Incorrect InnoDB snapshot isolation possibly allows token reusage"
description: "For deployments using MySQL or MariaDB < 11.6.2 (or newer with innodb_snapshot_isolation=off)
  reusage of token values might be possible due to faulty transaction isolation inside
  the database. Exploiting this requires racing this transaction.\nAffected are all
  tokentypes whose values are only supposed to be used once, for example TOTP, HOTP
  and likely also WebAuthN."
