title: "Dulwich: Infinite Loop Denial of Service (DoS) in Packfile Object Resolution"
description: "A High-severity Denial of Service (DoS) vulnerability exists in the
  `Pack.resolve_object` method. When resolving an `OFS_DELTA` object, the resolver
  calculates the base offset using `base_offset = obj_offset - delta_offset`.\n\nIf
  a malicious packfile contains an `OFS_DELTA` object where `delta_offset` is `0`,
  the calculation `obj_offset - 0` resolves back to the current object's own offset.
  Because the implementation lacks a depth counter, a \"visited\" set, or an explicit
  rejection of `delta_offset == 0`, the resolver enters an infinite recursive loop,
  exhausting CPU resources and eventually crashing the process.\n\n**Vulnerable Code
  Breakdown (`dulwich/pack.py`):**\n```python\nelif obj_type == OFS_DELTA:\ndelta_offset
  = parse_pack_object_offset_at(...)\nbase_offset = obj_offset - delta_offset          #
  VULNERABILITY: Self-reference if delta_offset == 0\nbase_type, base_data = self.resolve_object(...)
  \ # VULNERABILITY: Infinite recursion\n```"
