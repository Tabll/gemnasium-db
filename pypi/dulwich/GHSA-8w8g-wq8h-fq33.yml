package_slug: "pypi/dulwich"
title: "Dulwich: Symlink write-through in checkout(paths=[]) via raw os.open bypasses
  all symlink protections"
description: "Dulwich's `porcelain.checkout(paths=[...])` code path writes files using
  raw `os.open(file_path, O_WRONLY|O_CREAT|O_TRUNC, mode)` followed by `f.write(obj.data)`.
  This code path does NOT call `build_file_from_blob()` at all, completely bypassing
  any symlink protections (including the unreleased d09f8af fix). `os.open` without
  `O_NOFOLLOW` follows symlinks at both the target file and intermediate directories,
  allowing arbitrary file writes."
