package_slug: "pypi/dulwich"
title: "Dulwich: Arbitrary File Write (RCE) on Windows via Unvalidated Drive Letters
  in Tree Paths"
description: "A High-severity Path Traversal vulnerability exists in Dulwich's checkout
  logic when running on Windows. The functions responsible for validating NTFS paths
  strictly reject `.git` variants, Alternate Data Streams (ADS), `git~1` short names,
  and reserved device names, but they completely fail to check for **DOS drive letter
  prefixes**.\n\nA malicious Git tree can contain an entry named `C:`. When Dulwich
  processes this tree on a Windows client, the string passes the `validate_path_element_ntfs`
  check. Later, `_tree_to_fs_path` passes this path to `os.path.join(root, b\"C:\\\\\\\\Users\\\\\\\\...\")`.\n\nOn
  Windows, if the second argument to `os.path.join` contains an absolute drive letter,
  the `root` path is completely discarded. As a result, Dulwich writes the repository
  file to the absolute path outside of the intended Git worktree.\n\nWhile the standard
  C `git` client explicitly blocks this via `has_dos_drive_prefix()` in `path.c`,
  Dulwich lacks this protection. Because Git trees are cross-platform, an attacker
  can author a malicious repository on Linux and wait for a Windows victim (or CI
  runner) to clone it."
