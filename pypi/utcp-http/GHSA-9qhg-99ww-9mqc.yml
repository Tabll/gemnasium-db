package_slug: "pypi/utcp-http"
title: "utcp-http SSRF: HTTP tool invocation follows redirects without re-validating
  the target"
description: "`HttpCommunicationProtocol.call_tool` validates only the pre-redirect
  tool URL, then issues the request with redirects enabled and never re-checks where
  it lands. A tool whose endpoint is an attacker-controlled public URL can therefore
  `302`-redirect the UTCP client into an internal service including the cloud metadata
  endpoint and the response body is returned to the tool caller. This is a working
  SSRF + internal-data-exfiltration primitive.\n\nThis is the redirect invariant of
  the SSRF class fixed in GHSA-39j6-4867-gg4w; that fix added an invocation-time URL
  check but left the redirect hop unguarded. This vector bypasses the GHSA-39j6-4867-gg4w
  mitigation via unvalidated redirects."
