package_slug: "pypi/langflow-base"
title: "Langflow: SSRF in URL-taking components (protection disabled by default /
  warn-only, not applied to RSS, SearXNG, Web Search, Home Assistant, Glean, Docling)"
description: "Before **Langflow 1.10.3**, several built-in components sent server-side
  HTTP requests to URLs the flow author controls, with no SSRF enforcement. An authenticated
  user who can build or run flows could make the Langflow server reach loopback, RFC
  1918 / private networks, link-local addresses and cloud metadata endpoints (for
  example `http://169.254.169.254/latest/meta-data/`), and in many cases read the
  response back through the component output.\n\nTwo things combined to cause this:\n\n1.
  **Protection disabled / warn-only.** The SSRF guard (`lfx/utils/ssrf_protection.py`,
  added in 1.7.0 by #10544) shipped with `ssrf_protection_enabled = False`, and its
  only caller, the **API Request** component, called `validate_url_for_ssrf(url, warn_only=True)`.
  So even with protection turned on, blocked URLs were only logged.\n2. **Inconsistent
  coverage.** Other components that take a user-supplied URL or base URL did not call
  the guard at all: RSS Reader, SearXNG, Web Search (fetching result / RSS URLs),
  Home Assistant, Glean Search and Docling Serve (remote).\n\nThe problem was fixed
  across several PRs and is fully fixed in **Langflow 1.10.3** (and 1.11.0+). With
  the default settings, outbound requests from these components are now validated
  after DNS resolution, pinned to the validated IP (to prevent DNS rebinding) and
  **blocked** when they target private, loopback, link-local or metadata addresses,
  unless the operator allowlists the host."
