title: "Zoo Design Studio: Recursive KCL parsing is vulnerable to denial-of-service"
description: "Feeding a KCL program that wraps an expression in deep, unnecessary
  parentheses triggers the parser’s recursive `expression` -> `unnecessarily_bracketed`
  -> `expression` path. With enough nesting, the call stack grows until it exceeds
  the process stack limit, causing a stack overflow."
