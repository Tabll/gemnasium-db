title: "ArcadeDB: Privilege escalation via reader role in /api/v1/command JS scripting
  language — arbitrary host file read"
description: "A user holding only `reader` (read-only) privileges on a single database
  could execute arbitrary JVM code by sending a `\"language\": \"js\"` command to
  the `POST /api/v1/command/{database}` HTTP endpoint, and use it to read arbitrary
  files on the host filesystem (e.g. `/etc/passwd`, configuration files), outside
  the scope of the database itself.\n\nTwo cooperating defects made this possible:\n\n1.
  **Missing authorization on the scripting path (CWE-863 / CWE-269).** Polyglot script
  execution (`js` and other GraalVM languages) never went through the database authorization
  checks applied to SQL/Cypher, so any authenticated principal - regardless of database
  role - could run scripts.\n2. **Sandbox whitelist bypass.** The GraalVM sandbox
  restricts direct class lookups to a configured `allowedPackages` list, but a script
  could reach arbitrary classes by reflecting off the bound `database` object: `database.getClass().getClassLoader().loadClass(\"java.io.File\")`.\n\nProcess
  creation was already blocked (`allowCreateProcess(false)`), so the confirmed impact
  is host **file read**, not OS command execution. Confidentiality: High. Integrity/Availability:
  None.\n\nThis is a distinct entry point and root cause from CVE-2026-44221, CVE-2026-54076
  and CVE-2026-54077, and is reproducible on builds that already contain those fixes."
