title: "http4k: BasicCookieStorage` (renamed `InsecureCookieStorage`) did not enforce
  RFC 6265 cookie scoping; new `DefaultCookieStorage` is now the default"
description: "The previous `BasicCookieStorage` did not enforce RFC 6265 scoping rules
  around cookie domain, path, and `Secure` attribute. A client using a single storage
  instance to talk to multiple origins could have cookies leak across domains, or
  have `Secure` cookies sent over plain HTTP — the deprecation message states it bluntly:
  *\"BasicCookieStorage has no domain/path/scheme scoping and leaks cookies across
  origins. Use DefaultCookieStorage instead.\"*\n\n**Who is affected:** any client
  using `BasicCookieStorage` directly with cookies for more than one origin or scheme.
  Single-origin uses are unaffected."
