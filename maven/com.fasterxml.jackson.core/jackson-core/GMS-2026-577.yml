package_slug: "maven/com.fasterxml.jackson.core/jackson-core"
title: "Jackson Core: Document length constraint bypass in blocking, async, and DataInput
  parsers"
description: "Jackson Core does not consistently enforce `StreamReadConstraints.maxDocumentLength`.
  Oversized JSON documents can be accepted without a `StreamConstraintsException`
  in multiple parser entry points, which allows configured size limits to be bypassed
  and weakens denial-of-service protections. This advisory tracks the backport of
  GHSA-2m67-wjpj-xhg9 to the 2.18.x and 2.21.x release lines."
