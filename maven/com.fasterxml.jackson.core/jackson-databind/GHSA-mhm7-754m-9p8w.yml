title: "jackson-databind: `@JsonView` bypass for creator properties with `@JsonTypeInfo(include=As.EXTERNAL_PROPERTY)`"
description: "In `BeanDeserializer.deserializeUsingPropertyBasedWithExternalTypeId`,
  the active-view (`@JsonView`) filter was applied only to the regular bean-property
  branch; the creator-property branch performed no `creatorProp.visibleInView(activeView)`
  check. A constructor parameter annotated with both `@JsonView(RestrictedView.class)`
  and `@JsonTypeInfo(use=Id.NAME,\ninclude=As.EXTERNAL_PROPERTY)` is populated from
  attacker JSON even when a more restrictive view is active.\n\nThis is a patch gap.
  GHSA-5hh8 (CVE-2026-54517) and GHSA-rcqc (CVE-2026-54518) descriptions cover only
  the main property-based path and the unwrapped-creator path respectively; the external-type-id
  creator path was fixed on the 3.x line via #6004 (\"Extend #5969/#5971 fixes to
  ... external-type-id case in regular BeanDeserializer\", commit 7dc7a17, 2026-05-22)
  but\n**the fix was never backported to 2.21 or 2.18**. Users on 2.21.4 and 2.18.8
  who upgraded per the published advisories remain vulnerable to the same `@JsonView`
  bypass technique via a different code path."
