title: "blaze: Unbounded WebSocket message aggregation in http4s-blaze-server"
description: "`http4s-blaze-server` aggregates the fragments of an incoming WebSocket\nmessage
  with no limit on total size or fragment count. A client that\ncompletes a WebSocket
  handshake can send an unterminated fragmented\nmessage and drive unbounded heap
  growth in the server JVM, resulting in\ndenial of service via `OutOfMemoryError`."
