title: "JLine3 Telnet server: Unauthenticated Remote Memory Exhaustion via Unbounded
  Telnet NEW-ENVIRON Variables"
description: "The JLine3 Telnet server (`remote-telnet` module) does not limit the
  number of\nenvironment variables a client may inject via the Telnet NEW-ENVIRON
  option. An\nunauthenticated attacker can flood the server with a large number of
  unique\nvariable pairs before sending the terminating IAC SE byte, exhausting JVM
  heap\nmemory and causing an OutOfMemoryError (denial of service). Approximately
  3–4 MB of\nnetwork traffic is sufficient to consume a 512 MB JVM heap."
