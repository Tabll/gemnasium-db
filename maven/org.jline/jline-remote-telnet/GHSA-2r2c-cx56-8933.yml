title: "JLine3 Telnet server: Unauthenticated Remote DoS via Unbounded Telnet NAWS
  Terminal Geometry"
description: "The JLine3 Telnet server (`remote-telnet` module) does not apply an
  upper bound to\nterminal dimensions received via the Telnet NAWS (Negotiate About
  Window Size) option.\nAn unauthenticated remote attacker can send a NAWS subnegotiation
  advertising a\n65535×65535 terminal and repeatedly alternate values to trigger continuous,
  expensive\nrendering work on the server, causing CPU exhaustion and denial of service."
