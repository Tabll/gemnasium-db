title: "Karate Mock Server RCE via embedded expression evaluation of request-derived
  data"
description: "Karate Mock Server can execute embedded expressions found in attacker-controlled
  HTTP request data when a Mock Server feature assigns request-derived values such
  as `request`, `requestHeaders`, or `requestParams` to variables.\n\nIn affected
  scenarios, an unauthenticated remote attacker can place a Karate embedded expression
  such as `#(Java.type(...))` in the HTTP body, headers, or query parameters. The
  Mock Server then recursively processes that untrusted data as embedded expressions
  and evaluates it server-side, which can lead to arbitrary command execution under
  the privileges of the Karate Mock Server process.\n\nThis issue does not require
  the attacker to control the feature file. The vulnerable precondition is that the
  Mock Server feature uses request-derived data in a way that passes through Karate
  expression evaluation, for example:\n\n```karate\n* def body = request\n* def hdrs
  = requestHeaders\n* def params = requestParams\n```"
