title: "Micronaut: DefaultHttpClient follows redirects, forwarding Authorization,
  Cookie, and Proxy-Authorization headers"
description: "> DefaultHttpClient follows redirects and forwards Authorization, Cookie,
  and Proxy-Authorization headers to redirect targets across domain boundaries. The
  blocklist only filters Host/Connection/TE/CT/CL.\n> Additionally, no maximum redirect
  count exists, enabling infinite loop DoS.\n> Affected: DefaultHttpClient.java lines
  231-245, 1591, 2071\n\n> Suggested fix: Strip sensitive headers on cross-domain
  redirects"
