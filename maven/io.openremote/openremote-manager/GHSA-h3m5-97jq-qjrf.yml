title: "OpenRemote Manager: removeAlarms cross-realm IDOR (bulk delete)"
description: "OpenRemote Manager is vulnerable to a cross-tenant Insecure Direct\nObject
  Reference (IDOR) in the bulk alarm deletion endpoint. An\nauthenticated user in
  any realm can delete alarms belonging to other\nrealms (tenants) by supplying arbitrary
  alarm IDs. The vulnerability\nexists because the bulk removeAlarms() method only
  verifies that the\ncaller's own realm is active and accessible, but never checks
  whether\nthe targeted alarm IDs belong to the caller's realm before deleting\nthem.\n\nThis
  allows any user with alarm write permissions in their own realm\nto permanently
  destroy alarm records — including safety-critical and\nsecurity alerts — belonging
  to any other tenant on the same OpenRemote\ninstallation.\n\n------------------------------------------\n\n[Additional
  Information]\nThe singular removeAlarm() method correctly validates that the\ntarget
  alarm's realm matches the caller's access:\n\n// CORRECT (singular):\nSentAlarm
  alarm = alarmService.getAlarm(alarmId);\nif (!isRealmActiveAndAccessible(alarm.getRealm()))
  {\nthrow new ForbiddenException(...);\n}\n\nThe plural removeAlarms() method is
  missing this per-alarm realm\ncheck and only validates the caller's own realm —
  a check that is\ntrivially satisfied for any authenticated user:\n\n```\n// VULNERABLE
  (plural):\npublic void removeAlarms(RequestParams requestParams, List<Long> alarmIds)
  {\nif (!isRealmActiveAndAccessible(getAuthenticatedRealmName())) {\nthrow new ForbiddenException(...);
  \ // always passes for any auth user\n}\nList<SentAlarm> alarms = alarmService.getAlarms(alarmIds);
  \ // no realm filter\nalarmService.removeAlarms(alarms, alarmIds);                //
  no realm filter\n}\n\n```\nThe underlying service queries contain no realm scoping:\n\n```\n//
  AlarmService.getAlarms(List<Long>):\n\"select sa from SentAlarm sa where sa.id in
  :ids\"\n// no realm filter\n\n// AlarmService.removeAlarms():\n\"delete from SentAlarm
  sa where sa.id in :ids\"\n// no realm filter\n\n```\nAlarm IDs are sequential auto-increment
  Long values (JPA\n@GeneratedValue), making them trivially enumerable.\n\n[Vulnerability
  Type]\nInsecure Direct Object Reference (IDOR) / Missing Authorization\nCWE-639:
  Authorization Bypass Through User-Controlled Key\nCWE-862: Missing Authorization\n\n------------------------------------------\n\n[Vendor
  of Product]\nOpenRemote Inc. (openremote.io)\n\n------------------------------------------\n\n[Affected
  Product Code Base]\nOpenRemote Manager - current version as of 2026\n(github.com/openremote/openremote)\n\n------------------------------------------\n\n[Affected
  Component]\norg.openremote.manager.alarm.AlarmResourceImpl#removeAlarms()\norg.openremote.manager.alarm.AlarmService#getAlarms(List<Long>)\norg.openremote.manager.alarm.AlarmService#removeAlarms()\n\nFile:
  manager/src/main/java/org/openremote/manager/alarm/AlarmResourceImpl.java\nFile:
  manager/src/main/java/org/openremote/manager/alarm/AlarmService.java\n\n------------------------------------------\n\n[Attack
  Type]\nRemote (authenticated)\n\n------------------------------------------\n\n[CVE
  Impact Other]\nCross-tenant permanent destruction of alarm records, including\nsafety-critical
  and security alerts in IoT environments. Also enables\ncross-tenant alarm enumeration
  (presence disclosure of alarm IDs\nacross all tenants).\n\n------------------------------------------\n\n[Attack
  Vectors]\n1. Attacker registers or obtains any low-privilege account in any realm\non
  the target OpenRemote installation (or uses an existing account).\n2. Attacker enumerates
  alarm IDs belonging to other realms by sending\nbulk delete requests with sequential
  IDs (presence confirmed by\n404 vs 200 response codes).\n3. Attacker issues a single
  bulk delete request containing IDs of\nalarms belonging to victim realm(s).\n4.
  Alarms are permanently deleted with no authorization error.\n\nPoC:\n\n```\nTenant
  A (attacker) : realm = \"tenant-a\"\nuser  = attacker@tenant-a.com\nrole  = WRITE_ALARMS_ROLE\n\nTenant
  B (victim)   : realm = \"tenant-b\"\nalarms with IDs 1174,1173, 1180 exist\n```\n\n\n\n```\nDELETE
  /api/smartcity/alarm HTTP/2\nContent-Type: application/json\n\n\n[1174,1173, 1180]
  \ /// <- alarm ID\n```\n\n<img width=\"1280\" height=\"404\" alt=\"image\" src=\"https://github.com/user-attachments/assets/ffbebea2-2248-42a0-bb22-7a0dc51c78ce\"
  />"
