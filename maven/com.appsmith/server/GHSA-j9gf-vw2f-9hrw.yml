package_slug: "maven/com.appsmith/server"
title: "Appsmith: Configuration-dependent origin validation bypass in password reset
  and email verification link generation"
description: "A configuration-dependent origin validation bypass was identified in
  Appsmith’s password reset and email verification flows on current `release`.\n\nBoth
  flows derive the email-link base URL from the request `Origin` header. The current
  validation only enforces a trusted base URL when `APPSMITH_BASE_URL` is configured.
  If that setting is unset, the application accepts the caller-supplied origin and
  uses it to generate token-bearing reset and verification links.\n\nOn deployments
  with email delivery enabled and `APPSMITH_BASE_URL` unset, this can cause Appsmith
  to send security-sensitive links whose clickable host is attacker-controlled, which
  can plausibly lead to account takeover after victim interaction."
