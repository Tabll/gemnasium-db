package_slug: "maven/com.appsmith/server"
title: "Appsmith Super User Creation Race Condition Allows Multiple Instance Administrators"
description: "The `/api/v1/users/super` endpoint enforces a restriction that only
  one super user (Instance Administrator) can be created during initial setup. However,
  due to a Time-of-Check-Time-of-Use (TOCTOU) race condition in the `signupAndLoginSuper()`
  method, concurrent requests can bypass this restriction, allowing multiple unauthorized
  users to obtain Instance Administrator privileges."
