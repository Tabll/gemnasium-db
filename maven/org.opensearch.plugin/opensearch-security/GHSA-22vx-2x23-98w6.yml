title: "OpenSearch vulnerable to improper authorization for Rollover Requests"
description: "A flaw was identified in the OpenSearch Security plugin's handling of
  index rollover requests. When a rollover request included an explicit target index
  name, the security plugin did not properly evaluate access control permissions against
  the target index. This could allow a user with rollover permissions on a source
  index to create a new index with a name they are not authorized to use."
