title: "OpenSearch has a bypass of REST Layer Authorization Using Malformed Paths"
description: "A flaw was identified in the OpenSearch REST layer that could allow
  authorization checks to be bypassed when processing certain malformed HTTP requests.
  This could permit unauthorized access to restricted API endpoints in environments
  that rely on REST-layer authorization.\n\nTransport-level authorization is not affected
  by this issue."
