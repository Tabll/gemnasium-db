title: "land.oras:oras-java-sdk: Symlink-based path traversal in ArchiveUtils.untar
  / unzip allows arbitrary file write outside extraction directory"
description: "`ArchiveUtils.untar(InputStream, Path)` and `ArchiveUtils.unzip(InputStream,
  Path)` in `land.oras:oras-java-sdk` create symbolic-link entries from an archive
  without validating the symlink target. A malicious tar (or zip) shipped as an OCI
  layer blob can place a symlink under the extraction directory whose target points
  outside that directory, then ship a regular-file entry whose path traverses through
  that symlink. The subsequent `Files.newOutputStream` call follows the symlink and
  writes the file outside the caller's chosen `target` directory.\n\nThis bypasses
  the existing `ensureSafeEntry` containment check, which only validates `entry.getName()`
  and not `entry.getLinkName()`. Reachable from the public `Registry.pullArtifact`
  / `OCILayout.pullArtifact` API whenever the manifest layer carries `io.deis.oras.content.unpack=true`,
  and from any direct caller of `ArchiveUtils.untar` / `ArchiveUtils.uncompressuntar`
  (e.g. consumers that pull an archive blob and extract it themselves, such as project-scaffolding
  CLIs that fetch templates from OCI registries)."
