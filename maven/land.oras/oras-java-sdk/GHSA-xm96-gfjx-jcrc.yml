package_slug: "maven/land.oras/oras-java-sdk"
title: "ORAS Java: Path traversal in pullArtifact via attacker-controlled org.opencontainers.image.title
  annotation"
description: "The `pullArtifact` methods in `Registry` and `OCILayout` use the `org.opencontainers.image.title`
  annotation from a pulled manifest as a filename, resolving it against the caller
  supplied output directory without normalization or a containment check. A manifest
  publisher can set this annotation to a path that escapes the output directory, causing
  the SDK to write the layer's blob anywhere the JVM process can write."
