title: "Microsoft Security Advisory CVE-2026-111497 - .NET Brotli Decoder Out-of-bounds
  Write Vulnerability"
description: "A buffer overflow vulnerability exists in the Brotli decompression library
  used by .NET. This vulnerability may allow an unauthenticated attacker to read or
  corrupt process memory. This could lead to information disclosure, denial of service,
  or elevation of privilege.\n\nASP.NET Core and HttpClient do not automatically decompress
  Brotli data in their default configurations. Applications are exposed when they
  enable Brotli decompression or explicitly use Brotli decompression APIs to process
  attacker-controlled data, as described below. .NET Framework is not affected."
