title: "SIPSorcery: Malformed UDP datagram crashes TurnServer receive loop with no
  restart, disabling TURN UDP relay for all clients (DoS)"
description: "`TurnServer.ReceiveUdpAsync` places its generic `catch (Exception)`
  OUTSIDE the `while` receive loop, and `Start()` launches the loop fire-and-forget
  with no supervision or restart. A single pre-authentication UDP datagram whose STUN
  header first byte is in `0x80–0xFF` causes `STUNHeader.ParseSTUNHeader` to throw
  `ApplicationException`, which unwinds past the loop and terminates it. The TURN
  UDP relay is then dead for ALL clients until the process is restarted."
