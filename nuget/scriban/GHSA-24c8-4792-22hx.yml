title: "Scriban: array.insert_at index parameter DoS bypasses LoopLimit and LimitToString"
description: "`ArrayFunctions.InsertAt` in Scriban allocates `index - list.Count`
  null entries in a tight C# `for` loop with no bound on `index`. The function is
  exposed to template authors as `array.insert_at`, and the fill loop ignores every
  existing safety control: `LoopLimit`, `LimitToString`, `ObjectRecursionLimit`, and
  `RecursiveLimit`. A single template such as `{{ [1] | array.insert_at 200000000
  'x' | array.size }}` causes `OutOfMemoryException` in well under a second on a host
  with 1 GB of memory, even when `LoopLimit` is set to `10` and `LimitToString` is
  set to `100`. Because `OutOfMemoryException` is generally not caught by the template
  renderer or by typical host applications, the vulnerability terminates the host
  process, not just the template.\n\nThis is a sibling vector to GHSA-xw6w-9jjh-p9cr
  / GHSA-c875-h985-hvrc / GHSA-v66j-x4hw-fv9g, which patched comparable unbounded
  primitives in `string * int`, `array.size`, `array.join`, `string.pad_left`, and
  `string.pad_right`. The 7.0.0 hardening pass (`dde661d` \"Apply LoopLimit to internal
  iteration paths\" and `4227fde` \"Harden string padding width limits\") swept the
  equivalent loops in `ArrayFunctions` and `StringFunctions` but missed `InsertAt`."
