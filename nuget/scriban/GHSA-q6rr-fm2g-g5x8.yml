title: "Scriban: array * int (ScriptArray<T>.TryEvaluate) bypasses LoopLimit — incomplete
  fix for GHSA-c875-h985-hvrc, missed sibling of GHSA-24c8-4792-22hx"
description: "The array multiplication operator (`array * integer`) in Scriban allocates
  a result whose size is the product of the attacker-controlled integer and the array
  length, with **no `LoopLimit` / `LimitToString` check and no overflow-safe arithmetic**.
  A ~40-byte template forces a multi-gigabyte allocation, producing a denial-of-service.\n\nThis
  is the unguarded sibling of operations that *were* hardened against the same class
  of abuse: `string * integer` (gated by a `LimitToString` pre-check), `array.insert_at`
  (gated by `StepLoop`/`LoopLimit` — the **GHSA-24c8-4792-22hx** fix shipped in 7.2.0,
  scored 8.7 High), and the range/iteration paths covered by **GHSA-c875-h985-hvrc**
  (\"Built-in operations bypass LoopLimit\", fixed 7.0.0). The same `LoopLimit`-based
  hardening pattern was applied to those operations but never to `array * integer`.\n\nThis
  can be observed directly in 7.0.0, the release where GHSA-c875 was patched: `(1..5)
  * 50000000` (and `1..N | array.size`) correctly throws `Exceeding number of iteration
  limit '1000'`, while `[1,2,3,4,5] * 50000000` allocates ~2 GB with no limit. The
  `LoopLimit` control is enforced on the iteration path but not on the `array * int`
  allocation path, side by side, in the same version. The bug has been present since
  the operator was introduced in **3.0.0**, survives all of the 6.6.0 / 7.0.0 / 7.2.0
  DoS-hardening passes, and is still present in 7.2.0 (current) — i.e. it is both
  a missed sibling of GHSA-24c8 and an incomplete coverage of GHSA-c875's `LoopLimit`
  hardening."
