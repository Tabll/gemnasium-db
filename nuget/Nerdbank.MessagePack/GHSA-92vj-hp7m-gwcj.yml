title: "Nerdbank.MessagePack has Inefficient CPU Computation"
description: "Applications that call `OptionalConverters.WithExpandoObjectConverter`
  and deserialize untrusted data are open to a vulnerability by which an attacker
  can exploit a `O(n²)` algorithm to burn an inordinate amount of CPU effort by adding
  a great many properties to an `ExpandoObject`, whose `Add` method is implemented
  as an `O(n)` algorithm."
