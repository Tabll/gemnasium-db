title: "ReDoS in DotVVM routing"
description: "This impacts users which use multiple unconstrained route parameters
  not separated by a `/`. For instance, the following code is vulnerable:\n```\nvar
  route = new DotvvmRoute(\"edit/{a}-{b}-{c}/done\", null, \"testpage\", null, null,
  configuration);\n\nvar adversarialInput = \"edit/\" + new string('-', 32000);\nroute.IsMatch(adversarialInput,
  out _);\n```"
