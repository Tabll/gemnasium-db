title: "Microsoft DirectX: .spritefont multiply overflow only in 32-bit builds"
description: "The spritefont reader can be induced to perform a 32-bit overflow multiply
  that could in theory result in a RCE.\n\nThis impacts the use of the *DirectX Tool
  Kit* **SpriteFont** class file loading ctor if given untrusted data files.\n\n>
  Note this only applies to x86/ARM builds of the library. ARM64 and x64 native is
  not subject to this issue."
