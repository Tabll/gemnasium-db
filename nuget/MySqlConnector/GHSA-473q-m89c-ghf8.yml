title: "MySqlConnector: Account password disclosed to a man-in-the-middle in zero-configuration
  TLS mode (clear-text password sent before certificate is verified)"
description: "With `SslMode` set to `VerifyCA` or `VerifyFull` with no configured
  CA certificate, an unvalidated TLS connection is treated as secure and a clear-text
  password can be sent before the certificate is checked. This can occur when relying
  on the password to validate a self-signed cert, e.g., MariaDB's [zero-configuration
  TLS](https://mariadb.com/docs/server/security/encryption/data-in-transit-encryption/zero-configuration-ssl)."
