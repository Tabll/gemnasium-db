package_slug: "gem/sqlite3"
title: "sqlite3-ruby: Use-After-Free in SQLite Aggregate Arguments in Heap-Allocated
  Argument Array"
description: "Using `Database#create_aggregate`, `#create_aggregate_handler`, or `Database#define_aggregator`
  to define an aggregate function that takes two or more arguments, and then evaluating
  it over TEXT or BLOB column values, can free the Ruby objects holding those arguments
  while a later argument is still being converted, during ordinary garbage collection.
  The aggregate's `step` method then receives an incorrect object, or the process
  crashes with a segmentation fault."
