package_slug: "gem/nokogiri"
title: "Nokogiri: Possible Use-After-Free when setting `Document#root=` to an invalid
  node type"
description: "`Nokogiri::XML::Document#root=` validated only that the new root was
  a `Nokogiri::XML::Node`, allowing a DTD node to be set as the document root. The
  result is a heap use-after-free during garbage collection or finalization, leading
  to an invalid memory read or potentially a segfault.\n\nNokogiri 1.19.4 restricts
  `Document#root=` to element nodes, raising `TypeError` for any other node type.\n\nThis
  memory-safety issue affects only the CRuby implementation (libxml2). The JRuby implementation
  was not affected; the same input validation was added there for behavioral parity."
