title: "Nokogiri CSS selector tokenizer has regular expression backtracking"
description: "Nokogiri's CSS selector tokenizer contains regular expressions whose
  construction may result in exponential regex backtracking on adversarial selectors.
  Three ReDoS vectors are addressed in this release:\n\n1. String-literal tokenization
  on certain unterminated quoted-string input.\n2. String-literal tokenization on
  a separate class of hex-escape-rich input.\n3. Identifier tokenization on hex-escape-rich
  input.\n\nThe public CSS selector methods that funnel through the affected tokenizer
  are `Nokogiri::CSS.xpath_for`, `Node#css`, `Node#at_css`, `Searchable#search`, and
  `CSS::Parser#parse`."
