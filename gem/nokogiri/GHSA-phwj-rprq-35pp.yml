package_slug: "gem/nokogiri"
title: "Nokogiri: Possible Use-After-Free when setting an attribute value via `Nokogiri::XML::Attr#value=`
  or `#content=`"
description: "Nokogiri’s CRuby native extension could leave a Ruby wrapper pointing
  to freed memory when replacing the value of an XML attribute. If Ruby code had already
  accessed an attribute child node, `Nokogiri::XML::Attr#value=` could free the underlying
  native child node while the wrapper remained reachable through the document node
  cache. A later use of the freed child node or a Ruby GC mark could dereference an
  invalid pointer, causing an invalid read and a possible segfault.\n\nNokogiri 1.19.4
  preserves any already-wrapped attribute child nodes before replacing the attribute
  value.\n\nJRuby is not affected."
