title: "Nokogiri: Possible Out-of-Bounds Read in `Nokogiri::XML::NodeSet#[]`"
description: "`Nokogiri::XML::NodeSet#[]` (and its alias `#slice`) checked the requested
  index against the node set's bounds using a 32-bit-truncated copy of the index.
  A large negative index could pass the check and then be used at full width, reading
  outside the node set's storage. On CRuby this is an out-of-bounds read that typically
  crashes the process; on JRuby it is not memory-unsafe but returns an incorrect node.\n\nNokogiri
  1.19.4 performs the bounds check against the full-width index."
