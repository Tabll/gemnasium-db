package_slug: "gem/nokogiri"
title: "Nokogiri: Possible Use-After-Free when directly using `NokogirI::XML::XPathContext`
  beyond document lifetime"
description: "`Nokogiri::XML::XPathContext` did not keep its source document alive
  for garbage collection. If an `XPathContext` outlived its document and the document
  was collected, evaluating an XPath expression could read invalid memory and potentially
  segfault.\n\nThis is only reachable when application code constructs an `XPathContext`
  directly and lets the document become unreachable while continuing to use the context.
  The normal `Document#xpath`, `#css`, and related search methods are not affected,
  and it is not triggerable by malicious document input.\n\nNokogiri 1.19.4 makes
  `XPathContext` keep its source document alive for as long as the context exists.\n\nOnly
  the CRuby implementation is affected. JRuby is not affected."
