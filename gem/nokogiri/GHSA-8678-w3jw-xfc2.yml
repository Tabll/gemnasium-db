package_slug: "gem/nokogiri"
title: "Nokogiri: XML::Schema on JRuby allows network requests when NONET is set,
  bypassing CVE-2020-26247"
description: "The `NONET` parse option, which Nokogiri turns on by default for `Nokogiri::XML::Schema`
  (see [CVE-2020-26247](https://github.com/sparklemotion/nokogiri/security/advisories/GHSA-vr8q-g5c7-m54m)),
  was not correctly enforced on the JRuby implementation. As a result, a schema parsed
  with default options could still cause external resources to be fetched over the
  network, potentially enabling SSRF or XXE attacks.\n\nNokogiri 1.19.4 replaces the
  scheme denylist with an allowlist. When `NONET` is enabled, only local resources
  (a `file:` scheme, or a relative or absolute path with no scheme) are resolved,
  and every network scheme is blocked, case-insensitively. This brings the JRuby behavior
  in line with CRuby.\n\nOnly the JRuby implementation is affected. CRuby is not affected,
  because libxml2's `xmlNoNetExternalEntityLoader` blocks all network schemes at the
  I/O layer regardless of scheme or case."
