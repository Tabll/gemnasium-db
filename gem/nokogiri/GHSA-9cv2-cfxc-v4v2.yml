title: "Nokogiri: Null Pointer Dereference calling methods on uninitialized wrapper
  classes"
description: "Nokogiri contains a bug when calling certain methods on allocated-but-uninitialized
  native wrapper classes that inherit from `Nokogiri::XML::Node`. This caused a NULL
  pointer dereference that could crash the process.\n\nNokogiri 1.19.4 checks for
  missing native data pointers and raises a `RuntimeError`.\n\nJRuby is not affected."
