package_slug: "gem/activerecord-tenanted"
title: "ActiveRecord::Tenanted::Storage::DiskService#path_for has a possible path
  traversal"
description: "Active Record Tenanted's override of Active Storage's `DiskService#path_for`
  does not validate that the resolved filesystem path remains within the storage root
  directory. If a blob key containing path traversal sequences (e.g. `../`) is used,
  it could allow reading, writing, or deleting arbitrary files on the server. Blob
  keys are expected to be trusted strings, but some applications could be passing
  user input as keys and would be affected."
