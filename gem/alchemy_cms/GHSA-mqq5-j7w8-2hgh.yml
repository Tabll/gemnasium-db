title: "AlchemyCMS: Unauthenticated nested page API leaks restricted & unpublished
  content"
description: "The unauthenticated `GET /api/pages/nested` endpoint returns the full
  page tree to any anonymous caller, including restricted (member-only) pages and
  unpublished/draft pages that should be hidden.\nAppending `?elements=true` additionally
  dumps the element/ingredient **content** of restricted pages, fully bypassing the
  access control the sibling `show` and `index` actions enforce."
