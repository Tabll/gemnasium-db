package_slug: "cargo/hickory-resolver"
title: "hickory-resolver: Resolver::lookup() and Resolver::lookup_ip() APIs obscure
  DNSSEC validation failures"
description: "When calling `Resolver::lookup()` or `Resolver::lookup_ip()` on a resolver
  with DNSSEC validation enabled, both methods return `Ok(...)` if DNSSEC validation
  fails. It is possible but very inconvenient to check the validation status of individual
  records. These methods should instead return an error when DNSSEC validation determines
  a response is bogus."
