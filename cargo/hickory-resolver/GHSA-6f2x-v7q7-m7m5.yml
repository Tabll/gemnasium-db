package_slug: "cargo/hickory-resolver"
title: "hickory-resolver follows irrelevant CNAME records"
description: "When the Hickory DNS resolver follows CNAME records, it sends queries
  that are not necessary to answer the original recursive query. If there are any
  CNAME records in the authority section or additional section of the response, queries
  will be sent for those names. If there are any CNAME records that are not part of
  a CNAME chain starting from the original recursive query name, queries will be sent
  for those names. This increases query amplification beyond what is necessary to
  answer the recursive query."
