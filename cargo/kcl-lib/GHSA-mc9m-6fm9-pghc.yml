title: "Zoo Design Studio: Memory-corruption in memory handling of lib-kcl"
description: "A race condition in kcl-lib can result in a use-after-free when accessing
  environments concurrently. During Vec reallocation, the previous buffer containing
  Box pointers is freed and replaced. A concurrent get_env operation that has already
  loaded a pointer to the old buffer may subsequently index into freed memory and
  retrieve a stale or corrupted Pin<Box<Environment>>."
