package_slug: "cargo/skilo"
title: "skilo add follows symbolic links, allowing arbitrary local file disclosure
  from a malicious skill source"
description: "`skilo add` installs a skill by recursively copying the skill directory
  into the\ntarget skills directory. The copy routine (`copy_dir_all`) classified
  each entry\nwith `std::fs::DirEntry::file_type()` — which does **not** follow symlinks
  — and\nthen copied non-directory entries with `std::fs::copy()`, which **does**\ndereference
  symlinks.\n\nAs a result, a skill containing a symbolic link such as\n`reference.txt
  -> /home/<user>/.ssh/id_rsa` was copied as a regular file whose\ncontents are the
  link's **target**. A malicious skill source — for example a git\nrepository installed
  via `skilo add github.com/<attacker>/<skills>`, or a local\npath — could read arbitrary
  files readable by the user running `skilo add` (SSH\nkeys, cloud credentials, `.env`
  files, etc.) and place their contents inside the\ninstalled skill directory, where
  the user or their agent may later read, share,\nor sync them.\n\nThis is arbitrary
  local file disclosure (CWE-59 / CWE-61, symlink following)\ntriggered by installing
  an untrusted skills source."
