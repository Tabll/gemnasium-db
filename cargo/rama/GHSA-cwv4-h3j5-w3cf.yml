title: "rama has Stored XSS in ServeDir HTML directory listing via unescaped file
  names and URI path"
description: "`plabayo/rama` contains a stored/reflected cross-site scripting issue
  in the `ServeDir` HTML directory listing feature.\n\nWhen `ServeDir` is configured
  with `DirectoryServeMode::HtmlFileList`, file names and URI path components are
  inserted directly into generated HTML without HTML escaping. If an attacker can
  create or influence a file or directory name inside a served directory, they may
  inject HTML or JavaScript into the directory listing page.\n\nThis can execute script
  in the browser of any user who visits the affected directory listing."
