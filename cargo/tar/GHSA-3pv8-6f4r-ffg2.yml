package_slug: "cargo/tar"
title: "tar has a PAX header desynchronization issue"
description: "When a tar stream contains multiple \"header\" entries prior to a file
  entry, tar-rs applies the PAX header (`x`) to the _next_ entry in the stream, regardless
  of type. For example, a stream of `x -> L -> file` (PAX, GNU longname, file) would
  result in `x`'s extensions being applied to `L` rather than to `file`.\n\n[Per POSIX
  pax](https://pubs.opengroup.org/onlinepubs/9799919799/utilities/pax.html), this
  is incorrect: a PAX header always applies to a file entry, not any intermediary
  entries. See the \"pax Header Block\" section for the specific prescription there.\n\nAs
  a result of this, an attacker can contrive a tar containing a sequence of tar headers
  such that tar-rs applies the PAX header's `size` extension to the next header in
  sequence, effectively desynchronizing the stream and enabling tar-rs specific skippage/extraction
  of members. In other words, a file can be contrived to extract differently on tar-rs
  than on other tar parsers."
