package_slug: "cargo/dynoxide-rs"
title: "dynoxide: DNS rebinding and cross-origin CSRF via MCP HTTP transport"
description: "dynoxide's MCP HTTP transport was vulnerable to DNS rebinding via its
  transitive `rmcp` dependency, plus a related cross-origin CSRF gap. A malicious
  web page could make the user's browser send requests to a local `dynoxide mcp --http`
  or `dynoxide serve --mcp` server with a non-loopback `Host` header, which the server
  would then process. Affects 0.9.3 to 0.9.12. The stdio transport (`dynoxide mcp`
  without `--http`, which is the default) is not affected."
