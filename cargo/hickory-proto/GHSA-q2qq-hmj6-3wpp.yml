package_slug: "cargo/hickory-proto"
title: "hickory-proto vulnerable to CPU exhaustion during message encoding due to
  O(n²) name compression"
description: "During message encoding, `hickory-proto`'s `BinEncoder` stores pointers
  to labels that are candidates for name compression in a `Vec<(usize, Vec<u8>)>`.
  The name compression logic then searches for matches with a linear scan.\n\nA malicious
  message with many records can both introduce many candidate labels, and invoke this
  linear scan many times. This can amplify CPU exhaustion in DoS attacks.\n\nThis
  is similar to [CVE-2024-8508](https://www.nlnetlabs.nl/downloads/unbound/CVE-2024-8508.txt)."
