package_slug: "cargo/postgres-protocol"
title: "postgres-protocol: Unbounded SCRAM iteration count allows a malicious server
  to cause CPU-exhaustion denial of service"
description: "A malicious, compromised, or man-in-the-middle server can supply an
  arbitrarily\nlarge SCRAM-SHA-256 PBKDF2 iteration count during authentication. The
  client\nruns it inline with no upper bound, pinning a `tokio` worker thread for
  minutes\nper connection, possibly stalling the whole async runtime.\n\nApplications
  that connect only to a trusted database are not exposed; the risk\napplies to clients
  that may connect to untrusted or user-supplied servers, or\nwhose connection can
  be intercepted by a man-in-the-middle."
