title: "postgres-protocol: Panic decoding a malformed `hstore` value allows denial
  of service"
description: "A malicious or compromised server can return a binary `hstore` value
  with an\ninvalid internal length field, causing the client to panic while decoding
  it.\n\nApplications that connect only to a trusted database are not exposed; the
  risk\napplies to clients that may connect to untrusted or user-supplied servers,
  or\nwhose connection can be intercepted by a man-in-the-middle."
