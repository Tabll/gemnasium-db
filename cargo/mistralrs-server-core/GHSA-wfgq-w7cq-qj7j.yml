title: "mistral.rs Media Loader: Unauthenticated SSRF and arbitrary local file read
  via image_url"
description: "mistral.rs fetches any request-supplied image/audio URL with no host
  or IP validation, and opens arbitrary local files (a `file://` URL, or any existing
  relative/absolute path). A remote, unauthenticated client of any vision/audio deployment
  can cause the server to issue requests to internal or cloud-metadata addresses (SSRF)
  and to open arbitrary local files, via the standard OpenAI `image_url` / `audio_url`
  message content. The server is unauthenticated by default."
