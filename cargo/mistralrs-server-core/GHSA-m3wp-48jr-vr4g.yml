package_slug: "cargo/mistralrs-server-core"
title: " mistral.rs: Unbounded Remote Media Fetch and Video Frame Expansion DoS"
description: "The `POST /v1/chat/completions` endpoint in mistral.rs fetches attacker-supplied
  media URLs (image, audio, video) into server memory with no byte limit, and extracts
  every frame of a supplied video when `num_frames` is `None`. An unauthenticated
  remote attacker can exhaust server memory, disk space, and CPU by pointing the endpoint
  at an infinite-streaming HTTP server or a long high-framerate video, causing a complete
  denial of service. No credentials or special configuration are required; the route
  is open by default."
