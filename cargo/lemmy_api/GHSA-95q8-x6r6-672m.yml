package_slug: "cargo/lemmy_api"
title: "Lemmy may expose private community data through community, saved, liked, and
  modlog API views"
description: "Lemmy applies private-community checks in `PostView` and `CommentView`,
  but several adjacent API views skip the accepted-follower filter. Bob, a registered
  user who is not an accepted follower, can read private community `sidebar` and `summary`
  fields. Alice, a former accepted follower, can still read saved and liked private
  post bodies after she leaves. An unauthenticated visitor can read private community
  metadata and removed private post names through the modlog."
