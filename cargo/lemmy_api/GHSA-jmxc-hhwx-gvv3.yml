title: "Private Lemmy instances expose multi-community metadata without authentication"
description: "`read_multi_community()` does not enforce the private-instance setting.
  On a private instance, an unauthenticated visitor can read multi-community names,
  titles, summaries, sidebars, owner identities, and member community lists.\n\nmid
  = api(\"POST\", \"/multi_community\", admin, json={\n\"name\": \"m\" + suffix, \"title\":
  secret,\n\"summary\": secret + \" summary\", \"sidebar\": secret + \" sidebar\",\n}).json()[\"multi_community_view\"][\"multi\"][\"id\"]"
