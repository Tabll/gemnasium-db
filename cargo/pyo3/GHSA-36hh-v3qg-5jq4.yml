title: "PyO3 has an Out-of-bounds Read in `nth` / `nth_back` for `PyList` and `PyTuple`
  iterators"
description: "PyO3 0.24.0 added optimized implementations of `Iterator::nth` and `DoubleEndedIterator::nth_back`
  for the `BoundListIterator` and `BoundTupleIterator` types. These implementations
  computed the target index using unchecked `usize` addition (`index + n`) before
  bounds-checking against the sequence length, then read the element via `get_item_unchecked`.\n\nIn
  `nth` methods, a sufficiently large `n` (combined with a non-zero internal index)
  could cause the addition to overflow and wrap around, producing a small \"target
  index\" that passed the bounds check and enabling reads at the front of the `list`
  or `tuple` of elements previously yielded by the iterator.\n\nIn `nth_back` methods,
  a sufficiently large `n` could cause underflow in a similar fashion, however would
  instead allow reads of arbitrary memory past the end of the `list` or `tuple` storage."
