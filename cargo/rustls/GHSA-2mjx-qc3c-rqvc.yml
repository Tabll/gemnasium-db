title: "Rustls: TLS 1.3 handshake messages incorrectly accepted across encryption
  level boundaries"
description: "Rustls (tested version 0.23.44, and it appears still an issue on latest
  master though I have not tested this) accepts a TLS 1.3 server flight where a plaintext
  EncryptedExtensions is packed into the same record as the ServerHello.\n\nThis is
  very similar to Go's CVE-2025-61730 fixed in https://github.com/golang/go/commit/5046bdf8a612b35a2c1a9e168054c1d5c65e7dd7"
