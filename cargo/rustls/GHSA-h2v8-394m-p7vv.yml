title: "Rustls: Brotli certificate decompression can allocate an attacker-controlled
  amount of memory up to 1 GiB before authentication."
description: "The built-in (but disabled by default) Brotli certificate decoder bounds
  the output buffer but accepts an input-selected history window. A header of five
  bytes can specify a 1 GiB window allocation. A peer can abort a process whose allocator
  cannot satisfy that request. A client must enable Brotli and connect to the peer;
  a server must enable Brotli and request a client certificate. Neither direction
  requires a trusted attacker certificate."
