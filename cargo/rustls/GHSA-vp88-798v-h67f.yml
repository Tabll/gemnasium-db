package_slug: "cargo/rustls"
title: "rustls: ECH rejection can expose buffered application data to authenticated
  outer server before `ech_required` alert"
description: "In rustls 0.23.44 and 0.23.45, application data that a client buffers
  before the handshake completes is sent to the server even when the server rejects
  Encrypted Client Hello (ECH).\n\nWhen the server rejects ECH, the client completes
  the handshake with the outer ClientHello and authenticates the server against the
  ECH config's `public_name`. At the end of the handshake, `start_traffic()` encrypts
  and queues any plaintext buffered by `ClientConnection::writer()`. It does this
  *before* checking for `EchStatus::Rejected` and queueing the `ech_required` alert.\n\nThe
  application then receives `Error::PeerIncompatible(ServerRejectedEncryptedClientHello)`,
  as expected. However, the client is still expected to call `write_tls()` to send
  the fatal alert, and that call also sends the encrypted application data. The server
  decrypts the data and only then receives the alert.\n\nThe ordering bug is older
  than 0.23.44. Before 0.23.44, the client checked the server certificate against
  the inner server name rather than `public_name`, so a correctly configured server
  failed certificate verification first and no data was sent. 0.23.44 fixed that check,
  which makes the ordinary rejection path reachable."
