package_slug: "cargo/rustls"
title: "rustls: An unauthenticated ServerHello poisons the per-name key-exchange record,
  so later ClientHellos carry only a classical X25519 share"
description: "The client records the server-selected key-exchange group per server
  name when it processes the ServerHello, before the server is authenticated. A network
  attacker can answer one connection attempt for a target name with a ServerHello
  that selects X25519 and close the connection. Later ClientHellos for that name carry
  one X25519 share while supported_groups still lists X25519MLKEM768 first. If the
  server accepts that share instead of sending a HelloRetryRequest, the handshake
  completes with classical key exchange only and no error.\n\nAn attacker that answers
  one connection attempt for the target name with a ServerHello selecting X25519 changes
  every later ClientHello of that client for that name, for as long as the entry stays
  in the store. No certificate or completed handshake is needed: it parses the ClientHello,
  sends the ServerHello, and closes.\n\nTLS 1.3 transcript binding stops an on-path
  attacker from editing the ClientHello of one connection. It does not stop the attacker
  from steering the client's prediction state beforehand, because that state is written
  from an unauthenticated message."
