package_slug: "cargo/rustls"
title: "Rustls: Session Debug formatting exposes TLS master secrets and resumption
  PSKs"
description: "Formatting a client session value with Debug exposes its TLS 1.2 master
  secret or TLS 1.3 resumption PSK. A custom session store that logs these values
  can disclose keys to readers of the logs. Ordinary connection and built-in cache
  diagnostics remain redacted, and the session-store interface already warns that
  its values are sensitive."
