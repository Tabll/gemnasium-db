title: "astral-tokio-tar is Vulnerable to PAX Header Desynchronization"
description: "Versions of astral-tokio-tar prior to 0.6.1 contain a PAX header interpretation
  bug that allows manipulated entries to be made selectively visible or invisible
  during extraction with astral-tokio-tar versus other tar implementations. An attacker
  could use this differential to smuggle unexpected files onto a victim's filesystem.\n\nSee
  GHSA-j5gw-2vrg-8fgx for a similar desynchronization bug in astral-tokio-tar."
