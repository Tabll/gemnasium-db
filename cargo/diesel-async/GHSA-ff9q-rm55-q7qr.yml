package_slug: "cargo/diesel-async"
title: "diesel-async may expose uninitialized padding bytes for MySQL temporal columns"
description: "diesel-async exposes uninitialized stack padding to safe code on every
  read of a MySQL `DATE`, `TIME`, `DATETIME`, or `TIMESTAMP` column. Reading that
  buffer is undefined behavior, and the leaked bytes can contain stale heap/stack
  contents, so this is both a soundness bug and a potential information-disclosure
  vector."
