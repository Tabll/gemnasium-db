package_slug: "cargo/tokio-postgres"
title: "tokio-postgres: Panic on a `DataRow` with fewer fields than columns allows
  denial of service"
description: "A malicious or compromised server can send a row containing fewer fields
  than\nits row description declares columns. Reading one of the missing columns then\npanics
  with an out-of-bounds index, aborting the calling task. This affects even\nthe otherwise
  non-panicking `try_get`, and both `Row` and `SimpleQueryRow`.\n\nApplications that
  connect only to a trusted database are not exposed; the risk\napplies to clients
  that may connect to untrusted or user-supplied servers, or\nwhose connection can
  be intercepted by a man-in-the-middle."
