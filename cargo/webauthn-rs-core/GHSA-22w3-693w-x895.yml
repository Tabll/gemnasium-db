package_slug: "cargo/webauthn-rs-core"
title: "webauthn-rs-core/webauthn-authenticator-rs: Origin validation mismatch possible
  when subdomains are allowed"
description: "`webauthn-rs-core` ([Relying Party][rp]) and `webauthn-authenticator-rs`
  ([client][]) checked that [an `Origin` in `CollectedClientData`][origin] is valid
  for [an RP ID][rpid] with [`str::ends_with()`][ends-with], [without checking for
  a dot (`.`) before the RP ID when allowing subdomains][registerable-suffix].\n\nThis
  check is flawed, and could allow requests from an attacker-controlled domain such
  as `hermit-crab.example` to be accepted for the RP ID `crab.example` (assuming `.example`
  was publicly-registerable TLD) when the RP allows authenticating from a subdomain
  (disabled by default in `webauthn-rs-core` and `webauthn-rs`)."
