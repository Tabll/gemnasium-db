package_slug: "cargo/imageproc"
title: "imageproc has fragile bounds check when sampling from image"
description: "A read of pixels was coded as modifying coordinates to lie within the
  image bounds. It would calculate a coordinate by adding a constant to an input and
  taking the minimum of the resulting coordinate and 'dimension - 1'. This would not
  protect against malicious inputs that could overflow the addition. Following the
  tricked bounds check, the image could then be sampled at multiple differently calculated
  coordinates that exceeded the bounds."
