package_slug: "cargo/nono-cli"
title: "nono-cli'scregistry pack verification can fail open when provenance metadata
  is absent"
description: "Registry-installed nono packs are expected to be verified from local
  provenance metadata before they are used. Two files are relevant:\n\n- `~/.config/nono/packages/lockfile.json`\n-
  `~/.config/nono/packages/<namespace>/<pack>/.nono-trust.bundle`\n\nTesting shows
  that nono fails closed when a pack has a trust bundle but no lockfile entry. However,
  if the trust bundle is also absent, the same pack can load successfully. Deleting
  security metadata should not make a pack easier to run."
