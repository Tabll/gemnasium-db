package_slug: "cargo/serde_with"
title: "serde_with: KeyValueMap serialization panics on empty sequence or map entries"
description: "The public `KeyValueMap` serializer assumes that each mapped element
  has at least one field or item to use as the map key, but it subtracts `1` from
  the caller-visible length before validating that assumption. An application that
  serializes attacker-controlled data through `#[serde_as(as = \"KeyValueMap<_>\")]`
  can be crashed by an empty inner sequence or map entry."
