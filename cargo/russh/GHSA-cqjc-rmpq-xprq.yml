title: "Russh: Post-auth remote panic via pty-req with more than 130 terminal-mode
  records"
description: "A post-authentication denial-of-service panic in `russh` 0.62.2 (commit\n`c4be19f1915c8682f4615c3fd50008512b474491`,
  current default branch `main` as\nof 2026-07-22). An authenticated client sends
  a `pty-req` channel request\ncarrying more than 130 terminal-mode records. The parser
  uses a fixed\n`[(Pty::TTY_OP_END, 0); 130]` array but increments its counter `i`
  for every\nvalid record (logging \"too many pty codes\" without returning), then
  slices\n`&modes[0..i]` — an out-of-bounds slice that **panics** (`range end index
  131\nout of range for slice of length 130`) before the application `pty_request`\nhandler
  runs.\n\nThis is reachable with the **default** server configuration and the **default**\ncrypto
  config (curve25519-sha256 + chacha20-poly1305), requiring only an\nauthenticated
  session channel — no caller-supplied parameter. It is reproduced\nend-to-end against
  the unmodified real russh 0.62.2 library (a real\n`russh::client` + `russh::server`
  over TCP, using the public\n`Channel::request_pty(...)` API); the PoC below links
  the real crate, not a\ncopied snippet. The defect is still present on `main` HEAD
  (`v0.62.3`,\n2026-07-22) and is not covered by any of the 11 published russh GHSA\nadvisories
  (GHSA-4r3c-5hpg-58qr / CVE-2026-48110 is allocation-first string\nparsing, not the
  fixed-array slice overflow; it was fixed in 0.61.0 but this\ncode path still overflows
  the fixed array).\n\nRust bounds-checked panics abort the task safely (no memory
  corruption / RCE);\nthe impact is remote **denial of service**."
