package_slug: "cargo/kanidmd_lib"
title: "kanidmd_lib: Image upload validators run before authorization; PNG validator
  panics on malformed input"
description: "The `POST /v1/domain/_image` and `POST /v1/oauth2/{rs_name}/_image`
  handlers call `validate_image()` on the uploaded body **before** the ACL check that
  restricts image upload to admins. Any bug in an image validator is therefore reachable
  by an unauthenticated remote client rather than being admin-gated.\n\nOne such bug
  exists today: `png_has_trailer()` panics on inputs shorter than 8 bytes, or whose
  first chunk-length field is near `u32::MAX`.\n\n**On a default build this has no
  server-wide impact.** The panic unwinds only the requester's own tokio task; the
  server process survives, no shared state is poisoned, and other connections are
  unaffected. This was reported privately rather than as a public issue because (a)
  the project previously treated an admin-triggered thread crash of identical impact
  as security-relevant (e51d0dee4), and this is reachable by a broader population;
  and (b) a downstream build with `panic = \"abort\"` would upgrade it to an unauthenticated
  process-crash DoS."
