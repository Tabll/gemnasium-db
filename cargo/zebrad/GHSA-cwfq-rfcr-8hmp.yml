title: "Zebra's Transparent SIGHASH_SINGLE Handling Diverges from zcashd for Corresponding
  Outputs"
description: "For V5+ transparent spends, `Zebra` and `zcashd` disagree on the same
  consensus rule: `SIGHASH_SINGLE` must fail when the input index has no corresponding
  output. `zcashd` treats this as consensus-invalid under ZIP-244, while `Zebra`'s
  transparent verification path computes a digest for the missing-output case instead
  of failing.\n\nThe result is a direct block-validity split. A malformed V5 transparent
  transaction can be accepted by `Zebra`, retained in `Zebra`'s mempool, selected
  into `Zebra` `getblocktemplate`, mined into a block, and then rejected by `zcashd`."
