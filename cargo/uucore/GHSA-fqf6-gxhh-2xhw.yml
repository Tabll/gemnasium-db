title: "uutils coreutils: cp/install/mv/ln --suffix alone does not enable backup mode
  (silent data loss vs GNU)"
description: "`determine_backup_mode` in `src/uucore/src/lib/features/backup_control.rs`
  only checks `--backup`/`-b` and returns `BackupMode::None` when only `--suffix`
  is given. GNU enables backup mode when `--suffix` is used alone (defaulting to existing/numbered,
  or `$VERSION_CONTROL`). Affects `cp`, `install`, `mv`, `ln` which share this code.\n\n```"
