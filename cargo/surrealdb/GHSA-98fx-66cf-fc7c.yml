title: "SurrealDB: Scraping a TABLE with no available PERMISSIONS to current auth
  level"
description: "A vulnerability was discovered where the user-supplied `WHERE` clause
  in a `SELECT` statement is evaluated against the full record data before `PERMISSIONS
  FOR SELECT WHERE` determines whether the principal is authorised to access that
  record. A side-effecting expression in the `WHERE` clause can exfiltrate record
  contents before the permission check runs. The same ordering bug affects the `SET`,
  `MERGE`, `CONTENT` and `PATCH` clauses of update-variant statements (`UPDATE`, `UPSERT-update`,
  `INSERT ON DUPLICATE KEY UPDATE`, `RELATE-update`).\n\nThis vulnerability is confined
  to the attacker's current database. It does not cross namespace or database isolation
  boundaries."
