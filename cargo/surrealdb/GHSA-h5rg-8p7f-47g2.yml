title: "SurrealDB: SSRF via JWKS URL — Redirect Following in JWT Key Fetch"
description: "SurrealDB fetches the JWKS document for a JWT or record access method
  using a bare `reqwest` client that follows HTTP redirects by default. The network
  capability check in `core/src/iam/jwks.rs` (`check_capabilities_url`) is applied
  only to the originally configured URL; redirect targets are not re-validated. An
  `--allow-net`-permitted JWKS host that returns a `3xx Location` can therefore redirect
  the request to an address the allowlist was meant to block, resulting in a server-side
  request forgery (SSRF). The protected `HttpClient` used by `http::*` functions re-checks
  every redirect hop and was hardened in 3.1.0, but the JWKS fetcher uses its own
  client and was not covered."
