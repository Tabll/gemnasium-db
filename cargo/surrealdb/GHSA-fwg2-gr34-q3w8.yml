package_slug: "cargo/surrealdb"
title: "SurrealDB: ES512 silently downgraded to ES384 due to jsonwebtoken crate limitation"
description: "When a user configures `ALGORITHM ES512` for any JWT access method (`DEFINE
  ACCESS ... TYPE JWT ALGORITHM ES512`), SurrealDB silently substitutes ES384 at all
  four internal algorithm conversion points. This occurs because the underlying `jsonwebtoken`
  crate (v10.x) does not include an ES512 algorithm variant, so the mapping defaults
  to ES384 without raising an error, warning, or log message.\n\nUsers who provide
  the correct P-521 key type for ES512 will experience authentication handshake failures
  due to the curve mismatch with ES384 (which expects P-384)."
