package_slug: "cargo/surrealdb"
title: "SurrealDB: Indexed ORDER BY leaks the value ordering of a SELECT-restricted
  field"
description: "A field can be hidden from a user with a field-level SELECT permission
  (`DEFINE FIELD code ON secret PERMISSIONS FOR select WHERE owner = $auth.id`). When
  that field is indexed, a record user who cannot read it could still recover the
  relative ordering of its values across every record by issuing `ORDER BY <field>`:
  the field came back `null` as intended, but the rows were returned in the hidden
  values' true sorted order.\n\nTo satisfy the sort, the planner selects the field's
  index and walks it in value order; the field-level permission is applied later,
  when the row is projected, so the value is nulled but the row order already encodes
  it. The guard that withholds restricted fields from the `WHERE` path was never applied
  to `ORDER BY`."
