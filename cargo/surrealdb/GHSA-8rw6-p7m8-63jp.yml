package_slug: "cargo/surrealdb"
title: "SurrealDB: Array element-level (field.*) SELECT permissions leak denied elements
  to record users"
description: "A `SELECT` permission defined on an array element (`DEFINE FIELD field.*
  … PERMISSIONS FOR select …`) is not enforced correctly for `RECORD` users. Instead
  of hiding the denied elements, the query leaks a subset of them: a deny-all returns
  the odd-indexed elements, and a per-element predicate keeps and drops the wrong
  ones.\n\nThe filter removed each denied element by index while walking the array
  forwards. Because removing an element shifts every later index down, each cut invalidated
  the indices still pending in the loop, leaving denied elements behind. Field-level
  permissions are enforced correctly; only the element (`field.*`) level is affected,
  and only for record users — root and record-owner sessions are not."
