title: "SurrealDB vulnerable to Denial of Service due to nested types annotations"
description: "The SurrealDB type/kind parser did not enforce the configured recursion
  depth limit when parsing nested type annotations. The expression parser already
  enforced the limit for analogous constructs; the kind parser omitted it. An authenticated
  attacker could send a query with deeply nested type annotations (e.g., `array<option<array<option<...>>>>`)
  and exhaust server memory, crashing the process."
