package_slug: "cargo/surrealdb"
title: "SurrealDB: `RELATE` overwrites existing edge records without `UPDATE` permission"
description: "`RELATE` creates an edge record between two existing records, and SurrealDB
  enforces the `CREATE` permission on the edge table for this operation. When the
  statement included a `SET id = edge:existing` clause, however, the new edge's id
  ended up pointing at an record that was already in storage. Rather than failing
  because the target already existed — which is what a create operation should do
  — the storage layer silently overwrote the existing edge. A caller with `CREATE`
  permission could therefore replace any existing edge on the table, even without
  `UPDATE` permission for that record."
