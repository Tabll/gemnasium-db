package_slug: "cargo/surrealdb"
title: "SurrealDB has Denial of Service in JSON parser due to nested objects"
description: "The SurrealDB value and JSON parser did not enforce the configured recursion
  depth limit when parsing nested `{`, `[`, or `(` tokens. The expression parser already
  enforced the limit for these tokens; the value/JSON parser omitted it. An unauthenticated
  attacker could send a deeply nested JSON payload to the WebSocket `/rpc` endpoint
  and exhaust server memory, crashing the process."
