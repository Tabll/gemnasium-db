package_slug: "cargo/surrealdb"
title: "SurrealDB: USE NS/DB implicit creation bypasses DEFINE authorization"
description: "An anonymous caller could create new namespaces and databases on a running
  SurrealDB instance without holding `DEFINE NAMESPACE` or `DEFINE DATABASE` permission.\n\n`USE
  NS <name>` and `USE DB <name>` automatically create the target when it does not
  exist. The three places `USE` is handled — the RPC `use` method, `Datastore::process_use`,
  and the SurrealQL executor — did not check whether the caller was allowed to create
  the resource. Under default capabilities any session reached this path, including
  an unauthenticated guest."
