title: "SurrealDB: Crafting malicious LIVE queries writes to the database, resulting
  in DoS, without permission to the table required"
description: "A `LIVE` query whose `WHERE` clause evaluates to an error caused the
  source data modifier (the user creating, updating, or deleting a record on the watched
  table) to fail instead. Calling any arbitrary SurrealQL function with a typed parameter
  and passing a value of the wrong type — for example `LIVE SELECT * FROM t WHERE
  string::trim(deny)` — triggered an evaluation error inside the LIVE notification
  path. That error then propagated through to the triggering write, rolling back the
  attempted change.\n\nWhile such a `LIVE` query was registered, all `CREATE`, `UPDATE`,
  and `DELETE` operations on the watched table failed — including those issued by
  a root user — for as long as the registration remained active. Registering the `LIVE`
  required `select` permission on the table; no other permission on the table was
  needed."
