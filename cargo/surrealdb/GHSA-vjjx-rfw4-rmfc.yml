title: "SurrealDB: Graph traversal bypasses table SELECT permissions"
description: "An authenticated record or scope user could read records on any table
  reachable through a graph edge or `REFERENCES TO` back-reference, regardless of
  that table's `PERMISSIONS FOR select` clause.\n\nTraversing `SELECT * FROM source->edge->target`
  returned full documents from `target` even when `target` was defined as `PERMISSIONS
  FOR select NONE`. The same bypass extended through multi-hop chains, so any table
  reachable by a sequence of edges from a readable starting point was exposed.\n\nThe
  root cause: `GraphEdgeScan` and `ReferenceScan` fetched records straight from storage
  without routing them through `Document::pluck_select`, so the target table's permission
  expression was never consulted."
