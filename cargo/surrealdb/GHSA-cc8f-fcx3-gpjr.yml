title: "SurrealDB: Arbitrary file read via DEFINE ANALYZER mapper() filter"
description: "SurrealDB's full-text search lets you define a text analyzer whose `mapper`
  filter loads a term-mapping file from disk (`DEFINE ANALYZER ... FILTERS mapper('<path>')`).
  A database user with the `EDITOR` or `OWNER` role could point that filter at any
  file the SurrealDB process can read and have its content returned in the query's
  error message.\n\nFile access is meant to be restricted by the `SURREAL_FILE_ALLOWLIST`
  setting, but an empty allowlist applied no restriction at all — and empty is the
  default."
