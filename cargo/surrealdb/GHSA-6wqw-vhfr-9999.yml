package_slug: "cargo/surrealdb"
title: "SurrealDB: Authenticated subscribers can read records hidden by SELECT permissions
  via LIVE subscriptions"
description: "A record user could read records the table's SELECT permission expression
  should have hidden, when that expression referenced `$value`, `$before`, `$after`,
  or `$event`. Binding a chosen value to that name before registering a `LIVE SELECT`
  caused notifications to evaluate the permission against the attacker's input instead
  of the real document."
