title: "SurrealDB: Authenticated callers can read fields hidden by field-level SELECT
  permissions via error messages"
description: "A record user with UPDATE access could read field values that field-level
  SELECT permissions hid from them. Arithmetic operators and `extend` embedded the
  raw operand into their error messages, and UPDATE permission checks evaluate against
  the unreduced document — so triggering such an error against a hidden field returned
  its value in the resulting error."
