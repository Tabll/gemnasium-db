package_slug: "cargo/surrealdb"
title: "SurrealDB: HTTP RPC Session Race Condition Allows Privilege Escalation"
description: "The HTTP `/rpc` endpoint has a time-of-check/time-of-use (TOCTOU) race
  condition on internal session state. When authenticated and unauthenticated requests
  are processed concurrently, the unauthenticated request can inherit the authenticated
  user's session and privileges. The `/rpc` endpoint is the primary interface used
  by all official SurrealDB SDKs.\n\nThe HTTP `/rpc` handler does not bind each incoming
  request to an isolated session context. Instead, concurrent requests share mutable
  authentication state. When an authenticated request sets the session context and
  an unauthenticated request races in before it is cleared, the unauthenticated request
  executes with the authenticated user's privileges.\n\nThe impact depends on the
  privilege level of the session that is hijacked. If a root or namespace-level user
  session is inherited, the attacker can read and modify any data, delete records,
  and create persistent namespace-level users. If a scoped record user session is
  inherited, the attacker is limited to that user's permissions.\n\nThe attack requires
  no credentials, tokens, or session knowledge — only the ability to send concurrent
  HTTP requests to the `/rpc` endpoint while legitimate authenticated traffic is active."
