package_slug: "cargo/surrealdb"
title: "SurrealDB has bypass of field-level SELECT permissions through JSON Patch
  `copy` and `move` with empty `from`"
description: "SurrealDB lets callers modify records using JSON Patch operations via
  the `UPDATE … PATCH` statement (and SDK equivalents such as `db.patch()`). One of
  those operations is `copy`, which duplicates one field's value into another field
  of the same record. A `PATCH` with an empty `from` — for example, `UPDATE thing:1
  PATCH [{ op: 'copy', from: '', path: '/leak' }]` — was treated as \"copy the entire
  record\" and duplicated every field, including fields the caller has no permission
  to read, into the destination field the caller chose. The permission filter that
  hides protected field values from the response only knew to hide the *original*
  protected field names, not the new destinations, so the protected values were returned
  to the caller intact under the new field name."
