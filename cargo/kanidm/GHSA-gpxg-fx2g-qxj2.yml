package_slug: "cargo/kanidm"
title: "Kanidm: Stored HTML injection in \"passkey-enrolment\" partial via displayname
  → htmx-driven authenticated request forgery"
description: "The kanidmd web UI renders the WebAuthn passkey-registration challenge
  as raw JSON inside an inline `<script id=\"data\">` element using the Askama `|safe`
  filter. The challenge embeds the account's `displayname`, which `serde_json` serialises
  without escaping `<`/`>`. A `displayname` containing `</script>` therefore terminates
  the script element early and injects arbitrary HTML into the credential-update page.
  Because the page is htmx-driven and the server's CSP allows `'unsafe-eval'`, injected
  `hx-*` attributes can issue authenticated same-origin API requests with the viewer's
  bearer cookie."
