package_slug: "cargo/kanidm"
title: "Kanidm has non-constant-time comparison of OAuth2 client_secret"
description: "The kanidmd OAuth2 token-exchange (`/oauth2/token`) and token-introspection
  (`/oauth2/token/introspect`) endpoints compare the supplied `client_secret` against
  the stored secret using Rust's `PartialEq` on `String`, which short-circuits on
  the first mismatching byte. This produces an observable timing discrepancy that
  varies with the length of the matching prefix."
