title: "rpassword affected by partial password reveal when input is interrupted "
description: "rpassword maintainers were made aware of a possible issue with a partial
  password reveal when input is interrupted.\n\nTo quote @squell:\n\n> @conradkleinespel
  I've confirmed this problem with SequoiaPGP, which I think uses rpassword, e.g.:\n>\n>
  Suppose we use pkill -9 sq in a different terminal right after the password has
  been typed in:\n>\n> $ sq key generate --userid \"barf\" --with-password\n> Enter
  password to protect the key: Killed\n> $ hello^C\n>\n> Where the password I typed
  in is \"hello\".\n\nThis has been fixed in version v7.5.0 and above."
