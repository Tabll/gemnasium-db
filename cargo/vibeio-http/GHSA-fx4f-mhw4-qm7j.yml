package_slug: "cargo/vibeio-http"
title: "vibeio-http has a DoS vulnerability in HTTP/1.x chunked encoding parser triggered
  by maliciously crafted chunk lengths"
description: "When using the affected versions of the `vibeio-http` crate, an attacker
  could craft a malicious HTTP/1.x request with a large chunk length (between `usize::MAX
  - 1` and `usize::MAX` inclusive) and send it, causing the server to crash (integer
  overflow panic in debug builds, split_to out of bounds panic in release builds).\n\nThis
  was fixed in `vibeio-http` 0.3.2 by erroring on the chunk length if it exceeds `usize::MAX
  - 2` (using `checked_add()` instead of `+` operator), preventing integer overflow."
