package_slug: "cargo/zaino-state"
title: "zaino-state has a Non-Finalized State Reorg — No Cycle Detection or Depth
  Limit"
description: "`NonFinalizedState::handle_reorg` is a recursive, unbounded async function
  that traverses parent blocks until it finds a common ancestor on the main chain.
  It has **no recursion depth limit** and **no cycle detection**. A malicious or buggy
  validator can serve a block whose `previous_block_hash` points back to itself (or
  forms a cycle with other blocks), causing `handle_reorg` to infinite-loop, consuming
  100% CPU and never making sync progress. Additionally, `update()` contains an `.expect(\"empty
  snapshot impossible\")` that panics if the non-finalized snapshot becomes empty
  after trimming finalized blocks."
