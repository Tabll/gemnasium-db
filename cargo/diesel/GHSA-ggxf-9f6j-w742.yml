package_slug: "cargo/diesel"
title: "Diesel has possible use after free when deserializing a SQLite database via
  `SqliteConnection::deserialize_readonly_database`"
description: "Diesel allows loading a SQLite database from a byte buffer, represented
  as `&[u8]`, at runtime via the `SqliteConnection::deserialize_readonly_database`
  function. In previous versions of Diesel, this buffer was passed directly to libsqlite3.
  Since libsqlite3 requires the buffer to remain alive for as long as the database
  connection is open and Diesel did not ensure this as part of its safe API, callers
  of `SqliteConnection::deserialize_readonly_database` could drop the buffer prematurely.
  This prematurely drop caused libsqlite3 to operate on freed memory.\n\nThis vulnerability
  affects users of `SqliteConnection::deserialize_readonly_database` who drop the
  buffer passed to the function before they drop the database connection."
