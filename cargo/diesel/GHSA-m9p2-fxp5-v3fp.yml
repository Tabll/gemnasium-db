package_slug: "cargo/diesel"
title: "Diesel: Command injection in Diesel's implementation of `COPY FROM`/`COPY
  TO`"
description: "Diesel allows users to configure various options for PostgreSQL's `COPY
  FROM` and `COPY TO` statements. These configurations are partially provided as strings
  or characters.\n\nDiesel did not check if any these user-provided options contain
  a quote character `'`, which can lead to the injection of additional options in
  the current `COPY FROM`/`COPY TO` statement.\n\nThis vulnerability affects any user
  of `COPY FROM`/`COPY TO` that passes user-provided input to any of the affected
  functions. It can result in modifications of options in the current statement, but
  it is not possible inject additional statements."
