package_slug: "cargo/uv"
title: "uv is vulnerable to arbitrary file write through entry point names"
description: "In versions of uv prior to 0.11.15, when installing a distribution containing
  an entry point specification (under `console_scripts` or `gui_scripts`), uv would
  place the generated entry point according to the given name even if doing so resulted
  in a path outside of the environment's scripts directory.\n\nA malicious wheel could
  use this to place an executable outside of the intended environment, including in
  a directory already present on the user's `PATH`. This could shadow or overwrite
  an existing executable and potentially result in unexpected code execution under
  the wheel's control, even if the wheel's installation environment was not explicitly
  added to `PATH` by the user.\n\nIn order to exploit this vulnerability, the attacker
  must induce their target into installing a malicious wheel."
