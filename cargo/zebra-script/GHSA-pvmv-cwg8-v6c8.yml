package_slug: "cargo/zebra-script"
title: "Zebra v4.4.0 still accepts V5 SIGHASH_SINGLE without a corresponding output"
description: "Zebra failed to enforce a ZIP-244 consensus rule for V5 transparent
  transactions: when an input is signed with `SIGHASH_SINGLE` and there is no transparent
  output at the same index as that input, validation must fail. Zebra instead asked
  the underlying sighash library to compute a digest, and that library produced a
  digest over an empty output set rather than failing. An attacker could craft a V5
  transaction with more transparent inputs than outputs that Zebra accepts but `zcashd`
  rejects, creating a consensus split between Zebra and `zcashd` nodes."
