title: "rmcp OAuth client fetches server-controlled resource_metadata URLs"
description: "The `rmcp` OAuth client accepts a server-controlled `resource_metadata=`
  URL from the `WWW-Authenticate` header and fetches it without same-origin or private-network
  validation.\n\nAn attacker-controlled MCP server can return a `401 WWW-Authenticate:
  Bearer resource_metadata=\"...\"` header pointing at an internal URL, including
  localhost, RFC 1918 addresses, or cloud metadata endpoints. The client then performs
  an outbound GET to that URL from the victim application's network context."
